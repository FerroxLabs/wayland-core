[package]
name = "wcore-channel-email"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Email (SMTP outbound + IMAP inbound) channel adapter for Wayland-Core"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
# `default-features = false` drops the crate's `tls` feature, which is
# native-tls, which on Linux is OpenSSL. That edge was the ONE reason anything
# in this workspace linked libssl: `cargo tree -i openssl-sys` on 86f1ddbc had a
# single root, native-tls, reached only from here. The two `#[cfg(feature =
# "tls")]` entry points it also removes (`imap::connect`, `imap::connect_starttls`)
# are reimplemented on rustls in `src/imap.rs`, over the crate's own
# stream-generic `Client::new`.
#
# This replaces the `native-tls = { features = ["vendored"] }` of #1128. Vendoring
# satisfied the same requirement — no libssl.so.3 on the host — by statically
# linking an OpenSSL we would then own for CVE purposes, and by requiring `make`
# and perl in every image that builds this workspace (the CI image has neither,
# which is what reddened `CI (linux-containerized)`). Removing the dependency
# removes the runtime requirement at the root instead.
imap = { version = "2", default-features = false }
# The IMAP TLS legs. Same rustls 0.23 / ring stack the SMTP leg and the rest of
# the workspace already use; adds no new crate to the graph.
rustls = { workspace = true }
# OS trust store, which is where native-tls (OpenSSL default verify paths, found
# via openssl-probe) read its anchors from, so IMAP accepts the same
# certificates it did before. Already in the graph via reqwest/hyper-rustls.
rustls-native-certs = "0.8"
# Used to COUNT the anchors in `smtp.tls_root_cert_path` with the same parser
# lettre uses. Needed because lettre's `Certificate::from_pem` returns Ok on
# input containing no PEM block (empty anchor set) on the rustls path — see
# `smtp::build_tls_params`. Already resolved transitively; adds no new crate.
rustls-pki-types = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }

wcore-channels = { workspace = true }
wcore-config = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
# `tests/smtp_tls_root_live.rs` stands up a real STARTTLS SMTP relay on a
# loopback socket with a throwaway private CA, so the reply leg is proven
# against an actual TLS handshake rather than a mock. Test-only.
#
# `rcgen` mints the CA + relay certificate in-process, which is what keeps that
# test portable and always-executed: no openssl binary, no committed private
# key, no `#[ignore]`, nothing to skip on a platform that lacks a tool.
rcgen = "0.14"
# Matches the workspace rustls 0.23 / tokio-rustls 0.26 stack (ring, no
# openssl / aws-lc-rs) so the test relay links the same provider the SMTP
# client already uses. (`rustls` itself is a normal dependency now — see above.)
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Needed to construct the `lettre::Message` handed to `MailSender::send`;
# integration tests do not inherit the crate's own [dependencies].
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
tempfile = { workspace = true }
