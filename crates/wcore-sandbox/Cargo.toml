[package]
name = "wcore-sandbox"
description = "Container-isolated tool execution for wayland-core (M5.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# M5.1 — sandboxed tool execution. Default build is dep-light; the Docker
# backend lives behind the `live-docker` feature so the smoke test and the
# bollard transitive graph stay out of the default workspace build.

[dependencies]
wcore-types.workspace = true
serde       = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace        = true
thiserror.workspace   = true
tokio       = { workspace = true, features = ["rt", "macros", "time", "process", "io-util"] }
tokio-util.workspace  = true
tracing.workspace     = true
uuid.workspace        = true
async-trait.workspace = true
cap-std = "=3.4.5"
bollard = { version = "0.17", optional = true, default-features = false, features = ["ssl"] }
futures = { workspace = true, optional = true }
which = "6"

# Used by the sandbox-exec backend (macOS) to materialise the SBPL profile
# to disk; tiny cross-platform dep so it stays unconditional rather than
# behind a cfg.
tempfile.workspace = true
tar.workspace = true

[features]
default = []
# Containment-probe assertion helpers (`test_support`), shared by this crate's
# own integration tests and by downstream crates that make containment claims.
# Off by default so the helpers never ship in a release binary; this crate's
# tests get it via the self dev-dependency below.
test-support = []
live-docker = ["dep:bollard", "dep:futures"]
# S3 — Landlock LSM ruleset applied to bwrap child via `pre_exec` (Linux-only).
# Gated so macOS/Windows CI does not need to depend on the Linux-only crate.
landlock = ["dep:landlock"]
# S4 — seccomp-bpf filter compiled in-process and handed to bwrap via
# `--seccomp <fd>` (Linux-only). Gated because libseccomp-sys requires the
# system libseccomp C library at link time which is not available on macOS/
# Windows runners.
seccomp = ["dep:libseccomp"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock   = { version = "0.4", optional = true }
libseccomp = { version = "0.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_IO",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_StationsAndDesktops",
  # `CreateDesktopW` takes a `DEVMODEW*`, so windows-sys gates it on the GDI
  # feature even though this crate passes NULL and links no GDI symbol.
  "Win32_Graphics_Gdi",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Self dev-dependency so this crate's own integration tests (which do not get
# `cfg(test)`) can reach `wcore_sandbox::test_support` under a plain
# `cargo test`, without the helpers being compiled into a release build.
wcore-sandbox = { path = ".", features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
