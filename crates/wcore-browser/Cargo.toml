[package]
name = "wcore-browser"
description = "Multi-backend browser tool family (Camoufox sidecar primary, Browserbase cloud) — design §5.16"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
rust-version.workspace = true

[features]
# Default is Camoufox sidecar (HTTP) only. The cloud backend is opt-in.
default = []
# Browserbase cloud — env-gated at runtime (BROWSERBASE_API_KEY/PROJECT_ID).
browserbase = []

[dependencies]
wcore-types.workspace    = true
wcore-tools.workspace    = true
wcore-protocol.workspace = true
wcore-config.workspace   = true
wcore-sandbox.workspace  = true

async-trait.workspace = true
tokio.workspace       = true
tokio-util.workspace  = true
futures.workspace     = true
reqwest.workspace     = true
wcore-egress.workspace = true
serde.workspace       = true
serde_json.workspace  = true
base64.workspace      = true
anyhow.workspace      = true
thiserror.workspace   = true
tracing.workspace     = true
url.workspace         = true
ipnet = "2"
parking_lot.workspace = true
# 27-C2(b): the liveness probe resolves the sidecar binary on PATH WITHOUT
# executing it (bootstrap.rs's `<command> --help` preflight note). `which` is
# PATHEXT-aware on Windows; same version wcore-sandbox already pins.
which = "6"
# gh#1117 - locating the Camoufox install to write the loopback egress pref
# into. Same crate the plugin manifest loader already uses for HOME.
dirs.workspace = true

# F7 — archive extraction for the opt-in Camoufox binary provisioning path.
# Format is chosen by magic bytes, so both are needed on every platform.
tar.workspace    = true
flate2.workspace = true
zip.workspace    = true

# Wave BR — supervisor uses libc::kill(pid, 0) for parent-PID liveness probes.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }


workspace-hack.workspace = true

[dev-dependencies]
tokio       = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock.workspace = true
tempfile.workspace = true
serial_test.workspace = true
