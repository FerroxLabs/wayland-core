[package]
name = "wcore-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ACP (Agent Client Protocol) server + client for Wayland-Core"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# "time" backs the #305 c3 turn-stall guard (`tokio::time::timeout`) in
# `server::AcpServer::guard_stall`.
tokio = { workspace = true, features = ["sync", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.24"
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
wcore-config = { path = "../wcore-config" }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
wcore-egress = { workspace = true }
bytes = "1"
# OpenAPI 3.1.0 doc generation for the REST transport (transport::rest).
# Emitted 3.0.3 under utoipa 4; the 4->5 bump (RUSTSEC-2024-0370) moved it to
# 3.1.0. The emitted version and nullable encoding are pinned by
# tests/openapi_contract.rs against tests/fixtures/openapi/rest-openapi-shape.json.
utoipa = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# #305 c2 — the persisted project allowlist is exercised against a real file.
tempfile.workspace = true
