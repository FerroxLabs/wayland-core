[package]
name = "wcore-channels-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Per-platform factory dispatch + on-disk auto-registration for wcore-channels (v0.8.1 U5)"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
toml = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }

wcore-channels = { workspace = true }
wcore-config = { path = "../wcore-config" }
wcore-channel-slack = { workspace = true }
wcore-channel-telegram = { workspace = true }
wcore-channel-email = { workspace = true }
wcore-channel-discord = { workspace = true }
wcore-channel-sms = { workspace = true }
wcore-channel-whatsapp = { workspace = true }
wcore-channel-signal = { workspace = true }
# F-045 (W7-M): iMessage + Matrix + MS Teams adapters.
wcore-channel-matrix  = { workspace = true }
wcore-channel-msteams = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
wcore-channel-imessage = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `time` is for tests/matrix_cap_replay.rs — it sleeps between the sends and
# the independent room read so the homeserver has settled before it is counted.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# tests/live_slack_actions.rs — reads writes back from the real Slack Web API
# (the adapter has no read path; it receives by webhook) and signs an Events API
# payload with an implementation independent of the adapter's own.
serde_json = { workspace = true }
wcore-egress = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
hex = "0.4"
# tests/matrix_live_room.rs — the two live legs both build a production matrix
# adapter whose /sync cursor lives under `$WAYLAND_HOME`, and one of them
# repoints that process-global. `cargo test` runs them as threads of one
# process, so they take the same lock instead of racing.
serial_test = { workspace = true }
