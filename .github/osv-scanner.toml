#     untrusted input both advisories are about.
#   * It claimed nothing patched existed to bump to. Both advisories declare
#     `patched = [">= 0.41.0"]` with no `unaffected` range (so 0.31.0 counted
#     too, and the true finding count was FOUR, not two), and quick-xml
#     0.41.0 / plist 1.10.0 / calamine 0.36.1 were all published already.
#
# Fix: workspace pins moved to quick-xml "0.41" and calamine "0.36"; plist
# resolved 1.9.0 -> 1.10.0. quick-xml 0.31.0 and 0.39.4 are gone from
# Cargo.lock (`cargo tree -i quick-xml@0.39.4` -> "did not match any
# packages"). Verified by `cargo audit` with NO ignore list: 4 vulnerabilities
# before, 0 after. Do NOT float quick-xml below 0.41 or calamine below 0.36.
#
# Lesson for future entries in this file: a parent trace must be READ OUT of
