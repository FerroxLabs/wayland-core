#
#   * It named a "sole parent trace" of plist <- syntect <- wcore-cli. There
#     were THREE paths. `cargo tree -i` at the base commit also showed
#     quick-xml 0.39.4 as a DIRECT dependency of wcore-tools (default-on
#     `doc-extract` feature) and quick-xml 0.31.0 via calamine 0.26.1.
#   * Its "unreachable / embedded dumps only" argument was true of the syntect
#     path but said nothing about the two it omitted — `DocExtractTool`, which
