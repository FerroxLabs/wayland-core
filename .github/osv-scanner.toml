# ── proc-macro-error 1.0.4 — REMOVED 2026-07-29, ELIMINATED AT SOURCE ────
# RUSTSEC-2024-0370 carried an `[[IgnoredVulns]]` entry here until lane
# 29-deny. It is DELETED rather than re-justified: `cargo tree -i
# proc-macro-error@1.0.4` now reports "did not match any packages".
#
# The entry it replaces said the fix "is a breaking major; chasing it to clear
# a compile-time-only warning is not worth the REST-surface regression risk",
# echoing the workspace pin comment that claimed "utoipa 5 requires axum 0.8
# (a repo-wide bump)". Both were wrong, and cheaply checkable:
#   * Neither utoipa 4.2.3 nor utoipa 5.5.0 declares `axum` as a dependency,
#     optional or otherwise. `axum_extras` is a codegen-behaviour flag
#     forwarded to `utoipa-gen?/axum_extras`; the axum-0.8 coupling is
#     SEMANTIC (param inference from axum extractors), not a dependency.
#   * `wcore-acp/src/transport/rest.rs` does not rely on that inference — it
#     declares every path param explicitly and already used `{id}` syntax.
#   * Result: `cargo update -p utoipa` moved 2 packages and left 203 unchanged,
#     axum stayed at 0.7.9, and `cargo check -p wcore-acp --all-targets`
#     passed with ZERO source changes.
# The only real cost was wire-visible and small: `GET /openapi.json` now emits
# OpenAPI 3.1.0 instead of 3.0.3, and two assertions pinning "3.0" were updated
# to "3.1". Side benefit: the syn 1.x/2.x duplicate left the tree with it.
#
# Lesson, and it is the second one on this page: an "it would be a breaking
# major" cost estimate is a claim about the dependency graph, and claims about
# the graph must be READ OUT OF the graph. This one had been carried forward
# unverified across at least two files.
#
# Do NOT float `utoipa` back below 5 — it reintroduces this advisory.

