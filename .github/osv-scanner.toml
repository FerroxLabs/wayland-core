# all` ONCE PER RESOLVED VERSION of the crate — a crate can appear in the tree
# at several semver-incompatible versions at once, and an ignore entry that
# traces only one of them is a blind spot, not a disposition.

# ── paste 1.0.15 (unmaintained) ──────────────────────────────────────────
# TRACE CORRECTED 2026-07-29 (lane 29-deny). The previous text here read:
#
#   "pulled by the candle ML SIMD stack (gemm/gemm-common/pulp <- candle-core
#    <- candle-transformers, used by wcore-memory for local embeddings) AND by
#    ratatui"
#
# **`ratatui` does not pull `paste` at all.** Measured:
# `cargo tree -p ratatui --all-features -e normal | grep -c paste` -> 0. The
# entry named a parent that does not exist and omitted one that does. This is
# the same defect class as the quick-xml entry documented at the foot of this
# file, and it was found only because the trace was RE-DERIVED from the tool
# rather than carried forward on trust. That is now the required practice.
#
# Measured trace, `cargo tree -i paste@1.0.15 --all-features --target all
# --edges normal,build,dev`:
#   DIRECT PARENTS: 10 — gemm, gemm-c32, gemm-c64, gemm-common, gemm-f16,
#   gemm-f32, gemm-f64, pulp, macro_rules_attribute, tokenizers.
#   They collapse to TWO roots, both terminating at wcore-memory:
#     (a) {gemm*, pulp} <- candle-core 0.9.2 <- candle-nn/candle-transformers
#         <- wcore-memory
#     (b) macro_rules_attribute 0.2.2 <- tokenizers 0.21.4 <- wcore-memory
#         (paste is also a direct dep of tokenizers)
