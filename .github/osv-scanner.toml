# OSV-Scanner config for wayland-core.
#
# Posture (verified 2026-06-02, wasmtime now 36.0.10):
#   * 0 vulnerabilities. 0 Critical / High / Medium.
#   * The criticals OSV used to hide (wasmtime 9.2/9.0 CVSS) are FIXED at the
#     source — wasmtime + wasmtime-wasi upgraded 30 -> 36, unmaintained
#     yaml-rust dropped. Confirmed by `osv-scanner scan source -r ./`.
#   * What remains are 5 warning-class advisories (4 "unmaintained", 1
#     "unsound"), ALL transitive, each traced to its parent and each
#     genuinely irreducible without a regression or a pre-release dep. (A 6th,
#     lru, was eliminated at source via the ratatui 0.30 upgrade — see below.)
#
# Update 2026-07-29 (F29-02-H1): the two quick-xml entries that lived at the
# bottom of this file are DELETED — RUSTSEC-2026-0194 / RUSTSEC-2026-0195 were
# eliminated at source by bumping quick-xml to 0.41 and calamine to 0.36 (see
# the block at the end for the full account, including the three errors in the
# justification those entries carried). Measured with `cargo audit` against
# the post-bump lockfile and NO ignore list: 4 vulnerabilities before, 0 after.
# That run is cargo-audit's; `osv-scanner scan source -r ./` has NOT been
# re-run since, so the warning-class counts quoted above are as of 2026-06-02
# and may understate newer ambient advisories (cargo audit currently sees 7).
#
# Every entry below is a PUBLIC, DATED, REASONED disposition — not a silent
# mute. `ignoreUntil` forces a re-evaluation; on each dependency bump, re-run
# `osv-scanner scan source -r ./` and delete any entry whose advisory has
# cleared. An empty IgnoredVulns list is the goal whenever the ecosystem
# allows it.
#
# Parent trace recipe: run `cargo tree -i <crate>@<ver> --all-features --target
# all` ONCE PER RESOLVED VERSION of the crate — a crate can appear in the tree
# at several semver-incompatible versions at once, and an ignore entry that
# traces only one of them is a blind spot, not a disposition.

