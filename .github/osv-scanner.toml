# (ambient advisory, not a code change in this PR). Revisit when pdf-extract or
# lopdf move off ttf-parser, or migrate the PDF path to a maintained extractor.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = "2026-09-02T00:00:00Z"
reason = "ttf-parser unmaintained (patched=[]); transitive only via lopdf <- pdf-extract <- wcore-tools PDF text extraction. Informational, no patch exists; successor skrifa is an upstream pdf-extract/lopdf decision. Tracked; revisit on pdf-extract/lopdf bump."

# ── quick-xml DoS pair — REMOVED 2026-07-29, ELIMINATED AT SOURCE ────────
# RUSTSEC-2026-0194 (quadratic duplicate-attribute check) and
# RUSTSEC-2026-0195 (unbounded NsReader namespace-declaration allocation),
# both published 2026-06-29, both fixed only in quick-xml >= 0.41.0.
#
# These two carried `[[IgnoredVulns]]` entries here until F29-02-H1. Those
# entries are DELETED rather than re-justified, because the advisories are now
# absent from the tree — and because the justification they carried was wrong:
#
#   * It named a "sole parent trace" of plist <- syntect <- wcore-cli. There
#     were THREE paths. `cargo tree -i` at the base commit also showed
#     quick-xml 0.39.4 as a DIRECT dependency of wcore-tools (default-on
#     `doc-extract` feature) and quick-xml 0.31.0 via calamine 0.26.1.
#   * Its "unreachable / embedded dumps only" argument was true of the syntect
#     path but said nothing about the two it omitted — `DocExtractTool`, which
#     parses docx/pptx and xlsx/ods from USER-SUPPLIED files, i.e. exactly the
#     untrusted input both advisories are about.
#   * It claimed nothing patched existed to bump to. Both advisories declare
#     `patched = [">= 0.41.0"]` with no `unaffected` range (so 0.31.0 counted
#     too, and the true finding count was FOUR, not two), and quick-xml
#     0.41.0 / plist 1.10.0 / calamine 0.36.1 were all published already.
#
# Fix: workspace pins moved to quick-xml "0.41" and calamine "0.36"; plist
# resolved 1.9.0 -> 1.10.0. quick-xml 0.31.0 and 0.39.4 are gone from
# Cargo.lock (`cargo tree -i quick-xml@0.39.4` -> "did not match any
# packages"). Verified by `cargo audit` with NO ignore list: 4 vulnerabilities
# before, 0 after. Do NOT float quick-xml below 0.41 or calamine below 0.36.
#
# Lesson for future entries in this file: a parent trace must be READ OUT of
# `cargo tree -i <crate>@<ver>` for EVERY resolved version of the crate, and
# the count of paths stated explicitly. A reachability argument that covers
# one path of three is not a disposition, it is a blind spot.
