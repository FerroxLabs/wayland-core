# Both roots sit behind wcore-memory's OPTIONAL, default-OFF `bge-local`
# feature, so paste is absent from the default-feature graph entirely
# (`cargo tree -i paste@1.0.15` without --all-features -> "did not match any
# packages"). Build-time proc-macro; no runtime surface; no maintained drop-in
# replacement. Re-evaluate when candle or tokenizers drop it.
