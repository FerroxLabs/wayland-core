name: Nightly Mutation Tests (advisory)

# Schedule: 06:00 UTC = 13:00 ICT (Sean's GMT+7)
# Full nightly per no-rotation policy (AGENTS.md §8).
# Each crate is an independent matrix job; GHA concurrency throttles naturally.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Optional shard override (e.g. 1/4). Leave empty for full run."
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: mutants-nightly
  cancel-in-progress: false   # Never cancel an in-flight nightly

jobs:
  # Broad survey is advisory. The stabilization release producer consumes
  # enumerated command evidence; this aggregate summary cannot promote.
  mutants:
    name: "mutants / ${{ matrix.crate }}"
    runs-on: macos-latest
    strategy:
      fail-fast: false          # Every crate gets its own result
      matrix:
        include:
          # ─────────────────────────────────────────────────────────────────
          # Crate             | Baseline mutants | Estimated wall-time (full)
          # ─────────────────────────────────────────────────────────────────
          # wcore-cron        | 54               | ~10 min   (deterministic)
          # wcore-config      | 494              | ~90 min   (slow test suite)
          # wcore-providers   | 834              | ~160 min  (mostly unnetworked)
          # wcore-agent       | 2012             | ~6 hr     (large; has flaky bootstrap test)
          # wcore-cli         | 2007             | ~6 hr     (large)
          # ─────────────────────────────────────────────────────────────────
          # NOTE: wcore-agent and wcore-cli have pre-existing test failures
          # that block cargo-mutants in copy-workspace mode. Run with
          # --in-place to avoid workspace copy issues. See strategy doc
          # .blackboard/E2E-MUTATION-BASELINE-2026-05-24.md §5.
          # ─────────────────────────────────────────────────────────────────
          # min_test_timeout is a FLOOR, not a ceiling on the baseline. See the
          # long comment on the `cargo mutants` invocation below: `--timeout`
          # is documented by cargo-mutants 27.1.0 as "maximum run time for ALL
          # cargo commands", so it also bounded the UNMUTATED baseline and
          # censored it on four of five crates (core#451). The per-mutant test
          # timeout is now derived from the measured baseline; these numbers
          # only stop a very fast baseline from deriving an unrealistically
          # tight bound.
          # ─────────────────────────────────────────────────────────────────
          - crate: wcore-cron
            scope: "in"
            min_test_timeout: 90
            in_place: "false"
            estimated_minutes: 10

          - crate: wcore-config
            scope: "out"
            out_of_scope_reason: "measured 2026-09-10 run 34438249721: cancelled at 360.4 min against a 90 min estimate"
            min_test_timeout: 180
            in_place: "true"
            estimated_minutes: 90

          - crate: wcore-providers
            scope: "out"
            out_of_scope_reason: "measured 2026-09-10 run 34438249721: cancelled at 360.7 min against a 160 min estimate"
            min_test_timeout: 60
            in_place: "false"
            estimated_minutes: 160

          - crate: wcore-agent
            scope: "out"
            out_of_scope_reason: "measured 2026-09-10 run 34438249721: cancelled at 360.3 min; estimate was already 6 hr"
            min_test_timeout: 120
            in_place: "true"
            estimated_minutes: 360

          - crate: wcore-cli
            scope: "out"
            out_of_scope_reason: "measured 2026-09-10 run 34438249721: cancelled at 360.4 min; estimate was already 6 hr"
            min_test_timeout: 120
            in_place: "true"
            estimated_minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Setup vx (installs Rust + just from vx.toml)
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      # Restore Cargo registry + build artefacts to cut incremental compile time
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-reg-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-reg-${{ runner.os }}-

      - name: Cache cargo build (per-crate)
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-mutants-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-target-mutants-${{ runner.os }}-${{ matrix.crate }}-
            cargo-target-mutants-${{ runner.os }}-

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # Resolve shard: use workflow_dispatch input if provided, else full run
      - name: Resolve shard arg
        id: shard
        env:
          SHARD_INPUT: ${{ github.event.inputs.shard }}
        run: |
          if [ -n "${SHARD_INPUT}" ]; then
            echo "arg=--shard ${SHARD_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      # core#451 c1 -- a leg either produces a summary line or is EXPLICITLY and
      # DURABLY declared out of scope with a recorded reason. No leg silently
      # produces nothing. The declaration is written into the uploaded artifact,
      # not only into the job log, so the artifact a reader downloads says why
      # it holds no mutants rather than looking like a run that failed quietly.
      #
      # WHY THESE FOUR ARE OUT: measured, not assumed. In run 34438249721
      # (workflow_dispatch, head fdf4b1e1c) wcore-cron finished in 28.2 min and
      # the other four were CANCELLED at 360.3-360.7 min -- GitHub's 6-hour job
      # ceiling -- so they tested zero mutants and uploaded no artifact at all.
      # Two of the four had estimates far under what they actually took
      # (wcore-config 90 min estimated, wcore-providers 160), so the estimates in
      # the table above are not a basis for re-enabling them either.
      #
      # TO RE-ENABLE ONE: shard it so a shard finishes inside the ceiling, or
      # move it to a runner without that ceiling, then flip `scope` to "in".
      # Do NOT flip it back on an estimate.
      - name: Declare leg scope (core#451 c1)
        id: scope
        env:
          CRATE: ${{ matrix.crate }}
          SCOPE: ${{ matrix.scope }}
          REASON: ${{ matrix.out_of_scope_reason }}
        run: |
          mkdir -p .blackboard/E2E-MUTATION-BASELINE
          if [ "$SCOPE" = "out" ]; then
            if [ -z "$REASON" ]; then
              echo "::error title=Undeclared out-of-scope leg::${CRATE} is scope=out with no out_of_scope_reason. An undeclared skip is exactly what core#451 c1 forbids."
              exit 1
            fi
            printf '%s\n' \
              "OUT OF SCOPE: ${CRATE}" \
              "reason: ${REASON}" \
              "declared-in: .github/workflows/mutants-nightly.yml (matrix.scope)" \
              "carrier: FerroxLabs/wayland-core#451" \
              "This leg tested ZERO mutants by declaration, not by failure." \
              > ".blackboard/E2E-MUTATION-BASELINE/${CRATE}-OUT-OF-SCOPE.txt"
            echo "::notice title=Mutation leg out of scope::${CRATE}: ${REASON}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run cargo-mutants (${{ matrix.crate }})
        id: mutants
        if: steps.scope.outputs.skip != 'true'
        env:
          CRATE: ${{ matrix.crate }}
          MIN_TEST_TIMEOUT: ${{ matrix.min_test_timeout }}
          TIMEOUT_MULTIPLIER: "5"
          IN_PLACE: ${{ matrix.in_place }}
          SHARD_ARG: ${{ steps.shard.outputs.arg }}
        run: |
          mkdir -p .blackboard/E2E-MUTATION-BASELINE

          # Clear any stale output from a cached `target/` restore. A leftover
          # mutants.out/lock.json produced "Resource temporarily unavailable"
          # lock waits, and a half-written run produced "File exists (os error
          # 17)" — both crashed cargo-mutants before it printed a summary,
          # which is what filed the empty "surviving mutants: none" issues.
          rm -rf "target/mutants-${CRATE}"

          # cargo-mutants does NOT create the parent of `--output`. On a runner
          # with no `target/` -- which is every run, because the cache below
          # has never had anything to save -- it exits immediately with
          #   Error: create output parent directory "target/mutants-<crate>"
          #     No such file or directory (os error 2)
          # That is what killed all 87 runs of this workflow, each in under 40
          # seconds, and it was self-sustaining: no target/ -> mutants fails ->
          # nothing is built -> "Path Validation Error: Path(s) specified in
          # the action for caching do(es) not exist" -> no cache -> no target/.
          mkdir -p target

          IN_PLACE_FLAG=""
          if [ "${IN_PLACE}" = "true" ]; then
            IN_PLACE_FLAG="--in-place"
          fi

          # Per cargo-mutants 27.1.0 `--help`, `-t, --timeout` is the "maximum
          # run time for ALL cargo commands" -- INCLUDING the unmutated
          # baseline. Passing it therefore censors the very measurement the
          # per-mutant timeout is supposed to be derived from. Run
          # 33844721279 (macos-latest, main @ 57e2a244e) shows exactly that:
          #   wcore-cron       ok       Unmutated baseline in  203s build +   5s test  (--timeout 90)
          #   wcore-config     TIMEOUT  Unmutated baseline in  307s build + 180s test  (--timeout 180)
          #   wcore-providers  TIMEOUT  Unmutated baseline in  457s build +  60s test  (--timeout 60)
          #   wcore-cli        TIMEOUT  Unmutated baseline in 1009s build + 120s test  (--timeout 120)
          #   wcore-agent      TIMEOUT  Unmutated baseline in 2011s build + 120s test  (--timeout 120)
          # Every censored value equals its own `--timeout` to the second, and
          # each leg ends "cargo test failed in an unmutated tree, so no
          # mutants were tested". The BUILD phase was never the constraint --
          # that run's debug.log records `timeouts=Timeouts { build: None,
          # test: Some(90s) }`, so builds ran unbounded and completed.
          # So: no `--timeout`. The baseline test run is unbounded (bounded
          # only by the job) and therefore MEASURED, and each mutant's test
          # timeout is derived from that measurement as
          # max(min_test_timeout, multiplier x measured baseline test time).
          # The old per-crate numbers survive only as that floor, where they
          # can be too generous but can no longer be a censor. core#451.
          set +e   # capture exit code; don't fail the step immediately
          # shellcheck disable=SC2086
          cargo mutants \
            -p "${CRATE}" \
            --no-shuffle \
            --timeout-multiplier "${TIMEOUT_MULTIPLIER}" \
            --minimum-test-timeout "${MIN_TEST_TIMEOUT}" \
            ${IN_PLACE_FLAG} \
            --output "target/mutants-${CRATE}" \
            ${SHARD_ARG} \
            2>&1 | tee ".blackboard/E2E-MUTATION-BASELINE/${CRATE}.log"
          MUTANTS_EXIT=${PIPESTATUS[0]}   # cargo's code, not tee's

          # Parse the summary line, e.g.
          #   "54 mutants tested in 2m: 9 missed, 28 caught, 17 unviable".
          # If the run crashed before printing it, the grep finds nothing and
          # `real_data` is false — the report step then skips issue filing so
          # we never post a content-free issue again.
          SUMMARY=$(grep "mutants tested in" ".blackboard/E2E-MUTATION-BASELINE/${CRATE}.log" | tail -1)
          if [ -n "${SUMMARY}" ]; then
            REAL_DATA="true"
          else
            REAL_DATA="false"
            SUMMARY="no summary (cargo-mutants did not complete — exit ${MUTANTS_EXIT})"
          fi
          echo "real_data=${REAL_DATA}" >> "$GITHUB_OUTPUT"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${MUTANTS_EXIT}" >> "$GITHUB_OUTPUT"

          # Record the unmutated-tree measurement itself, machine-readable and
          # in the uploaded artifact, so the derived per-mutant timeout can be
          # told apart from a hopeful one without re-reading a 2 MB log. Only
          # a line WITHOUT the TIMEOUT marker is a measurement; a censored
          # baseline is recorded as censored, never as a duration. core#451 c2.
          BASELINE_LINE=$(grep -E "Unmutated baseline in [0-9]+s build \+ [0-9]+s test" \
            ".blackboard/E2E-MUTATION-BASELINE/${CRATE}.log" | tail -1)
          BUILD_SECONDS=$(echo "${BASELINE_LINE}" | grep -oE '[0-9]+s build' | grep -oE '[0-9]+')
          TEST_SECONDS=$(echo "${BASELINE_LINE}" | grep -oE '[0-9]+s test' | grep -oE '[0-9]+')
          if [ -n "${BASELINE_LINE}" ] && ! echo "${BASELINE_LINE}" | grep -q "TIMEOUT"; then
            BASELINE_MEASURED="true"
          else
            BASELINE_MEASURED="false"
          fi
          echo "baseline_measured=${BASELINE_MEASURED}" >> "$GITHUB_OUTPUT"
          cat > ".blackboard/E2E-MUTATION-BASELINE/${CRATE}-baseline.json" <<BASELINE_EOF
          {"crate": "${CRATE}", "measured": ${BASELINE_MEASURED},
           "build_seconds": ${BUILD_SECONDS:-null}, "test_seconds": ${TEST_SECONDS:-null},
           "censored_by_timeout_flag": $([ "${BASELINE_MEASURED}" = "true" ] && echo false || echo true),
           "timeout_multiplier": ${TIMEOUT_MULTIPLIER}, "minimum_test_timeout": ${MIN_TEST_TIMEOUT},
           "raw": "${BASELINE_LINE}", "run_id": "${GITHUB_RUN_ID:-unknown}", "runner_os": "${RUNNER_OS:-unknown}"}
          BASELINE_EOF

          # Compute catch rate from the summary (0/N/A when there is none).
          CAUGHT=$(echo "${SUMMARY}" | grep -oE '[0-9]+ caught' | grep -oE '[0-9]+' || echo 0)
          MISSED=$(echo "${SUMMARY}" | grep -oE '[0-9]+ missed' | grep -oE '[0-9]+' || echo 0)
          VIABLE=$((CAUGHT + MISSED))
          if [ "${VIABLE}" -gt 0 ]; then
            RATE=$(awk "BEGIN { printf \"%.1f\", (${CAUGHT} / ${VIABLE}) * 100 }")
          else
            RATE="N/A"
          fi
          echo "catch_rate=${RATE}%" >> "$GITHUB_OUTPUT"
          echo "caught=${CAUGHT}" >> "$GITHUB_OUTPUT"
          echo "missed=${MISSED}" >> "$GITHUB_OUTPUT"

          # Collect missed mutants for the issue body.
          MISSED_LINES=$(grep "^MISSED" ".blackboard/E2E-MUTATION-BASELINE/${CRATE}.log" | head -20)
          [ -z "${MISSED_LINES}" ] && MISSED_LINES="none"
          {
            printf 'missed_mutants<<MUTANTS_EOF\n'
            printf '%s\n' "${MISSED_LINES}"
            printf 'MUTANTS_EOF\n'
          } >> "$GITHUB_OUTPUT"

          # Surface a crash as a visible workflow annotation (the uploaded log
          # artifact has the detail) instead of an empty issue-tracker entry.
          if [ "${REAL_DATA}" != "true" ]; then
            echo "::warning title=mutants ${CRATE}::cargo-mutants did not produce a summary (exit ${MUTANTS_EXIT}); see the uploaded log artifact"
          fi

          # A leg that produced RESULTS never fails here, however bad the catch
          # rate: surviving mutants are a finding, and they flow via the issue
          # and the annotation. But a leg that produced NO DATA is a harness
          # failure, not a result, and swallowing it is what let this workflow
          # read `success` 87 times while measuring nothing. A gate that cannot
          # fail is worth exactly as much as one that cannot pass.
          if [ "${REAL_DATA}" != "true" ]; then
            echo "::error title=mutants ${CRATE}::no mutation data was produced (cargo-mutants exit ${MUTANTS_EXIT}). This is a harness failure, not a coverage result."
            exit 1
          fi
          exit 0
        shell: bash

      # Safety: --in-place may leave mutated source if the job is cancelled.
      # Restore the tree so the workspace is clean for artifact upload and
      # any subsequent steps. actions/checkout at the top handles this on
      # re-runs, but explicit restore is belt-and-suspenders.
      - name: Restore mutated source files (in-place safety net)
        if: always()
        run: git checkout -- .
        shell: bash

      - name: Upload mutation log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-log-${{ matrix.crate }}
          path: |
            .blackboard/E2E-MUTATION-BASELINE/${{ matrix.crate }}-OUT-OF-SCOPE.txt
            .blackboard/E2E-MUTATION-BASELINE/${{ matrix.crate }}.log
            .blackboard/E2E-MUTATION-BASELINE/${{ matrix.crate }}-baseline.json
            target/mutants-${{ matrix.crate }}/mutants.out/
          retention-days: 30

      # Open (or update) a GitHub issue ONLY when cargo-mutants actually
      # completed (real_data) AND found surviving mutants (missed != 0). A
      # crash with no summary files no issue — it surfaces as the ::warning::
      # annotation above instead, so the tracker never collects empty stubs.
      - name: Report red result to issue tracker
        if: steps.mutants.outputs.real_data == 'true' && steps.mutants.outputs.missed != '0'
        uses: actions/github-script@v7
        env:
          CRATE: ${{ matrix.crate }}
          CATCH_RATE: ${{ steps.mutants.outputs.catch_rate }}
          SUMMARY: ${{ steps.mutants.outputs.summary }}
          MISSED_MUTANTS: ${{ steps.mutants.outputs.missed_mutants }}
        with:
          script: |
            const crate   = process.env.CRATE;
            const rate    = process.env.CATCH_RATE;
            const summary = process.env.SUMMARY;
            const missed  = process.env.MISSED_MUTANTS;
            const runUrl  = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today   = new Date().toISOString().slice(0, 10);

            const title = `[mutants-nightly] ${crate} — surviving mutants (${today})`;
            const body = [
              `## Mutation test: \`${crate}\` — ${today}`,
              '',
              `**Catch rate**: ${rate}`,
              `**Summary**: ${summary}`,
              `**Run**: ${runUrl}`,
              '',
              '### Top surviving mutants (up to 20)',
              '```',
              missed,
              '```',
              '',
              'See `.blackboard/E2E-MUTATION-BASELINE-2026-05-24.md` for triage starter pack.',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: ['mutation-testing', crate],
            });

            const existing = issues.find(i => i.title.startsWith(`[mutants-nightly] ${crate}`));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner:  context.repo.owner,
                repo:   context.repo.repo,
                title,
                body,
                labels: ['mutation-testing', crate, 'test-debt'],
              });
            }
