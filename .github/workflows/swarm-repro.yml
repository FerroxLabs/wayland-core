name: Swarm macOS repro (temporary)

on:
  push:
    branches:
      - 'lane/swarmfix-repro*'

permissions:
  contents: read

jobs:
  repro:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustc -V && cargo -V
      - name: Build the workspace_authority test binary
        run: cargo test -p wcore-swarm --test workspace_authority --no-run
      - name: Environment facts
        run: |
          echo "TMPDIR=$TMPDIR"
          sysctl -n hw.ncpu
      - name: Hammer the race
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set +e
          BIN=$(find target/debug/deps -name 'workspace_authority-*' -type f -perm +111 | head -1)
          echo "BIN=$BIN"
          mkdir -p repro-logs
          fails=0
          for round in $(seq 1 30); do
            for i in $(seq 1 12); do
              (
                "$BIN" --exact independent_cli_processes_cannot_overbook_shared_capacity --nocapture \
                  > "repro-logs/r${round}_${i}.log" 2>&1
                echo "$?" > "repro-logs/r${round}_${i}.rc"
              ) &
            done
            wait
            for i in $(seq 1 12); do
              rc=$(cat "repro-logs/r${round}_${i}.rc" 2>/dev/null)
              if [ "x$rc" != "x0" ]; then
                fails=$((fails+1))
                echo "===== FAILURE round=$round copy=$i rc=${rc:-missing} ====="
                cat "repro-logs/r${round}_${i}.log"
                echo "===== END FAILURE ====="
              else
                rm -f "repro-logs/r${round}_${i}.log"
              fi
            done
            rm -f repro-logs/*.rc
            if [ "$fails" -ge 4 ]; then echo "enough evidence collected"; break; fi
          done
          echo "TOTAL FAILURES=$fails"
