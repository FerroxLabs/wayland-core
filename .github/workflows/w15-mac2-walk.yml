# THROWAWAY MEASUREMENT WORKFLOW — lane w15/mac2, release 0.13.14.
# Must never reach `main` or the release branch. Scoped to `measure/**`, which
# `ci.yml` does not list, so a push here costs one macOS runner and nothing else.
#
# wayland#1286 asks for the population's `--retries 0` RATE on native macOS.
# `redundant_walk_root_is_not_walked_twice` is the member that cannot supply it
# from CI: since 2026-09-07T16:20Z the macOS leg runs its binary in an isolated
# step at `--retries 0 --test-threads 1` and the main step EXCLUDES it, so its
# macOS results never enter the uploaded JUnit at all. That step has produced 19
# consecutive native-macOS greens — but `--test-threads 1` REMOVES the parallel
# contention this flake needs, so it changes the condition rather than measuring
# it, and its green is not evidence about the flake.
#
# This job restores the condition: default parallelism, and a second arm under a
# CPU load matching a saturated hosted runner, because during the real CI leg
# this binary used to execute inside a fully-loaded workspace run. A green from
# an idle host is a green from the wrong host.

name: w15-mac2 walk-identity macOS rate (THROWAWAY)

on:
  push:
    branches:
      - 'measure/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  walk-identity:
    name: "walk_parallel_identity_test @ --retries 0, parallel"
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Host facts
        run: |
          set -euo pipefail
          sw_vers
          echo "logical cpus: $(sysctl -n hw.logicalcpu)"

      - name: Confirm CI really does exclude this binary from the main step
        run: |
          set -uo pipefail
          echo "=== isolated step ==="
          /usr/bin/grep -n "walk_parallel_identity_test" .github/workflows/ci.yml | head -10
          echo "(if this prints nothing the premise of this job is wrong and its result means something else)"

      - name: Build
        run: vx cargo nextest run --locked -p wcore-tools --test walk_parallel_identity_test --no-run

      - name: "Arm A: default parallelism, idle host, n=20"
        run: |
          set -uo pipefail
          mkdir -p /tmp/walk-idle
          pass=0; fail=0
          for i in $(seq 1 20); do
            vx cargo nextest run --locked -p wcore-tools --test walk_parallel_identity_test \
              --profile ci --retries 0 --no-fail-fast --no-tests=fail \
              > "/tmp/walk-idle/run-${i}.log" 2>&1
            rc=$?
            if [ "$rc" = "0" ]; then pass=$((pass+1)); else fail=$((fail+1)); fi
            echo "idle invocation ${i}: rc=${rc}"
          done
          echo "WALK_IDLE_PASS=${pass} WALK_IDLE_FAIL=${fail}"

      - name: "Arm B: default parallelism under 2x-cpu load, n=20"
        run: |
          set -uo pipefail
          mkdir -p /tmp/walk-load
          n=$(( $(sysctl -n hw.logicalcpu) * 2 ))
          for _ in $(seq 1 "$n"); do ( while :; do :; done ) & done
          loadpids=$(jobs -p)
          echo "spinners: ${n}"
          pass=0; fail=0
          for i in $(seq 1 20); do
            vx cargo nextest run --locked -p wcore-tools --test walk_parallel_identity_test \
              --profile ci --retries 0 --no-fail-fast --no-tests=fail \
              > "/tmp/walk-load/run-${i}.log" 2>&1
            rc=$?
            if [ "$rc" = "0" ]; then pass=$((pass+1)); else fail=$((fail+1)); fi
            echo "loaded invocation ${i}: rc=${rc} loadavg=$(sysctl -n vm.loadavg)"
          done
          # shellcheck disable=SC2086
          kill $loadpids 2>/dev/null || true
          echo "WALK_LOAD_PASS=${pass} WALK_LOAD_FAIL=${fail}"

      - name: Grade
        if: always()
        run: |
          set -uo pipefail
          for dir in /tmp/walk-idle /tmp/walk-load; do
            echo "=== ${dir} ==="
            for t in redundant_walk_root_is_not_walked_twice \
                     a_disjoint_grant_really_does_cost_a_second_walk; do
              failed=$(/usr/bin/grep -l "FAIL .*${t}" ${dir}/*.log 2>/dev/null | /usr/bin/wc -l | tr -d ' ')
              present=$(/usr/bin/grep -l "${t}" ${dir}/*.log 2>/dev/null | /usr/bin/wc -l | tr -d ' ')
              echo "  ${t}: FAILED=${failed} PRESENT=${present}"
            done
            echo "  (PRESENT=0 makes every FAILED=0 above a report of ABSENCE, not of health)"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-identity-logs
          path: |
            /tmp/walk-idle
            /tmp/walk-load
          retention-days: 7
