# Phase 28 — the two native macOS sandbox acceptance suites, on a real macOS host.
#
# Why this workflow exists
# ------------------------
# `wcore-sandbox/tests/hard_process_containment_macos.rs` and
# `wcore-sandbox/tests/live_integrity_macos.rs` carry the two
# `required_live_macos_*` cases in the Phase 28 hostile platform matrix. Both are
# `#![cfg(target_os = "macos")]` and `#[ignore]`d, so they had never executed
# anywhere: the development Macs are forbidden from running cargo, the Linux
# build host is not macOS, and the Windows box is not macOS either. A previous
# lane concluded "no macOS build host in reach" and filed the legs unrun.
#
# That conclusion was wrong about the available hardware. `ci.yml` has used
# GitHub-hosted `macos-latest` runners since long before Phase 28, and
# `release.yml` builds both Darwin targets on them. A hosted macOS runner IS a
# macOS build host. This workflow uses one.
#
# Why the gate can fail
# ---------------------
# Both suites contain the exact self-passing shape this program has measured
# repeatedly. Each test opens with:
#
#     if std::env::var("WAYLAND_SANDBOX_LIVE_MACOS").is_err() { eprintln!("skip: ..."); return; }
#     if !backend.is_available() { eprintln!("skip: ..."); return; }
#
# so an un-opted-in host prints `1 passed` having asserted nothing (flavour B),
# and without `--ignored` the binary prints `test result: ok` having run zero
# tests (flavour A). Asserting the exit status, or even `1 passed`, would
# therefore certify nothing. This job asserts all three properties separately:
#
#   1. `running 1 test`            — the case was collected, not filtered away.
#   2. `1 passed; 0 failed`        — it reached the end without an assertion firing.
#   3. NO `skip:` text in stdout   — neither early return was taken, so the
#                                    assertions actually ran against a live
#                                    sandbox-exec backend.
#
# Property 3 is the load-bearing one. Drop it and an unset env var reads as a
# clean pass. Two details make it actually work, both measured 2026-07-30 on a
# real Mac (lane/macos-docker-gate) after property 3 was found inert here:
#
#   * `--nocapture` is REQUIRED. libtest captures a passing test's stderr and
#     DISCARDS it, so without this flag the `eprintln!("skip: ...")` reason never
#     reaches the log and property 3 matches nothing — it could not fire, and the
#     gate would have reported PASSED on a suite that asserted nothing. Measured:
#     `cargo test -p wcore-sandbox --test live_integrity_macos -- --ignored
#     --test-threads=1` with WAYLAND_SANDBOX_LIVE_MACOS unset prints
#     `test ... ok` / `1 passed`, with no `skip:` anywhere in the output.
#   * the match is UNANCHORED. With `--nocapture` the reason interleaves onto
#     libtest's partial line (`test <name> ... skip: ...`), so `^skip:` never
#     matches. Over-matching here fails the gate closed, which is the safe way
#     to be wrong.
#
# The exit status is captured out of PIPESTATUS, never off the tail
# of a pipe, because `cmd | tee` reports tee's status and not cmd's.

name: macOS native suites (Phase 28)

on:
  # `workflow_dispatch` already selects the branch to run on, so there is
  # deliberately no `ref` input: feeding a dispatch input into
  # `actions/checkout`'s `ref:` is a ref-injection surface for no added ability.
  #
  # NOTE: the REST API resolves a dispatchable workflow by name off the DEFAULT
  # branch, so `gh workflow run` returns 404 for a workflow that exists only on
  # a topic branch. The scoped `push` trigger below is what lets this run before
  # it has ever reached the default branch. Paths are narrowed to the sandbox
  # surface it certifies so it does not fire on unrelated lane pushes.
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macos-native-suites.yml'
      - 'crates/wcore-sandbox/src/**'
      - 'crates/wcore-sandbox/tests/hard_process_containment_macos.rs'
      - 'crates/wcore-sandbox/tests/live_integrity_macos.rs'
      - 'crates/wcore-agent/tests/voice_live_capture_mac.rs'
      - 'crates/wcore-agent/src/tool_backends/voice_mode.rs'

permissions:
  contents: read

jobs:
  macos-native-suites:
    name: wcore-sandbox live macOS acceptance
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Opt this host into the live macOS execution both suites gate on.
      WAYLAND_SANDBOX_LIVE_MACOS: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Setup vx (installs Rust from vx.toml)
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      # Record what the host actually offers before trusting any result below.
      # If sandbox-exec is missing or non-functional the suites would take their
      # second early return and report a green; we want that visible as data.
      - name: Probe the host sandbox facility
        run: |
          set -euo pipefail
          echo "sw_vers:"; sw_vers
          echo "uname: $(uname -a)"
          echo "sandbox-exec: $(command -v sandbox-exec || echo MISSING)"
          # A trivial deny-default profile that permits only process-exec.
          printf '(version 1)(allow default)' > /tmp/probe.sb
          if sandbox-exec -f /tmp/probe.sb /bin/echo "sandbox-exec probe ok"; then
            echo "PROBE_RESULT=usable"
          else
            echo "PROBE_RESULT=unusable (rc=$?)"
          fi

      # `cargo test` is retained here DELIBERATELY. Both targets are
      # `#![cfg(target_os = "macos")]` with every case `#[ignore]`d, so they need
      # `-- --ignored`, and the "Assert both suites executed" step below is a
      # STRONGER guard than nextest's `no-tests = "fail"`: it pins the exact
      # expected count (`running 1 test`, `1 passed; 0 failed`) and additionally
      # catches flavour B (an env-gated early return printing a `skip:` reason), which a
      # non-zero-test check cannot see. Exit status is ignored on purpose —
      # PIPESTATUS[0] is recorded to a file the gate step reads back separately.
      - name: Run hard_process_containment_macos
        id: containment
        # vacuity-checked: count pinned in the dedicated gate step below.
        run: |
          set -uo pipefail
          vx cargo test -p wcore-sandbox --test hard_process_containment_macos \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee /tmp/containment.log
          echo "rc=${PIPESTATUS[0]}" | tee -a /tmp/containment.rc

      # vacuity-checked: as above — count asserted in the dedicated gate step.
      - name: Run live_integrity_macos
        id: integrity
        if: always()
        run: |
          set -uo pipefail
          vx cargo test -p wcore-sandbox --test live_integrity_macos \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee /tmp/integrity.log
          echo "rc=${PIPESTATUS[0]}" | tee -a /tmp/integrity.rc

      # The gate proper. Deliberately separate from the run steps so a
      # non-zero cargo exit cannot short-circuit the executed-count checks,
      # and so each asserted property fails with its own message.
      - name: Assert both suites executed their case and did not skip
        if: always()
        run: |
          set -uo pipefail
          fail=0
          check_suite() {
            local name="$1" log="$2" want_tests="$3"
            echo "=== ${name} ==="
            if [ ! -s "${log}" ]; then
              echo "FAIL(${name}): no log produced — the suite never ran"
              fail=1
              return
            fi
            if ! grep -q "running ${want_tests} test" "${log}"; then
              echo "FAIL(${name}): expected 'running ${want_tests} test' — suite collected the wrong number of cases (flavour A/C: zero executed)"
              grep -E "running [0-9]+ test|test result" "${log}" || true
              fail=1
            fi
            if ! grep -qE "test result: ok\. ${want_tests} passed; 0 failed" "${log}"; then
              echo "FAIL(${name}): expected '${want_tests} passed; 0 failed'"
              grep -E "test result" "${log}" || true
              fail=1
            fi
            if grep -q "skip:" "${log}"; then
              echo "FAIL(${name}): the test took an early return and asserted NOTHING (flavour B):"
              grep "skip:" "${log}"
              fail=1
            fi
            echo "--- ${name} verdict lines ---"
            grep -E "running [0-9]+ test|test result|skip:" "${log}" || true
          }
          check_suite hard_process_containment_macos /tmp/containment.log 1
          # 2 = required_live_macos_retained_directory_confines_writes and
          # required_live_macos_metadata_grant_permits_stat_and_nothing_else.
          # This number is a PIN, not a formality: it is what caught the second
          # case being added, and it is the only thing standing between this
          # gate and a suite that quietly stops collecting a case. Bump it in
          # the same commit that adds or removes a `required_live_macos_*` test.
          check_suite live_integrity_macos /tmp/integrity.log 2
          echo "=== recorded cargo exit codes ==="
          cat /tmp/containment.rc /tmp/integrity.rc 2>/dev/null || echo "(none recorded)"
          if [ "${fail}" -ne 0 ]; then
            echo "GATE: FAILED"
            exit 1
          fi
          echo "GATE: PASSED — both required_live_macos_* cases executed on a real macOS host"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-native-suites-logs
          path: |
            /tmp/containment.log
            /tmp/integrity.log
            /tmp/containment.rc
            /tmp/integrity.rc
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The acoustic voice suite. Separate job, and workflow_dispatch ONLY.
  #
  # These three cases play a 1 kHz tone out of the speaker and require the
  # microphone to hear it. That is unreproducible on any hosted runner: a
  # GitHub macOS VM enumerates a default input device and streams at the full
  # sample rate, but every sample it delivers is zero (run 30910027962 —
  # both arms rms=0.0, tone_ratio=0.00), because there is no physical mic, no
  # speaker, and no GUI session to grant TCC consent. Leaving them in the
  # ordinary matrix produced three permanent reds that said nothing about the
  # product.
  #
  # Dispatch-only rather than on push, because the only host that CAN run them
  # is Sean's own Mac and a push trigger would play a tone out of his laptop for
  # ~90s on every merge. The `#[ignore]` is therefore NOT a silent skip: this
  # job is the thing that makes it runnable, and the gate below fails if it
  # certifies nothing.
  # ---------------------------------------------------------------------------
  voice-live-capture-mac:
    name: wcore-agent live mic capture (acoustic)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    concurrency:
      group: darwin-selfhosted-voice-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Declares intent, which also arms this suite's zero_execution_guard.
      WAYLAND_VOICE_LIVE_MAC: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Setup vx (installs Rust from vx.toml)
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      # Record what the host offers before trusting any result. A box with no
      # input device would produce the same digital silence the hosted runner
      # does, and we want that visible as data rather than as a mystery red.
      - name: Probe the host audio facility
        run: |
          set -euo pipefail
          echo "sw_vers:"; sw_vers
          echo "--- input devices ---"
          system_profiler SPAudioDataType 2>/dev/null | sed -n '1,80p' || echo "(SPAudioDataType unavailable)"

      # --test-threads=1 is mandatory, not stylistic: all three arms contend for
      # the single microphone device, and overlapping starts corrupt each other.
      #
      # `cargo test` is retained rather than nextest for the same reason the two
      # sibling suites in this file retain it: every case is `#[ignore]`d, so the
      # run needs `-- --ignored`, and the gate step below is STRONGER than
      # `--no-tests=fail` — it pins the exact expected count rather than merely
      # rejecting zero.
      #
      # vacuity-checked: the "Assert the acoustic suite executed all three
      # cases" step below greps /tmp/voice.log for `running 3 tests` and for
      # `test result: ok. 3 passed; 0 failed`, and fails the job if either is
      # absent. Exit status here is ignored on purpose; PIPESTATUS[0] is
      # recorded to a file that step reads back separately.
      - name: Run voice_live_capture_mac
        id: voice
        run: |
          set -uo pipefail
          vx cargo test -p wcore-agent --features voice --test voice_live_capture_mac \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee /tmp/voice.log
          echo "rc=${PIPESTATUS[0]}" | tee -a /tmp/voice.rc

      - name: Assert the acoustic suite executed all three cases
        if: always()
        run: |
          set -uo pipefail
          fail=0
          log=/tmp/voice.log
          if [ ! -s "${log}" ]; then
            echo "FAIL: no log produced — the suite never ran"
            fail=1
          else
            if ! grep -q "running 3 tests" "${log}"; then
              echo "FAIL: expected 'running 3 tests' — zero or wrong count collected"
              grep -E "running [0-9]+ test|test result" "${log}" || true
              fail=1
            fi
            if ! grep -qE "test result: ok\. 3 passed; 0 failed" "${log}"; then
              echo "FAIL: expected '3 passed; 0 failed'"
              grep -E "test result" "${log}" || true
              fail=1
            fi
            echo "--- verdict lines ---"
            grep -E "running [0-9]+ test|test result|ARM |OVERFLOW" "${log}" || true
          fi
          cat /tmp/voice.rc 2>/dev/null || echo "(no exit code recorded)"
          if [ "${fail}" -ne 0 ]; then
            echo "GATE: FAILED"
            exit 1
          fi
          echo "GATE: PASSED — all three acoustic cases executed on real audio hardware"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voice-live-capture-mac-logs
          path: |
            /tmp/voice.log
            /tmp/voice.rc
          if-no-files-found: warn
