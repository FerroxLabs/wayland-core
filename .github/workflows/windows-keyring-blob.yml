name: windows-keyring-blob

# Drives `crates/wcore-config/tests/keyring_blob_size_live.rs` against a REAL
# Windows Credential Manager.
#
# Why a dedicated workflow: the property under test is a property of the host's
# credential store, not of our code in isolation. Windows caps `CredentialBlob`
# at CRED_MAX_CREDENTIAL_BLOB_SIZE (2560 bytes) and the `keyring` crate encodes
# UTF-16, so one entry holds 1280 code units — several times smaller than an
# OAuth token set. No amount of unit testing on Linux can observe that; only a
# Windows host can. The test refuses to report a pass it did not measure: a
# keyring it cannot round-trip a 5-character value through fails as NOT
# MEASURED, and on Windows a bare single-entry write that unexpectedly succeeds
# also fails as NOT MEASURED, because that run did not exercise the cap.
#
# It is `workflow_dispatch` only. It writes into the runner's host-global
# credential store (under its own throwaway service name), which is not
# something every push should do.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to test
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-keyring-blob-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyring-blob:
    name: OAuth-sized secret through the real Credential Manager
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Show the tree under test
        shell: pwsh
        run: |
          git rev-parse HEAD
          git log --oneline -1

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-reg-winblob-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-reg-winblob-

      # The whole point of the run: FAIL if the property does not hold. The
      # test itself distinguishes NOT MEASURED from FAIL, so a green job here
      # means the measurement was actually taken.
      # `cargo test -- --ignored` exits 0 when it selects NOTHING, so the exit
      # status alone is a gate that cannot go red on the failure mode that
      # actually happens here (a renamed or unbuilt test). Require the test's
      # own PASS marker and its MEASURED line as well.
      - name: Live keyring blob-size test
        shell: pwsh
        run: |
          cargo test -p wcore-config --test keyring_blob_size_live -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath keyring-blob.log
          $rc = $LASTEXITCODE
          Get-Content keyring-blob.log | Select-String -Pattern 'MEASURED|PASS an_oauth'
          if ($rc -ne 0) { throw "cargo test exited ${rc}" }
          if (-not (Select-String -Path keyring-blob.log -Pattern 'PASS an_oauth_sized_secret_survives_the_hosts_real_keyring' -Quiet)) {
            throw "the live keyring test did not run to its PASS marker — NOT MEASURED"
          }
          if (-not (Select-String -Path keyring-blob.log -Pattern 'single_entry_write=REFUSED' -Quiet)) {
            throw "the single-entry positive control was not REFUSED — this run did not exercise the Windows blob cap"
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyring-blob-log-${{ github.run_id }}
          path: keyring-blob.log
