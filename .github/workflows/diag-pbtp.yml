# THROWAWAY DIAGNOSTIC — never merge to main.
#
# Reproduces the boundary-test failure UNDER FULL-SUITE LOAD on GitHub-hosted
# macos-latest (running the test alone passes 3/3, so load is required), and
# captures the engine's own debug log plus the mock request count.
#
# The child's RUST_LOG sink is a file under $WAYLAND_HOME (main.rs:906-921,
# with_writer(non_blocking)) and never the PTY, so the instrument cannot
# perturb the channel the test observes.
name: diag-pbtp
on:
  push:
    branches: ['lane/pbtp-diag']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pbtp:
    name: PBTP under full-suite load
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Full suite, ci profile, retries OFF so every try is recorded, and
      # --no-fail-fast so the whole population runs.
      - name: Full suite (reproduces the contention)
        continue-on-error: true
        run: |
          cargo nextest run --workspace --profile ci --no-fail-fast --retries 0 2>&1 | tail -400
