name: E2E Tests

# E2E tests call real LLM APIs. They run:
#   1. Manually via workflow_dispatch (any branch)
#   2. Automatically on push to main (requires secrets to be configured)
#   3. On pull_request targeting main
#
# A leg that was asked to run and has no credential FAILS (wayland#1115). It
# used to set an output, warn, skip its own test step and conclude SUCCESS —
# a green check whose meaning was "no test ran", indistinguishable in the
# checks list from one that ran the suite clean.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to test (anthropic / openai / all)"
        required: false
        default: "all"
        type: choice
        options: [all, anthropic, openai]
  push:
    branches: [main]
    paths:
      - "crates/wcore-providers/**"
      - "crates/wcore-agent/**"
      - "crates/wcore-config/**"
      - "crates/wcore-types/**"
      - "crates/wcore-skills/**"
      - ".github/workflows/e2e.yml"
      - ".github/scripts/assert-test-evidence.sh"
  pull_request:
    branches: [main]
    paths:
      - "crates/wcore-providers/**"
      - "crates/wcore-agent/**"
      - "crates/wcore-config/**"
      - "crates/wcore-types/**"
      - "crates/wcore-skills/**"
      - ".github/workflows/e2e.yml"
      - ".github/scripts/assert-test-evidence.sh"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: anthropic
            secret_name: ANTHROPIC_API_KEY
            filter: "test(anthropic)"
            # REQUIRED, not optional. Every file under tests/e2e/ opens with
            # `#![cfg(feature = "live-...")]`, so without this the `e2e` test
            # binary compiles to ZERO tests and the filter below matches
            # nothing. Measured on addb4f48: `cargo nextest list -p wcore-agent
            # --profile e2e --test e2e -E 'test(anthropic)'` listed 0 tests
            # without the feature and 2 with it; the run form exited 4 ("no
            # tests to run") while still writing a junit.xml with tests="0".
            # That artifact satisfied the file-count evidence gate, so E2E
            # would have reported green over an empty suite the moment the
            # secrets were configured (wayland#1115).
            features: live-anthropic
          - provider: openai
            secret_name: OPENAI_API_KEY
            filter: "test(openai)"
            features: live-openai

    steps:
      - name: Check provider filter
        id: filter
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || \
             [[ "${{ github.event.inputs.provider }}" == "all" ]] || \
             [[ "${{ github.event.inputs.provider }}" == "${{ matrix.provider }}" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # FAIL CLOSED. This step used to emit `available=false` and a `::warning`,
      # which let the job run to a GREEN conclusion having executed no test at
      # all — the exact state of both legs on PR #315 head ae389c3e, where every
      # E2E step after this one was skipped and every check was green
      # (wayland#1115). A leg that was asked to run and cannot is a failure, not
      # a pass: the credential gap is real and must be visible at the check
      # level. Out-of-scope legs (a workflow_dispatch naming one provider) are
      # not touched — the operator chose that, and nothing claims they ran.
      - name: Check API key availability
        if: steps.filter.outputs.run == 'true'
        env:
          API_KEY: ${{ secrets[matrix.secret_name] }}
        run: |
          set -euo pipefail
          if [ -z "${API_KEY:-}" ]; then
            echo "::error title=NO E2E CREDENTIAL (${{ matrix.provider }})::${{ matrix.secret_name }} is not configured, so the ${{ matrix.provider }} E2E suite cannot run. This job fails rather than reporting success on zero tests. Configure the repository secret, or dispatch this workflow for the provider that has one. A fork PR cannot see repository secrets, so a maintainer must dispatch it."
            exit 1
          fi

      # `steps.filter.outputs.run` guards every step below, as it did before
      # the fail-closed credential change: a `workflow_dispatch` naming ONE
      # provider must leave the other leg alone. Dropping these guards made the
      # out-of-scope leg check out, install a toolchain and run nextest — which
      # exits 4 on an empty filter match, so an anthropic-only dispatch painted
      # `E2E (openai)` RED for a suite the operator never asked to run.
      # A bare `if:` still implies `success()`, so a leg whose credential check
      # failed above stops here rather than running the suite without a key.
      - uses: actions/checkout@v6
        if: steps.filter.outputs.run == 'true'

      # Build-time system deps. Every Linux job in ci.yml installs exactly
      # this set (ci.yml lines ~1653/1721); e2e.yml installed NOTHING, so this
      # job could never have linked:
      #
      #   rust-lld: error: unable to find library -lseccomp
      #
      # It went unnoticed because the credential check above fails closed and
      # runs BEFORE the build, so every previous run of this workflow exited
      # before it ever reached a linker. Configuring the secrets is what
      # surfaced it -- the credential gap was hiding a second, independent
      # defect underneath it.
      - name: Install system deps
        if: steps.filter.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdbus-1-dev libseccomp-dev libasound2-dev pkg-config mold

      - name: Setup vx (installs Rust from vx.toml)
        if: steps.filter.outputs.run == 'true'
        uses: loonghao/vx@v0.9.31
        with:
          setup: 'true'
          cache: 'true'

      - name: Install cargo-nextest
        if: steps.filter.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run E2E tests — ${{ matrix.provider }}
        if: steps.filter.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY:    ${{ matrix.provider == 'openai'    && secrets.OPENAI_API_KEY    || '' }}
          # Endpoint and model overrides. Repository VARIABLES, not secrets --
          # a base URL and a model id are not secret, and keeping them visible
          # means anyone reading a green check can see WHAT it dialled. Unset
          # variables expand to '' and every consumer falls back to the vendor
          # default, so the no-variable behaviour is unchanged.
          #
          # These exist because a green here means "the endpoint we dialled
          # works", which is only "the vendor works" when the endpoint IS the
          # vendor. If E2E_*_BASE_URL points at a router, this suite is
          # proving our wire format against that router's normalisation and
          # can no longer catch vendor drift. That is a deliberate trade to
          # keep a REQUIRED check honest-and-running rather than permanently
          # red; it is not equivalent coverage.
          E2E_OPENAI_BASE_URL:    ${{ vars.E2E_OPENAI_BASE_URL }}
          E2E_ANTHROPIC_BASE_URL: ${{ vars.E2E_ANTHROPIC_BASE_URL }}
          E2E_ANTHROPIC_HAIKU:    ${{ vars.E2E_ANTHROPIC_HAIKU }}
          E2E_OPENAI_GPT4O_MINI:  ${{ vars.E2E_OPENAI_GPT4O_MINI }}
        run: |
          vx cargo nextest run \
            -p wcore-agent \
            --features ${{ matrix.features }} \
            --profile e2e \
            --test e2e \
            -E '${{ matrix.filter }}' \
            --no-fail-fast

      - name: Upload E2E JUnit report
        if: always() && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-junit-${{ matrix.provider }}
          path: target/nextest/e2e/junit.xml
          if-no-files-found: ignore

  # ── Aggregate the E2E result ──────────────────────────────────────────
  # Named `E2E report`, NOT `report`. Both this workflow and ci.yml used to
  # define a job with id `report` and no `name:`, so both emitted a check
  # literally named `report` — and `report` is a required status context on
  # main. Two workflows racing to satisfy one required context means the name
  # does not identify what passed; on PR #315 the green one came from here,
  # having certified nothing (wayland#1115). ci.yml keeps the `report` name and
  # this one is explicit, so the required context has exactly one producer.
  e2e_report:
    name: E2E report
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # NOTE: a job-level `permissions:` block REPLACES the workflow-level
      # one entirely (GHA semantics), so `contents: read` from the
      # workflow-level top of this file is dropped here unless re-listed.
      # Without it, GITHUB_TOKEN has no read access and actions/checkout
      # fails with "Repository not found" (misleading — the repo exists,
      # the token just can't see it). Same trap ci.yml's report job
      # documents at lines 410-419.
      contents: read
      checks: write
      pull-requests: write
    steps:
      # ADMITTED ON THE SAME TERMS AS THE GATE BELOW. A gate that runs from a
      # tree no checkout made, over artifacts no download fetched, cannot grade
      # anything -- ci.yml's report job did exactly that on run 33320774111 and
      # exited 127. Enforced by gate-admission.py for every step at or before
      # the last gate in a job that itself runs unconditionally.
      - uses: actions/checkout@v6
        if: ${{ !cancelled() }}

      # NO `merge-multiple: true`: both legs upload their report under the same
      # filename (`junit.xml`, the path baked into the `e2e` nextest profile),
      # and merge-multiple extracts every artifact into ONE directory, so the
      # second leg clobbers the first. That would cap the evidence count at 1
      # and leave the assertion below unable to see a half-run suite. ci.yml
      # removed the same flag for the same reason on 2026-08-02.
      - name: Download E2E JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-junit-*
          path: e2e-reports
        continue-on-error: true

      - name: How many legs were in scope
        id: scope
        # The gate reads EXPECTED_MIN from this step's output. Skipping it hands
        # the gate an empty EXPECTED_MIN, which assert-test-evidence.sh fails
        # closed on -- correct, and a red naming the wrong cause.
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_PROVIDER" != "all" ]; then
            echo "expected=1" >> "$GITHUB_OUTPUT"
          else
            echo "expected=2" >> "$GITHUB_OUTPUT"
          fi

      # A SKIPPED E2E SUITE IS NOT A PASS. Without this the job is green
      # whenever there is no JUnit at all, because the publish step below is
      # guarded on `hashFiles(...) != ''` and simply skips — which is how this
      # check went green on PR #315 with both legs' test steps skipped for a
      # missing credential (wayland#1115). Second net behind the leg-level
      # failure above: it also catches a leg that dies after its credential
      # check but before writing a report. Deliberately NOT skipped when `e2e`
      # is itself `skipped`: "no leg ran at all" is the failure this exists to
      # catch.
      #
      # THE CONDITION NAMES NO JOB, and that is enforced rather than intended.
      # It read `needs.e2e.result != 'cancelled'` until 2026-08-31 — the same
      # shape ci.yml's evidence gate carried when it switched ITSELF off on run
      # 33303418632 with the evidence already downloaded (wayland#1177 c1). A
      # plain expression is also skipped outright once any earlier step in the
      # job has failed, so `Download E2E JUnit reports` failing took this gate
      # with it. `!cancelled()` is a status-check function: it survives both.
      # assert-test-evidence.sh carries `ADMISSION: unconditional` and
      # report-gate-wiring.test.sh reds if any of its callers is admitted by
      # anything but `always()` / `!cancelled()`.
      #
      # ONE BEHAVIOUR CHANGE, STATED RATHER THAN SMUGGLED, and it matches the
      # change ci.yml already made: a CANCELLED `e2e` no longer suppresses this
      # gate. A cancelled leg leaves no evidence, and this step's own name says
      # a suite that did not run is not a pass. The workflow run being
      # cancelled is still excluded, because that is what `cancelled()` means.
      # Evidence destroyed by a cancellation at the time budget is tracked as
      # FerroxLabs/wayland-core#404.
      - name: Assert E2E evidence exists (a skipped suite is not a pass)
        if: ${{ !cancelled() }}
        env:
          EVIDENCE_DIR: e2e-reports
          EXPECTED_MIN: ${{ steps.scope.outputs.expected }}
          # A junit.xml is written even when the filter matched nothing, so the
          # file count alone cannot tell "ran clean" from "ran nothing" — the
          # very distinction wayland#1115 asks for. Require real test cases.
          MIN_TESTS: 1
          LABEL: E2E Tests
          UPSTREAM_RESULT: ${{ needs.e2e.result }}
          HINT: >-
            Check each E2E leg for a NO E2E CREDENTIAL annotation. Configure the
            repository secret (ANTHROPIC_API_KEY / OPENAI_API_KEY), or dispatch
            this workflow for the provider that has one; a fork PR cannot see
            repository secrets, so a maintainer must dispatch it. Do not read
            this check as green until the suite actually runs.
        run: bash .github/scripts/assert-test-evidence.sh

      - name: Publish E2E test report
        uses: dorny/test-reporter@v3
        if: hashFiles('e2e-reports/**/*.xml') != ''
        with:
          name: E2E Tests
          path: e2e-reports/**/*.xml
          reporter: java-junit
          fail-on-error: false
