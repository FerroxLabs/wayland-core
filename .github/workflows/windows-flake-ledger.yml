name: windows-flake-ledger
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch-release:
    name: Windows dispatch budget release diagnostic
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Setup vx
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Record which Windows executor served this job
        shell: bash
        run: |
          if [ -z "${RUNNER_NAME:-}" ]; then exit 1; fi
          echo "runner_name=${RUNNER_NAME}" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p diagnostic-evidence
          git rev-parse HEAD > diagnostic-evidence/source.txt
          vx rustc -vV > diagnostic-evidence/toolchain.txt
          printf 'compile_profile=release\nnextest_profile=ci\nrunner=%s\nimage=%s\n' "$RUNNER_NAME" "$ImageVersion" > diagnostic-evidence/environment.txt
      - name: Dispatch budget unchanged workload in release profile
        shell: bash
        env:
          ATTEMPT_DIR: diagnostic-evidence/dispatch-budget
        run: |
          bash .github/scripts/run-tests-with-attempt-evidence.sh \
            vx cargo nextest run --locked --release -p wcore-agent --test workflow_limits_test \
            --profile ci --retries 0 --no-tests=fail --test-threads 1 \
            -E 'test(=fix1_dispatch_budget_aborts_with_partial_result)'
      - name: Upload raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dispatch-release-${{ github.run_id }}
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 14
