name: live-uat-windows

# Throwaway evidence job for the v0.13.1 pre-tag UAT. It exists only on the
# lane branch named below and is never merged.
#
# Two claims shipped to main without anyone running the binary on Windows:
#   A. 845446a6 / #272 — the Bash argv now carries `/S`, so a nested
#      `cmd /c echo ...` payload no longer returns a stray trailing 0x22.
#      PR #272 says verbatim that no cmd.exe was run against the fix.
#   B. #278 — the per-exec workspace read-deny walk is skipped on a backend
#      that discards the list.
#
# Both are graded here by `crates/wcore-tools/tests/live_uat_0131.rs`, which
# runs real `cmd.exe` processes on real Windows hardware and prints bytes and
# milliseconds. Claim A carries a RED ARM (the pre-fix `cmd /C` argv through
# the same production backend); a green arm alone cannot distinguish "fixed"
# from "never broken on this machine".

on:
  push:
    branches:
      - 'lane/live-uat-0131-windows'

permissions:
  contents: read

concurrency:
  group: live-uat-windows
  cancel-in-progress: false

jobs:
  uat:
    name: v0.13.1 live UAT (self-hosted Windows msvc)
    runs-on:
      - self-hosted
      - Windows
      - X64
      - msvc
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      # Everything this job creates lives under here, on D:, never a C: root
      # and never inside a runner-owned directory.
      UAT_BASE: 'D:\wl-uat0131'
      # The exact main commit this lane was cut from. Production code must be
      # byte-identical to it.
      SHIPPING_SHA: '22edff934ede33edb60dd0632cd7667a42d8bf3c'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The self-hosted checkout dir is owned by BUILTIN\Administrators while
      # the runner service is NT AUTHORITY\NETWORK SERVICE, so git otherwise
      # aborts on "dubious ownership". Same step every self-hosted job here has.
      - name: Trust the checkout for git
        shell: pwsh
        run: git config --global --add safe.directory '*'

      - name: Host and tree provenance
        shell: pwsh
        run: |
          Write-Host "runner_name   = $env:RUNNER_NAME"
          Write-Host "workspace     = $env:GITHUB_WORKSPACE"
          Write-Host "head_sha      = $(git rev-parse HEAD)"
          Write-Host "shipping_sha  = $env:SHIPPING_SHA"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize
          # PRODUCTION CODE MUST BE THE SHIPPING TREE. This lane adds only the
          # evidence harness and CI plumbing; anything else under crates/ or
          # scripts/ differing from main would make every number below describe
          # a tree that is not shipping.
          $changed = git diff --name-only "$env:SHIPPING_SHA" HEAD
          Write-Host "--- files this lane changes vs the shipping tree ---"
          $changed | ForEach-Object { Write-Host "  $_" }
          $allowed = @(
            'crates/wcore-tools/tests/live_uat_0131.rs',
            '.github/workflows/live-uat-windows.yml',
            '.github/workflows/ci.yml',
            '.github/workflows/lint.yml'
          )
          $bad = $changed | Where-Object { $allowed -notcontains $_ }
          if ($bad) { throw "this lane modifies production code: $($bad -join ', ')" }
          Write-Host "OK: production code is identical to $env:SHIPPING_SHA"

      # NOT dtolnay/rust-toolchain: on this box that action's bash probe
      # (`command -v rustup`) misses the installed rustup and it then tries to
      # re-run rustup-init, which fails with
      #   error: could not remove 'rustup-bin' file:
      #   'C:\WINDOWS\ServiceProfiles\NetworkService\.cargo\bin\rustup.exe'
      # because a concurrent job on the same shared runner holds it. The
      # toolchain is already installed for the runner's service account, so use
      # it and RECORD its version rather than reinstalling under contention.
      - name: Use the runner's installed Rust toolchain
        shell: pwsh
        run: |
          $candidates = @(
            $(if ($env:CARGO_HOME) { Join-Path $env:CARGO_HOME 'bin' }),
            $(if ($env:USERPROFILE) { Join-Path $env:USERPROFILE '.cargo\bin' }),
            'C:\WINDOWS\ServiceProfiles\NetworkService\.cargo\bin'
          ) | Where-Object { $_ -and (Test-Path (Join-Path $_ 'cargo.exe')) }
          if (-not $candidates) {
            throw "no cargo.exe found; searched CARGO_HOME, USERPROFILE\.cargo\bin and the NetworkService profile"
          }
          $bin = @($candidates)[0]
          Write-Host "cargo bin dir = $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$bin;$env:PATH"
          & (Join-Path $bin 'rustc.exe') -vV
          & (Join-Path $bin 'cargo.exe') -V
          if ($LASTEXITCODE -ne 0) { throw "cargo is not runnable" }

      # The "real tree" for CLAIM B: a full clone of the shipping tree on D:,
      # which then receives the cargo target directory. After the build it is a
      # genuinely large real working tree (source + build artifacts), which is
      # the shape #922/#1000 were reported against. Building into it also keeps
      # multi-GB of artifacts off C:.
      - name: 'Prepare the D: drive work area'
        shell: pwsh
        run: |
          $base = $env:UAT_BASE
          # Stale directories from an earlier attempt may hold locked files, so
          # never reuse a name: everything is keyed by run id.
          if (Test-Path $base) { Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          $real  = Join-Path $base ("realtree-" + $env:GITHUB_RUN_ID)
          $empty = Join-Path $base ("empty-"    + $env:GITHUB_RUN_ID)
          git clone --quiet --no-hardlinks "$env:GITHUB_WORKSPACE" $real
          if ($LASTEXITCODE -ne 0) {
            Write-Host "git clone failed (exit $LASTEXITCODE); falling back to a file copy"
            Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE" $real
          }
          if (-not (Test-Path (Join-Path $real 'Cargo.toml'))) {
            throw "the real tree at $real has no Cargo.toml — the copy did not land"
          }
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          "UAT_REAL_TREE=$real"       | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UAT_EMPTY_DIR=$empty"      | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_DIR=$real\target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "real tree = $real"
          Write-Host "empty dir = $empty"

      - name: Build the release CLI and the UAT harness
        shell: pwsh
        run: |
          Write-Host "CARGO_TARGET_DIR = $env:CARGO_TARGET_DIR"
          cargo build --release -p wcore-cli --bin wayland-core
          if ($LASTEXITCODE -ne 0) { throw "release build failed" }
          cargo test --release -p wcore-tools --test live_uat_0131 --no-run
          if ($LASTEXITCODE -ne 0) { throw "harness build failed" }

      # Basic live smoke, straight from the binary's own mouth. Each is timeout
      # guarded so a hang costs 120 s and still leaves evidence, rather than
      # eating the job's whole budget.
      - name: Smoke — version, doctor, sandbox status
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release\wayland-core.exe'
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          Write-Host "binary   = $exe"
          Write-Host "sha256   = $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          function Invoke-Smoke {
            param([string]$Label, [string[]]$Argv)
            Write-Host ""
            Write-Host "########## $Label ##########"
            $job = Start-Job -ScriptBlock {
              param($e, $a)
              & $e @a 2>&1 | Out-String
            } -ArgumentList $exe, $Argv
            if (Wait-Job $job -Timeout 120) {
              Receive-Job $job | Write-Host
              Write-Host "---- (completed) ----"
            } else {
              Write-Host "!! TIMEOUT after 120 s — no output is a FAILED measurement"
              Stop-Job $job
            }
            Remove-Job $job -Force
          }
          # `doctor` is a FLAG on the root command, not a subcommand (main.rs
          # `--doctor`, wired to the shared `wcore_cli::doctor` module).
          Invoke-Smoke -Label 'wayland-core --version'             -Argv @('--version')
          Invoke-Smoke -Label 'wayland-core --doctor'              -Argv @('--doctor')
          Invoke-Smoke -Label 'wayland-core sandbox status'        -Argv @('sandbox','status')
          Invoke-Smoke -Label 'wayland-core sandbox status --json' -Argv @('sandbox','status','--json')

      # The most end-to-end form of CLAIM A available without an LLM: the
      # SHIPPED binary, through `sandbox exec`, which calls the agent's own
      # `BashTool::execute_with_ctx` with the contained production profile.
      # stdout is redirected to a FILE and hex-dumped, because a PowerShell
      # pipeline decodes text and would hide the byte in question.
      - name: CLAIM A — shipped binary through `sandbox exec` (byte dump)
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release\wayland-core.exe'
          $ws  = $env:UAT_REAL_TREE
          $dumps = Join-Path $env:UAT_BASE 'dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          $payloads = @(
            @{ tag = 'nested';  cmd = 'cmd /c echo NESTED' },
            @{ tag = 'noquote'; cmd = 'echo NOQUOTE' },
            @{ tag = 'chained'; cmd = 'cmd /c echo A && cmd /c echo B' }
          )
          foreach ($p in $payloads) {
            $o = Join-Path $dumps ($p.tag + '.out')
            $e = Join-Path $dumps ($p.tag + '.err')
            Write-Host ""
            Write-Host "########## sandbox exec -- $($p.cmd) ##########"
            # ONE pre-quoted argument string, not an array: PowerShell's
            # array-to-command-line joining is version dependent, and these
            # payloads contain spaces and `&&`. The payloads contain no `"` of
            # their own, so a plain outer pair is exact.
            $argline = 'sandbox exec --workspace "{0}" "{1}"' -f $ws, $p.cmd
            Write-Host "argline = $argline"
            $proc = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru `
              -ArgumentList $argline `
              -RedirectStandardOutput $o -RedirectStandardError $e
            Write-Host "exit = $($proc.ExitCode)"
            Write-Host "--- stdout, verbatim bytes ---"
            Format-Hex -Path $o | Out-String -Width 200 | Write-Host
            Write-Host "--- stdout, decoded ---"
            Get-Content -Raw -Path $o | Write-Host
            $errText = (Get-Content -Raw -Path $e)
            if ($errText) { Write-Host "--- stderr ---"; Write-Host $errText }
          }

      # CLAIM B with the SAME driver PR #278 used, so the numbers are directly
      # comparable to the ones in that PR. Arms interleaved (real, empty, real,
      # empty) rather than blocked: NTFS cache state drifts, and a block layout
      # hands the second arm a free win. Iteration 1 of each is the closest
      # thing to "cold" this job can produce and is labelled as such.
      - name: CLAIM B — `sandbox exec` echo timings, interleaved
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release\wayland-core.exe'
          $dumps = Join-Path $env:UAT_BASE 'dumps'
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          function Measure-Exec {
            param([string]$Ws, [string]$Label, [int]$Iter)
            $o = Join-Path $dumps ("t-$Label-$Iter.out")
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $argline = 'sandbox exec --workspace "{0}" "echo probe"' -f $Ws
            $proc = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru `
              -ArgumentList $argline `
              -RedirectStandardOutput $o -RedirectStandardError ($o + '.err')
            $sw.Stop()
            $ms = $sw.ElapsedMilliseconds
            $body = (Get-Content -Raw -Path $o)
            $ok = $body -match 'probe'
            Write-Host ("  {0,-12} iter {1}  {2,8} ms  exit={3}  produced_output={4}" -f $Label, $Iter, $ms, $proc.ExitCode, $ok)
            if (-not $ok) { Write-Host "    !! NO OUTPUT — this is a failed measurement, not a fast one. body: $body" }
            return $ms
          }
          $real = @(); $empty = @()
          foreach ($i in 1..4) {
            $real  += (Measure-Exec -Ws $env:UAT_REAL_TREE -Label 'real-tree' -Iter $i)
            $empty += (Measure-Exec -Ws $env:UAT_EMPTY_DIR -Label 'empty-dir' -Iter $i)
          }
          Write-Host ""
          Write-Host "=== CLAIM B, sandbox exec `"echo probe`" (ms) ==="
          Write-Host ("real-tree cold (iter 1) = {0}" -f $real[0])
          Write-Host ("real-tree warm (min 2-4) = {0}   samples {1}" -f (($real[1..3]) | Measure-Object -Minimum).Minimum, ($real -join ', '))
          Write-Host ("empty-dir cold (iter 1) = {0}" -f $empty[0])
          Write-Host ("empty-dir warm (min 2-4) = {0}   samples {1}" -f (($empty[1..3]) | Measure-Object -Minimum).Minimum, ($empty -join ', '))

      - name: CLAIM A + CLAIM B — live evidence
        shell: pwsh
        env:
          WAYLAND_LIVE_UAT: '1'
        run: |
          $env:WAYLAND_UAT_REAL_TREE = $env:UAT_REAL_TREE
          $env:WAYLAND_UAT_EMPTY_DIR = $env:UAT_EMPTY_DIR
          # Optional corroboration against a genuinely large real tree, if this
          # box has one. READ ONLY — the harness walks it and prints the entry
          # COUNT and the elapsed time, never a path, and never writes.
          foreach ($cand in @('D:\lanes', 'D:\Wayland')) {
            if (Test-Path $cand) { $env:WAYLAND_UAT_BIG_TREE = $cand; break }
          }
          if ($env:WAYLAND_UAT_BIG_TREE) {
            Write-Host "WAYLAND_UAT_BIG_TREE  = $env:WAYLAND_UAT_BIG_TREE"
          } else {
            Write-Host "WAYLAND_UAT_BIG_TREE  = (none of the candidates exist on this box)"
          }
          Write-Host "WAYLAND_UAT_REAL_TREE = $env:WAYLAND_UAT_REAL_TREE"
          Write-Host "WAYLAND_UAT_EMPTY_DIR = $env:WAYLAND_UAT_EMPTY_DIR"
          cargo test --release -p wcore-tools --test live_uat_0131 -- --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "live UAT harness failed — see the assertions above" }

      - name: 'Clean up the D: drive work area'
        if: always()
        shell: pwsh
        run: |
          if ($env:UAT_BASE -and (Test-Path $env:UAT_BASE)) {
            Remove-Item -Recurse -Force $env:UAT_BASE -ErrorAction SilentlyContinue
          }
          Write-Host "cleanup done"
