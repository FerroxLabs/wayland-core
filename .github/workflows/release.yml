name: Release

on:
  push:
    tags:
      # Superset of the wayland release tag convention: vX.Y.Z-wayland-<suffix>
      # (e.g. -base, -safety, -spawner-wired, -multi-agent-nav, -tui-*). The
      # v0.9.x series used new suffixes that the old two explicit patterns
      # never matched, so the pipeline silently never fired for any v0.9.x tag
      # (release run history: nothing between v0.8.1 and v0.9.4.2). This single
      # glob catches the whole family so future tags auto-publish on push.
      - 'v*-wayland-*'
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to build and publish (e.g., v0.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build and publish (e.g., v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: wayland-core
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: "600"
  CARGO_NET_RETRY: "10"

jobs:
  prepare-release:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}

      - name: Extract version from tag
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Linux targets build inside a PINNED container, and the runner
          # image is now irrelevant to their glibc floor. `build_container`
          # sets the floor; `glibc_floor` is what we promise and what
          # check_glibc_floor.py enforces. See
          # .github/scripts/build-linux-release.sh for why these two images and
          # not an older pair (short version: `NEEDED libssl.so.3`).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: wayland-core
            build_container: almalinux:9
            glibc_floor: "2.34"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: wayland-core
            build_container: ubuntu:22.04
            # ubuntu:22.04's sysroot is 2.35, but the binary references no 2.35
            # symbol, so the achieved floor is 2.34 — measured, not assumed. The
            # promise is set to what is achieved rather than to what the sysroot
            # permits: if a future change does pull in a 2.35 symbol, the gate
            # reddens and we get to decide, instead of silently dropping RHEL 9.
            glibc_floor: "2.34"
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: wayland-core
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: wayland-core
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: wayland-core.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: wayland-core.exe

    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}

      - name: Free disk space (drop unused preinstalled toolchains)
        if: runner.os == 'Linux'
        run: |
          set -e
          echo "=== BEFORE ==="; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /home/linuxbrew
          echo "=== AFTER ==="; df -h /

      # Linux builds no longer install system deps on the RUNNER: they happen
      # inside the pinned container (build-linux-release.sh installs the same
      # libdbus-1-dev / libseccomp-dev / libasound2-dev / libssl-dev set there).
      # Installing them here would be inert, since the compiler never sees the
      # runner's sysroot. `mold` is dropped with them — nothing in
      # .cargo/config.toml ever selected it as the linker.
      - name: Setup vx (installs Rust from vx.toml)
        if: runner.os != 'Linux'
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      - name: Add cross-compile target
        if: runner.os != 'Linux'
        run: rustup target add ${{ matrix.target }}

      - name: Fix MSVC linker (remove Git's link.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item 'C:\Program Files\Git\usr\bin\link.exe' -Force -ErrorAction SilentlyContinue

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # `cross` is gone from the RELEASE path. It was only ever used for
      # aarch64-linux, and its default image had itself moved to Ubuntu 24.04
      # with a glibc 2.39 aarch64 sysroot — so the cross leg had exactly the
      # same 2.39 floor as the native one, for the same reason. Pinning our own
      # container is what fixes both legs, and it makes the floor explicit
      # rather than inherited. ci.yml still uses cross, so Cross.toml stays.
      - name: Build release binary (Linux, pinned container)
        if: runner.os == 'Linux'
        shell: bash
        env:
          BUILD_CONTAINER: ${{ matrix.build_container }}
          TARGET: ${{ matrix.target }}
        run: .github/scripts/build-linux-release.sh "$BUILD_CONTAINER" "$TARGET"

      # THE GATE. Without it the floor silently tracks the base image again the
      # next time someone bumps it, and the first symptom is a user on a
      # supported distro getting `version GLIBC_2.39 not found`. The self-test
      # runs first so the gate is proved able to fail BEFORE it is trusted.
      - name: Verify the glibc floor of the built binary
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GLIBC_FLOOR: ${{ matrix.glibc_floor }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_glibc_floor.py --self-test
          python3 .github/scripts/check_glibc_floor.py \
            --binary "target/${TARGET}/release/wayland-core" \
            --max-glibc "${GLIBC_FLOOR}"

      - name: Build release binary (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: vx cargo build --release --target ${{ matrix.target }} -p wcore-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          mkdir -p dist
          ARCHIVE="wayland-core-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -C target/${{ matrix.target }}/release -czf "dist/${ARCHIVE}" ${{ matrix.binary_name }}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "wayland-core-v${env:VERSION}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -DestinationPath "dist/${archive}" -Force
          "ARCHIVE=${archive}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/${{ env.ARCHIVE }}
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release assets
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build
    # A job-level block REPLACES the workflow-level `contents: write`, so it must
    # be restated. `id-token: write` + `attestations: write` let
    # attest-build-provenance mint keyless Sigstore SLSA provenance for each
    # release archive (verifiable via `gh attestation verify`). Public repo only.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance (keyless, Sigstore-backed)
        uses: actions/attest-build-provenance@v4
        with:
          # Attest the distributed archives themselves — that is what consumers
          # download and what `gh attestation verify <archive>` checks.
          subject-path: |
            artifacts/wayland-core-*.tar.gz
            artifacts/wayland-core-*.zip

      # ── SR-29-9 — the signed release manifest ─────────────────────────────
      # `self-update` verifies a signed release manifest against the trust root
      # bundled in the shipped binary, and installs NOTHING without one. Until
      # this existed, every release published seven assets and none of them was
      # a manifest, so the updater refused every install and fell back to npm
      # (open HIGH F29-03-01). The manifest is what the attestation structurally
      # cannot say: that this release is NEWER than the one running, that the
      # view is current rather than a frozen mirror, that the version has not
      # been revoked, and that the key vouching for it has not been retired.
      #
      # Ordering is load-bearing. `manifest-build` digests EVERY file in the
      # artifacts directory, so the SBOM must land before the checksums, the
      # checksums before the manifest, and the SIGNED manifest only afterwards —
      # a manifest cannot digest itself.
      - name: Checkout source (for the release-manifest tooling)
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
          # Into a subdirectory: `actions/checkout` cleans its target, and the
          # release artifacts are already sitting in ./artifacts.
          path: source

      - name: Guard — release-acceptance signing seed present
        id: manifest_guard
        shell: bash
        env:
          WAYLAND_RELEASE_ACCEPTANCE_SEED: ${{ secrets.WAYLAND_RELEASE_ACCEPTANCE_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${WAYLAND_RELEASE_ACCEPTANCE_SEED:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=No signed release manifest::WAYLAND_RELEASE_ACCEPTANCE_SEED \
          is not set, so this release publishes NO *-release-manifest.json asset. \
          \`wayland-core self-update\` will REFUSE to install this release and will direct \
          users to the provenance-backed npm route instead. This is fail-closed, not a \
          security hole, but the update path is broken until the secret is restored."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Same set the `build` job installs for Linux. `wayland-release` pulls in
      # `wcore-config`, which pulls `keyring`; a missing system library here
      # would fail the tool build and take the whole release with it, so this
      # mirrors the proven list rather than guessing a smaller one.
      - name: Install Linux system deps
        if: steps.manifest_guard.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libseccomp-dev libasound2-dev pkg-config

      - name: Setup vx (installs Rust from vx.toml)
        if: steps.manifest_guard.outputs.skip == 'false'
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      - name: Cache cargo
        if: steps.manifest_guard.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          shared-key: release-manifest

      - name: Build the release-manifest tool
        if: steps.manifest_guard.outputs.skip == 'false'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo build --release -p wcore-eval-scenarios --bin wayland-release
          ./target/release/wayland-release --help > /dev/null
          echo "wayland-release built"

      # Both scripts gate the manifest, so both must be proved working BEFORE
      # they are trusted with it. Each self-test carries a known-positive, a
      # known-negative, and a third assertion showing the obvious-but-wrong
      # implementation would answer differently — without that third one, a
      # self-test passes on a broken instrument.
      - name: Self-test the release-manifest scripts
        if: steps.manifest_guard.outputs.skip == 'false'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 .github/scripts/release_manifest_sequence.py --self-test
          python3 .github/scripts/extract_bundled_trust_root.py --self-test

      # A real, byte-deterministic CycloneDX SBOM over the LOCKED dependency
      # graph. Bound into the manifest by digest, so `sbom` records
      # `Observed`. The other two clean-room results are deliberately OMITTED:
      # no dependency-policy verdict is produced in this pipeline and no second
      # clean-room build happens here, and `Evidence` models an omission as
      # "no result was produced" rather than "the result was fine". Recording
      # an unearned pass for either would be worse than recording their
      # absence. Closing them is SR-29-13's and SR-29-6's business.
      - name: Generate SBOM
        if: steps.manifest_guard.outputs.skip == 'false'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          cd source
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/cargo-metadata.json"
          ./target/release/wayland-release sbom \
            --metadata "${RUNNER_TEMP}/cargo-metadata.json" \
            --output "../artifacts/wayland-core-${RELEASE_TAG}-sbom.json"

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum wayland-core-* > wayland-core-checksums.txt

      # `sequence` IS the client's freeze protection: `decide_update` refuses a
      # manifest at or below the highest sequence the machine has already
      # installed. A repeat or a decrease does not merely annoy — it disables
      # the check, silently, on the client. So it is derived from the very
      # artifacts the client compares against: the max over EVERY manifest ever
      # published, plus one. That survives a deleted or re-run release, which a
      # "count the releases" or "latest + 1" rule would not.
      - name: Derive the manifest sequence from every published manifest
        id: sequence
        if: steps.manifest_guard.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous="${RUNNER_TEMP}/previous-manifests"
          mkdir -p "${previous}"

          # Instrument-aliveness first. "No manifest has ever been published" is
          # an ABSENCE claim, and an absence is what a broken query, a wrong
          # repo or a silently-empty response all return for free. So count the
          # releases and their assets too: zero manifests is only believable
          # alongside a non-zero asset count from the same query.
          gh api "repos/${REPOSITORY}/releases" --paginate --jq '.[].tag_name' \
            > "${RUNNER_TEMP}/releases.txt"
          gh api "repos/${REPOSITORY}/releases" --paginate --jq '.[].assets[].name' \
            > "${RUNNER_TEMP}/assets.txt"
          releases=$(wc -l < "${RUNNER_TEMP}/releases.txt")
          assets=$(wc -l < "${RUNNER_TEMP}/assets.txt")
          echo "query saw ${releases} release(s) carrying ${assets} asset(s)"
          if [ "${releases}" -gt 0 ] && [ "${assets}" -eq 0 ]; then
            echo "::error::The release query returned ${releases} releases but zero assets. \
          That is not a believable state for this repository and almost certainly means the \
          query is broken. Refusing to derive a sequence from it, because a broken query \
          would yield sequence=1 and silently disable client freeze protection."
            exit 1
          fi

          gh api "repos/${REPOSITORY}/releases" --paginate \
            --jq '.[].assets[] | select(.name | endswith("-release-manifest.json")) | .browser_download_url' \
            > "${RUNNER_TEMP}/manifest-urls.txt"
          index=0
          while IFS= read -r url; do
            [ -n "${url}" ] || continue
            index=$((index + 1))
            curl -fsSL "${url}" -o "${previous}/${index}.json"
          done < "${RUNNER_TEMP}/manifest-urls.txt"
          echo "downloaded ${index} previously published manifest(s)"

          python3 source/.github/scripts/release_manifest_sequence.py \
            --manifests-dir "${previous}" | tee "${RUNNER_TEMP}/sequence.txt"
          grep -E '^(sequence|previous_max|considered)=' "${RUNNER_TEMP}/sequence.txt" \
            >> "$GITHUB_OUTPUT"

      - name: Build and sign the release manifest
        if: steps.manifest_guard.outputs.skip == 'false'
        shell: bash
        env:
          # STDIN ONLY. `wayland-release` has no flag that accepts a seed and no
          # subcommand that prints one; an argv-passed secret would appear in
          # process listings and in any command trace. `set -x` is deliberately
          # NOT enabled anywhere in this step.
          WAYLAND_RELEASE_ACCEPTANCE_SEED: ${{ secrets.WAYLAND_RELEASE_ACCEPTANCE_SEED }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          SEQUENCE: ${{ steps.sequence.outputs.sequence }}
        run: |
          set -euo pipefail
          tool="source/target/release/wayland-release"

          # The trust root the SHIPPED binary bundles, lifted from the constant
          # it actually reads. Any other copy could drift from it, and then this
          # verification would prove the wrong thing.
          python3 source/.github/scripts/extract_bundled_trust_root.py \
            --source source/crates/wcore-cli/src/update_trust.rs \
            --output "${RUNNER_TEMP}/bundled-trust-root.json"

          # The key id comes from that root rather than a literal here, so a
          # rotation cannot leave the two disagreeing.
          key_id=$(jq -r '[.keys[] | select(.role == "release_acceptance") | .key_id] | unique | .[]' \
            "${RUNNER_TEMP}/bundled-trust-root.json")
          if [ "$(printf '%s\n' "${key_id}" | grep -c .)" -ne 1 ]; then
            echo "::error::The bundled trust root holds $(printf '%s\n' "${key_id}" | grep -c .) \
          release_acceptance keys. Exactly one must be active for a release run to know which \
          seed the CI secret is."
            exit 1
          fi
          echo "signing with key id ${key_id}"

          "${tool}" manifest-build \
            --artifacts artifacts \
            --output "${RUNNER_TEMP}/manifest.json" \
            --release-id "${RELEASE_TAG}" \
            --source-commit "${GITHUB_SHA}" \
            --sequence "${SEQUENCE}" \
            --issued-at "$(date -u +%s)" \
            --sbom "artifacts/wayland-core-${RELEASE_TAG}-sbom.json"

          # The suffix is not cosmetic: `update_trust::RELEASE_MANIFEST_ASSET_SUFFIX`
          # is what the updater scans the release's assets for, and a near-miss
          # filename fails SILENTLY — the updater simply reports that the release
          # publishes no manifest and refuses, exactly as if the step had never
          # run. Asserted below rather than trusted to this format string.
          signed="artifacts/wayland-core-${RELEASE_TAG}-release-manifest.json"

          printf '%s' "${WAYLAND_RELEASE_ACCEPTANCE_SEED}" | "${tool}" manifest-sign \
            --manifest "${RUNNER_TEMP}/manifest.json" \
            --output "${signed}" \
            --key-id "${key_id}"

          case "${signed}" in
            *-release-manifest.json) ;;
            *) echo "::error::${signed} does not end in the suffix the updater scans for"; exit 1 ;;
          esac
          test -s "${signed}"
          echo "signed manifest: $(basename "${signed}")"

      # THE GATE THAT MATTERS. `manifest-sign` signs with whatever seed it is
      # given. If the CI secret has drifted from the bundled public key — a
      # rotation applied on one side only, a seed pasted from the wrong key
      # file, a key retired in the root — the release still publishes, and every
      # user's `self-update` then refuses with "signature does not verify", days
      # later, with a green release run behind it. Verifying here turns that
      # into a failed release step.
      - name: Verify the signed manifest against the SHIPPED trust root
        if: steps.manifest_guard.outputs.skip == 'false'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          source/target/release/wayland-release manifest-verify \
            --manifest "artifacts/wayland-core-${RELEASE_TAG}-release-manifest.json" \
            --trust-root "${RUNNER_TEMP}/bundled-trust-root.json" \
            --role release_acceptance \
            --now "$(date -u +%s)"

      # The tooling checkout must not become a release asset. `Upload release
      # assets` globs artifacts/*, and ./source is a sibling, but this asserts
      # rather than assumes — and it re-asserts the manifest is present, so a
      # silently skipped manifest step cannot reach publish unnoticed.
      - name: Assert the asset set before publishing
        if: steps.manifest_guard.outputs.skip == 'false'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          manifests=$(find artifacts -maxdepth 1 -name '*-release-manifest.json' | wc -l)
          if [ "${manifests}" -ne 1 ]; then
            echo "::error::expected exactly one *-release-manifest.json in artifacts, found ${manifests}"
            exit 1
          fi
          test -f "artifacts/wayland-core-${RELEASE_TAG}-sbom.json"
          test ! -e artifacts/source
          echo "asset set:"
          ls -1 artifacts

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_url="https://github.com/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          # A semver pre-release (e.g. v0.11.0-rc.1) must NOT become the
          # "Latest" release — that would mask the stable line. Detect the
          # `-` in the version part and mark the GitHub release accordingly.
          PRERELEASE_FLAG=""
          case "${RELEASE_TAG#v}" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" artifacts/* --repo "${REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" artifacts/* \
              --repo "${REPOSITORY}" \
              --title "${RELEASE_TAG}" \
              ${PRERELEASE_FLAG} \
              --generate-notes
          fi
          echo "Uploaded assets to ${release_url}"

  # ── M2.5 — Post-tag binary smoke ──────────────────────────────────────
  # Download each platform's release archive from the just-published
  # release, extract it, and run `wayland-core --version`. Any non-zero
  # exit fails the job. Gates the next tag: a missing or unrunnable
  # binary surfaces BEFORE customers try to download it.
  #
  # The matrix mirrors `build:` so every artifact is exercised on its
  # native OS. Cross-compiled aarch64 Linux is smoked on ubuntu-latest
  # via `qemu-user-static` since GitHub-hosted runners are amd64.
  # Windows aarch64 cannot execute on amd64 hosts; we verify the PE
  # COFF machine field instead (promote to a self-hosted ARM runner
  # when one is provisioned).
  #
  # Manual verification against an existing tag (e.g. v0.3.0-wayland-base):
  #   gh workflow run release.yml --ref main \
  #     --field tag_name=v0.3.0-wayland-base
  # The workflow_dispatch path reuses `inputs.tag_name` end to end.
  post-tag-smoke:
    name: Smoke ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - prepare-release
      - github-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_name: wayland-core
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_name: wayland-core
            use_qemu: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary_name: wayland-core
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_name: wayland-core
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_name: wayland-core.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive_ext: zip
            binary_name: wayland-core.exe
    steps:
      # M4.9 prep: Linux aarch64 binaries link against libdbus + other host
      # libs that the GitHub-hosted amd64 runner does not have in arm64
      # variants by default. Rather than chase a full multiarch sysroot
      # (libc6-arm64-cross + libdbus-1-3:arm64 + every downstream dep),
      # we switch the aarch64-linux smoke to ELF-header verification — the
      # same shape Windows aarch64 already uses. The binary is shipped
      # to real aarch64 hosts via M2.4's self-hosted runner (parked).
      - name: (no-op) aarch64-linux uses ELF-header verification
        if: matrix.use_qemu == true
        run: echo "qemu execution replaced by ELF-header check below."

      - name: Download release archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          archive="wayland-core-v${VERSION}-${TARGET}.${ARCHIVE_EXT}"
          echo "Downloading ${archive} from release ${RELEASE_TAG}"
          gh release download "${RELEASE_TAG}" \
            --repo "${REPOSITORY}" \
            --pattern "${archive}" \
            --dir ./smoke

          ls -la ./smoke
          echo "ARCHIVE_PATH=./smoke/${archive}" >> "$GITHUB_ENV"

      - name: Extract archive (Unix tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          set -euo pipefail
          mkdir -p ./smoke/extracted
          tar -xzf "$ARCHIVE_PATH" -C ./smoke/extracted
          ls -la ./smoke/extracted
          chmod +x "./smoke/extracted/${BINARY_NAME}"

      - name: Extract archive (Windows zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ./smoke/extracted | Out-Null
          Expand-Archive -Path "$env:ARCHIVE_PATH" -DestinationPath ./smoke/extracted -Force
          Get-ChildItem ./smoke/extracted

      - name: Run --version (native Unix)
        if: matrix.os != 'windows-latest' && matrix.use_qemu != true
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          set -euo pipefail
          out="$("./smoke/extracted/${BINARY_NAME}" --version)"
          echo "version output: ${out}"
          # Sanity: output must contain "wayland-core" and a SemVer.
          echo "${out}" | grep -E 'wayland-core[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "ERROR: --version output did not match expected shape"; exit 1; }

      - name: Verify Linux aarch64 binary file shape only (cannot execute on amd64 runner)
        if: matrix.use_qemu == true
        shell: bash
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          set -euo pipefail
          bin="./smoke/extracted/${BINARY_NAME}"
          test -f "$bin" || { echo "ERROR: $bin not found"; exit 1; }
          size=$(stat -c%s "$bin")
          # Sanity: >= 1MB. Our release binary is ~24MB; anything tiny is broken.
          test "$size" -ge 1048576 || { echo "ERROR: $bin suspiciously small ($size bytes)"; exit 1; }
          # ELF e_machine at offset 0x12 (2 bytes, little-endian). AArch64 = 0xB7.
          machine=$(od -An -tx2 -j18 -N2 --endian=little "$bin" | tr -d ' \n')
          if [ "$machine" != "00b7" ]; then
            echo "ERROR: $bin is not aarch64 (e_machine=0x${machine}; expected 0x00b7)"
            exit 1
          fi
          # ELF magic at offset 0: 0x7F 'E' 'L' 'F'.
          head -c 4 "$bin" | xxd -p | grep -q '^7f454c46' \
            || { echo "ERROR: $bin missing ELF magic"; exit 1; }
          echo "OK: ${BINARY_NAME} is a valid aarch64 Linux ELF binary (${size} bytes)."

      - name: Run --version (Windows amd64-native targets)
        if: matrix.os == 'windows-latest' && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = & "./smoke/extracted/$env:BINARY_NAME" --version
          Write-Host "version output: $out"
          if ($out -notmatch 'wayland-core\s+\d+\.\d+\.\d+') {
            throw "ERROR: --version output did not match expected shape"
          }

      - name: Verify Windows aarch64 binary file shape only (cannot execute on amd64 runner)
        if: matrix.os == 'windows-latest' && matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "./smoke/extracted/$env:BINARY_NAME"
          if (-not (Test-Path $bin)) {
            throw "ERROR: $bin not found in extracted archive"
          }
          $size = (Get-Item $bin).Length
          if ($size -lt 1MB) {
            throw "ERROR: $bin suspiciously small ($size bytes)"
          }
          # PE machine code 0xAA64 = ARM64. Probe via reading the COFF header.
          $bytes = [System.IO.File]::ReadAllBytes($bin)
          # e_lfanew at offset 0x3C points at the PE header.
          $pe_off = [BitConverter]::ToInt32($bytes, 0x3C)
          # "PE\0\0" at $pe_off, then COFF header starts at $pe_off+4. Machine = first 2 bytes.
          $machine = [BitConverter]::ToUInt16($bytes, $pe_off + 4)
          if ($machine -ne 0xAA64) {
            throw "ERROR: $bin is not ARM64 (machine=0x$($machine.ToString('X4')))"
          }
          Write-Host "ARM64 PE binary verified: $bin ($size bytes)"

  # ── npm publish ────────────────────────────────────────────────────────────
  # Repackage the smoke-verified release binaries into the npm publish tree
  # (launcher `@ferroxlabs/wayland-core` + six os/cpu-gated platform packages)
  # and publish them. Consumers — AionCLI (a plain dependency) and the Wayland
  # desktop's prepareWaylandCore.js (node_modules resolution path) — pull the
  # ONE binary matching their platform via npm's os/cpu + optionalDependencies.
  #
  # Gated on post-tag-smoke — but NOT uniformly, and the difference matters.
  # This comment previously read "npm only ever serves a binary that already ran
  # `--version` on its native OS". That is FALSE for the two aarch64 packages,
  # which are header-verified only (see the arch-check at :624-684) because no
  # aarch64 runner executes them here. Measured 2026-07-30 by lane
  # `27c5-aarch64`, which then retired the linux half by actually running it:
  # aarch64-unknown-linux-gnu is 8 PASS / 1 RED at v0.12.25 and 9 PASS / 0 RED
  # at candidate b7560018 on real Apple ARM cores.
  #
  # `aarch64-pc-windows-msvc` remains UNEXECUTED and cannot be executed on any
  # host we have: the ARM64 PE (machine 0xAA64) returns NOLAUNCH /
  # ERROR_BAD_EXE_FORMAT on the x86_64 Windows box, with an x86_64 PE in the
  # same session returning 0 as the known-positive. So npm can still serve one
  # binary that has never run anywhere. Do not restore the old sentence without
  # a Windows-on-ARM runner to make it true.
  #
  # Requires the org secret NPM_TOKEN (an
  # automation token for the @ferroxlabs npm org); without it the job no-ops
  # with a notice instead of failing the release.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - post-tag-smoke
    # `id-token: write` lets `npm publish --provenance` mint a keyless,
    # Sigstore-signed, transparency-logged provenance attestation for each npm
    # package (no key custody). A job-level block REPLACES the workflow-level
    # `contents: write`; this job only reads the checked-out tag.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}

      - name: Guard — NPM_TOKEN present
        id: guard
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN not set — skipping npm publish for this release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download build artifacts
        if: steps.guard.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract binaries by target
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p binaries
          for triple in \
            aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu \
            aarch64-pc-windows-msvc x86_64-pc-windows-msvc; do
            dest="binaries/${triple}"
            mkdir -p "$dest"
            case "$triple" in
              *windows*)
                unzip -o "artifacts/wayland-core-v${VERSION}-${triple}.zip" -d "$dest" ;;
              *)
                tar -xzf "artifacts/wayland-core-v${VERSION}-${triple}.tar.gz" -C "$dest" ;;
            esac
            ls -l "$dest"
          done

      - name: Generate npm publish tree
        if: steps.guard.outputs.skip == 'false'
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node npm/generate.mjs --version "${VERSION}" --binaries binaries --out npm-dist

      - name: Publish (platform packages first, launcher last)
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          # A semver pre-release (e.g. 0.11.0-rc.1) must publish under the
          # `next` dist-tag, NOT `latest` — otherwise a plain
          # `npm install @ferroxlabs/wayland-core` would serve the RC over the
          # stable line. Stable versions keep the default `latest`.
          case "${VERSION}" in
            *-*) NPM_DIST_TAG="next" ;;
            *)   NPM_DIST_TAG="latest" ;;
          esac
          echo "Publishing @ferroxlabs/wayland-core@${VERSION} under dist-tag '${NPM_DIST_TAG}'"
          # Platform packages BEFORE the launcher so the launcher's
          # optionalDependencies are resolvable the instant it lands.
          # `--provenance` rides the job's `id-token: write` to emit a keyless
          # Sigstore provenance statement (requires repository.url in each
          # package.json to case-match the GitHub slug — see npm/generate.mjs).
          for d in npm-dist/wayland-core-*; do
            ( cd "$d" && npm publish --provenance --access public --tag "${NPM_DIST_TAG}" )
          done
          ( cd npm-dist/wayland-core && npm publish --provenance --access public --tag "${NPM_DIST_TAG}" )
          echo "Published @ferroxlabs/wayland-core@${VERSION} (dist-tag ${NPM_DIST_TAG}) + platform packages"
