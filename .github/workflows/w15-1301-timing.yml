name: w15-1301 dispatch budget timing (throwaway)

# THROWAWAY measurement workflow for FerroxLabs/wayland#1301 c3. Lives ONLY on
# the `timing/w15-1301` branch and must never reach a release or main branch.
# It reproduces the CI (Array) leg's "Dispatch budget boundary (isolated
# Windows execution)" step on the same hosted executor class (windows-latest)
# with the same job env, then runs that exact nextest invocation n times,
# interleaving release (what CI runs) with debug (the pre-1780b3164 build).

on:
  push:
    branches: ['timing/w15-1301']

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]
    name: dispatch-budget timing ${{ matrix.shard }} (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record executor
        shell: pwsh
        run: |
          "runner_name=$env:RUNNER_NAME computername=$env:COMPUTERNAME cores=$([Environment]::ProcessorCount)"
          (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          "mem_gb=" + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          "os_build=" + (Get-CimInstance Win32_OperatingSystem).BuildNumber
      - uses: actions/checkout@v6
      - name: Setup vx (installs Rust + just from vx.toml)
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build release test binary (as the CI isolated step does)
        shell: bash
        run: vx cargo nextest run --locked --release -p wcore-agent --test workflow_limits_test --no-run
      - name: Build debug test binary
        shell: bash
        run: vx cargo nextest run --locked -p wcore-agent --test workflow_limits_test --no-run
      - name: Interleaved timing (n per arm, every sample recorded)
        shell: pwsh
        run: |
          ./.scratch1301/harness1301.ps1 -Src $PWD -Out "$env:RUNNER_TEMP\t1301" -N 6 -SampledN 2 -Arms release,debug -CargoExe vx -CargoPrefix cargo
      - name: Publish samples
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP\t1301\meta.txt" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\t1301\samples.csv" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1301-${{ matrix.shard }}
          path: ${{ runner.temp }}/t1301
