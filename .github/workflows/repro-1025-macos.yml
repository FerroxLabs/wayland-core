name: repro-1025-macos

# gh#1025, final hunt. Everything except one region is eliminated; the
# io::Error funnel in wcore-swarm/src/error.rs now prints a full backtrace, so
# ONE reproduction names the line.
#
# Runs on the SELF-HOSTED macOS runner, deliberately:
#   * the GitHub-hosted macOS pool stopped creating runs entirely for this
#     workflow (two consecutive pushes produced zero runs) while a release
#     occupied it, and
#   * this is the owner's own machine, so the job is written to get off it as
#     fast as possible: it STOPS AT THE FIRST FAILURE rather than completing a
#     fixed loop, and caps at 30 minutes.
# Observed failure rate is ~37% (22/60), so 25 attempts is >99.9% likely to
# catch one and will usually stop within the first handful.

on:
  push:
    branches:
      - 'verify/1025-instr'

permissions:
  contents: read

concurrency:
  group: repro-1025-macos
  cancel-in-progress: false

jobs:
  repro:
    name: 'gh#1025 backtrace hunt (self-hosted macOS)'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 30
    env:
      WCORE_GH1025_TRACE: '1'
      RUST_BACKTRACE: 'full'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checkout for git
        run: git config --global --add safe.directory '*'

      - name: Use the runner's installed Rust toolchain
        run: |
          for d in "$CARGO_HOME/bin" "$HOME/.cargo/bin" /usr/local/bin /opt/homebrew/bin; do
            if [ -x "$d/cargo" ]; then echo "$d" >> "$GITHUB_PATH"; echo "cargo at $d"; break; fi
          done
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo -V && rustc -vV | head -3
          sw_vers
          echo "load: $(uptime)"

      - name: Build the test binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          # -j4 on a 10-core machine that belongs to a person, not to CI.
          cargo test -p wcore-swarm --test workspace_authority --no-run -j 4 2>&1 | tail -4

      - name: Hunt — stop at the FIRST reproduction
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          set +e
          mkdir -p /tmp/gh1025
          CAUGHT=0
          for i in $(seq 1 25); do
            LOG=/tmp/gh1025/iter-$i.log
            cargo test -p wcore-swarm --test workspace_authority \
              independent_cli_processes_cannot_overbook_shared_capacity \
              -- --exact --nocapture > "$LOG" 2>&1
            if [ $? -ne 0 ]; then
              CAUGHT=1
              echo "########## REPRODUCED on iteration $i ##########"
              echo "--- verdict ---"
              grep -E "assertion|panicked" "$LOG" | head -5
              echo ""
              echo "--- THE BACKTRACE (this is the whole point) ---"
              # Print the funnel trace plus a generous window after it: the
              # first wcore_swarm frame below the From impl is the culprit.
              grep -A 60 "gh1025 bare-io" "$LOG" | head -90
              echo ""
              echo "--- wcore_swarm frames only ---"
              grep -A 60 "gh1025 bare-io" "$LOG" | grep -E "wcore_swarm|worktree" | head -25
              break
            fi
            printf "."
          done
          echo ""
          if [ "$CAUGHT" = "0" ]; then
            echo "!! 25 iterations, no reproduction — the rate dropped or the machine is too fast/slow to hit the window"
          fi
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh1025-backtrace
          path: /tmp/gh1025
          if-no-files-found: warn

      - name: Leave the machine clean
        if: always()
        run: rm -rf /tmp/gh1025 || true
