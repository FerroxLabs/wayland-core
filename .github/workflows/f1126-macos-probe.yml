# FerroxLabs/wayland#1126 — LANE-ONLY DIAGNOSTIC WORKFLOW. NOT FOR MERGE.
#
# `ci.yml` gives a macOS verdict in ~65 minutes and only when the commit message
# carries `[ci-darwin]`. That is the right instrument for the final proof and the
# wrong one for iterating on a hypothesis. This runs ONE test binary on
# `macos-latest` (which is arm64) so a cycle costs a build, not a matrix.
name: f1126 macOS probe

on:
  push:
    branches:
      - 'lane/f1126'

permissions:
  contents: read

concurrency:
  group: f1126-macos-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: f1126 macOS probe
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Host facts
        run: |
          sysctl -n hw.logicalcpu hw.physicalcpu
          sw_vers
          uname -m
          echo "TMPDIR=$TMPDIR"

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: f1126-probe

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build the two pty binaries
        run: cargo nextest list -p wcore-cli --test f1126_macos_probe --test f1126_jsonstream_probe --test path_boundary_tui_pty

      # INTERLEAVED ARMS, MATCHED n. Iteration 4 ran TUI x5 then json-stream
      # x5 and got 1 wedge / 0 wedges. At an observed per-attempt wedge rate of
      # ~20% in that run, seeing 0 of 5 on the second arm happens 33% of the
      # time even if the two arms were IDENTICAL - so that result bounded
      # nothing. Two fixes, both required:
      #
      #   * matched n=12 per arm, not 5;
      #   * INTERLEAVED, so a drift in host conditions across the job lands on
      #     both arms instead of only the one that ran second.
      #
      # --no-capture on every arm: [profile.ci] sets success-output = "never",
      # which throws the readings away on exactly the attempts that pass - and
      # for the json-stream arm a PASS is the result being measured.
      - name: interleaved arms, matched n=12
        run: |
          for i in $(seq 1 12); do
            echo "::group::pair $i"
            cargo nextest run --profile ci --retries 0 --no-fail-fast \
              -p wcore-cli --test f1126_macos_probe --no-capture || echo "TUI ATTEMPT $i FAILED"
            cargo nextest run --profile ci --retries 0 --no-fail-fast \
              -p wcore-cli --test f1126_jsonstream_probe --no-capture || echo "JSONSTREAM ATTEMPT $i FAILED"
            echo "::endgroup::"
          done

      # The real test, unquarantined, three times — so the probe's reading is
      # anchored to the actual subject rather than only to its copy.
      - name: real test (--run-ignored all) x3
        run: |
          for i in 1 2 3; do
            echo "::group::real attempt $i"
            cargo nextest run --profile ci --retries 0 --no-fail-fast --run-ignored all \
              -p wcore-cli --test path_boundary_tui_pty --no-capture || echo "REAL ATTEMPT $i FAILED"
            echo "::endgroup::"
          done
