name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      # 20A-01 Wiring A. Before this line, `ci.yml` fired ONLY on
      # `pull_request → main` / `push → main`, so a long-lived working branch
      # with no open PR went through CI zero times:
      # `gh run list -R FerroxLabs/wayland-core --branch plan/f20-unified-audit-repair`
      # returned `[]`, and the last ci.yml run of ANY kind was 2026-07-13.
      # The macOS leg and the self-hosted Windows leg had therefore never
      # COMPILED this tree — which is how a Windows-fatal E0433 in
      # crates/wcore-tools/tests/bash_sandbox_routing_test.rs (20A-01 F-01)
      # sat on the branch undetected behind an 11,519-test Linux-only green.
      #
      # `workflow_dispatch` was considered first and rejected: GitHub only
      # exposes that trigger for workflows already present on the DEFAULT
      # branch, and ci.yml on `main` has no such trigger, so a dispatch
      # against this ref cannot fire. Naming the branch in `push` is the only
      # route that actually runs, and it needs no change to `main`.
      #
      # Transient: drop this entry when the branch merges. The job matrix,
      # runner labels, concurrency group and test commands are untouched.
      - plan/f20-unified-audit-repair
      # 2026-07-27. Lane branches, so a lane can obtain a CI-built binary for
      # its OWN changes. Without this, `gh run download` only ever yields
      # artifacts from the integration branch, and a lane needing macOS or
      # Windows evidence for work it has not merged yet has no route to a
      # binary at all — which read as "macOS is not obtainable" and was
      # escalated twice as a platform impossibility. It is a CI-trigger gap
      # with a one-line fix. A wildcard rather than one entry per lane,
      # because lanes are created and retired continuously and an
      # enumeration goes stale the moment it is written.
      #
      # Same reasoning as above applies: `workflow_dispatch` is not available,
      # because GitHub exposes it only for workflows present on the DEFAULT
      # branch and ci.yml on `main` has no such trigger.
      - 'lane/**'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs (cheap, and only the latest push matters there),
  # but NEVER cancel a branch push. Phases 24-27 execute in bounded parallel
  # worktrees, each pushing its own branch; with unconditional cancellation
  # those runs terminate each other and the fan-out silently loses CI coverage.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── macOS runner admission control ────────────────────────────────────
  # 2026-07-29, lane/ci-macos-budget. Measured, not inferred (raw evidence in
  # .planning/CI-MACOS-BUDGET.md):
  #
  #   * GitHub-hosted macOS concurrency ceiling on this account is FIVE. Peak
  #     concurrent *executed* macOS jobs observed over a 10.84 h / 303-run
  #     window = 5; throughput 11.25 macOS jobs/hour; median macOS job 19.6 min.
  #   * Demand over that same window was 22.4 macOS jobs/hour — ~2x capacity,
  #     permanently. The queue grew ~11 jobs/hour and could never drain.
  #     Observed macOS waits of 4h06m, 5h03m and 5h31m.
  #   * 96.3% of all macOS jobs created came from `lane/**` (234 of 243). The
  #     integration branch got NINE, of which seven executed, in 10.8 hours —
  #     and produced ZERO CI verdicts in 9 hours.
  #   * macOS is the ONLY constrained pool. Within a single run, dispatched at
  #     one instant, ubuntu-latest jobs started in 1-8s and windows-latest in
  #     2-5s while the macOS jobs were still queued 80+ minutes later. So this
  #     is not account-wide throttling.
  #
  # The `lane/**` push trigger (line 41) is NOT deleted — it exists so a lane
  # that cannot compile for Darwin or Windows locally can obtain a CI-built
  # binary for its own unmerged changes, and deleting it would re-break that.
  # Windows is unconstrained (2-5s waits, plus a self-hosted runner), so the
  # Windows half of that capability is untouched and stays unconditional. Only
  # the macOS half is rationed: on a `lane/**` push the three macOS jobs are
  # scheduled ON OPT-IN ONLY, via `[ci-darwin]` (alias `[ci-macos]`) in a
  # pushed commit message. `main`, the integration branch and every
  # pull_request keep the full, unmodified matrix.
  #
  # Why a computed matrix rather than a job-level `if:`: `jobs.<id>.if` cannot
  # read the `matrix` context (only github/needs/vars/inputs), so an `if` can
  # only skip an ENTIRE job — which would also drop the self-hosted Windows CI
  # leg and all four non-Darwin build targets. Emitting the matrix keeps every
  # job NAME byte-identical (`CI (macos-latest)`, `Build (aarch64-apple-darwin)`
  # …), so nothing downstream that keys on a check name breaks.
  #
  # Fails closed: if this job errors, its dependents are skipped AND the run
  # conclusion is `failure`, so a broken budget job goes red rather than
  # silently deleting CI coverage.
  budget:
    name: Runner budget (macOS admission control)
    runs-on: ubuntu-latest
    outputs:
      darwin: ${{ steps.decide.outputs.darwin }}
      ci_os: ${{ steps.decide.outputs.ci_os }}
      build_matrix: ${{ steps.decide.outputs.build_matrix }}
    steps:
      - id: decide
        # Commit messages are attacker-controllable. They are passed through
        # `env:` and never interpolated into the `run:` script text — the
        # documented GHA script-injection mitigation, and the same discipline
        # AGENTS.md already mandates for LLM-supplied data reaching a shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          PUSH_MSGS: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          set -euo pipefail

          darwin=false
          reason="lane push with no macOS opt-in token"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            darwin=true
            reason="pull_request — full matrix always"
          fi

          case "$REF_NAME" in
            main|plan/f20-unified-audit-repair)
              darwin=true
              reason="protected/integration branch '$REF_NAME' — full matrix always"
              ;;
          esac

          if [ "$darwin" = "false" ]; then
            # Scan the tip commit AND every commit in the push. GitHub caps the
            # `commits` array at 20; `head_commit` always covers the tip, so a
            # token on the tip works regardless of push size.
            if printf '%s\n%s\n' "${HEAD_MSG:-}" "${PUSH_MSGS:-}" \
                 | grep -qiE '\[ci-(darwin|macos)\]'; then
              darwin=true
              reason="opt-in token [ci-darwin]/[ci-macos] found in a pushed commit message"
            fi
          fi

          # The self-hosted Windows CI leg and the four non-Darwin build targets
          # are ALWAYS present, so neither matrix vector can ever be empty —
          # an empty vector is a hard workflow error ("Matrix vector 'os' does
          # not contain any values"). Asserted below rather than assumed.
          win_ci='["self-hosted","Windows","X64","msvc"]'
          non_darwin_builds='{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","use_cross":true},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"windows-latest","target":"aarch64-pc-windows-msvc"}'
          darwin_builds='{"os":"macos-latest","target":"x86_64-apple-darwin"},{"os":"macos-latest","target":"aarch64-apple-darwin"}'

          if [ "$darwin" = "true" ]; then
            ci_os="[\"macos-latest\",${win_ci}]"
            build_matrix="{\"include\":[${non_darwin_builds},${darwin_builds}]}"
          else
            ci_os="[${win_ci}]"
            build_matrix="{\"include\":[${non_darwin_builds}]}"
          fi

          # Gate: both payloads must be valid JSON and non-empty. Without this a
          # typo above would surface as an opaque matrix error on the dependent
          # jobs instead of failing here with the offending value printed.
          echo "$ci_os" | jq -e 'type == "array" and length >= 1' > /dev/null
          echo "$build_matrix" | jq -e '.include | type == "array" and length >= 4' > /dev/null

          {
            echo "darwin=$darwin"
            echo "ci_os=$ci_os"
            echo "build_matrix=$build_matrix"
          } >> "$GITHUB_OUTPUT"

          # Make the decision LOUD. The residual risk of an opt-in gate is
          # silent absence: a lane push goes green having never touched macOS
          # and looks identical to a fully covered one. An absent job is at
          # least visible in the checks list; this makes it explicit, and
          # annotates the run so a reader cannot miss it.
          {
            echo "### macOS runner budget"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| event | \`$EVENT_NAME\` |"
            echo "| ref | \`$REF_NAME\` |"
            echo "| **macOS jobs scheduled** | **\`$darwin\`** |"
            echo "| reason | $reason |"
            echo
            if [ "$darwin" = "true" ]; then
              echo "DARWIN_REQUESTED — \`CI (macos-latest)\`, \`Build (aarch64-apple-darwin)\` and \`Build (x86_64-apple-darwin)\` are scheduled."
            else
              echo "DARWIN_SKIPPED — this run has **no macOS coverage and no macOS binary artifacts**."
              echo "Linux and Windows coverage are unchanged."
              echo
              echo "To get them, push again with \`[ci-darwin]\` in the commit message, e.g.:"
              echo '```'
              echo 'git commit --allow-empty -m "[ci-darwin] need a macOS binary for live testing"'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$darwin" = "true" ]; then
            echo "::notice title=macOS budget::DARWIN_REQUESTED — $reason"
          else
            echo "::warning title=macOS budget::DARWIN_SKIPPED — $reason. No macOS coverage or artifacts in this run; push with [ci-darwin] to enable."
          fi

  ci:
    name: CI (${{ matrix.os }})
    needs: budget
    runs-on: ${{ matrix.os }}
    # Shrink debug info + disable incremental compile across the matrix.
    # The Windows runner has ~14GB free disk and the default Rust dev
    # profile + full PDB debug info blew past it on CI run 26396718138
    # (windows-latest hit `LNK1318: Unexpected PDB error; LIMIT (12)` +
    # "Free space left: 4 MB" after ~83min of compile). line-tables-only
    # keeps panic backtraces with line numbers (the only debug info we
    # actually USE in CI) and shrinks PDBs by ~80%. CARGO_INCREMENTAL=0
    # avoids the extra ~30-40% target/ growth. Same env the
    # linux-containerized job uses (see line ~168 below).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      # Emitted by the `budget` job above. Full value is
      #   ["macos-latest",["self-hosted","Windows","X64","msvc"]]
      # — byte-identical to the literal list this replaced, so the job names
      # `CI (macos-latest)` and `CI (Array)` are unchanged. On a `lane/**` push
      # without a `[ci-darwin]` opt-in the `macos-latest` entry is omitted; the
      # self-hosted Windows entry is ALWAYS present, so the vector is never empty.
      matrix:
        os: ${{ fromJSON(needs.budget.outputs.ci_os) }}
        # Windows runs on a self-hosted runner (Sean's box, labels:
        # self-hosted,Windows,X64,msvc). Switched off windows-latest
        # during v0.8.6 round 18 — GHA's hosted Windows runner has
        # cold cache every run (~70 min per cycle), and we needed
        # tight iteration to chase down the env_clear production-bug
        # cascade. The self-hosted runner keeps the cargo target/
        # dir warm between runs (~5-15 min per cycle).
        #
        # Linux coverage runs in the dedicated `ci-linux` job below
        # (containerized rust:1.95-slim-bookworm). The matrix used to
        # include ubuntu-latest but GHA's direct-shell execution
        # reproducibly crashes the runner agent ~56s into the nextest
        # step (logs never flush; step stuck `in_progress` forever;
        # see CI runs 25985666496 + 25990242660 + 25992583857 +
        # 25993984142 + 25995409932 + the v0.6.1 hardening branch
        # 26079949448 + 26081606679). The crash is environmental to
        # GHA's direct shell — the same command runs cleanly inside
        # a 7GB-constrained x86_64 container (624 MB peak RSS, 0
        # oom_kills, ~80s compile + 0.118s run). Same workaround
        # already applied to the eval-gate Linux job; this extends
        # it to the full test+lint+audit pipeline.

    steps:
      - uses: actions/checkout@v6

      - name: Setup vx (installs Rust + just from vx.toml)
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      # The self-hosted Windows runner intermittently leaves a locked
      # `.install-action/tmp` behind between runs, so taiki-e/install-action's
      # own retry hits `rm: cannot remove '.../.install-action/tmp/tmp': Device
      # or resource busy` and the step dies on a bash-startup flake
      # (actions/partner-runner-images#169) — the recurring `CI (Array)` red that
      # stalls the strict-mode merge train. Force-clear the stale state before
      # install (guarded to Windows, failure-tolerant so it can never break the
      # job) so install-action starts clean and its built-in retry succeeds
      # inside this one run — no job re-run needed.
      - name: Clear stale install-action state (Windows flake mitigation, partner-runner-images#169)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for base in "$USERPROFILE" "/c/Users/$USERNAME" \
                      "/c/WINDOWS/ServiceProfiles/NetworkService" \
                      "/c/WINDOWS/system32/config/systemprofile"; do
            [ -n "$base" ] && rm -rf "$base/.install-action/tmp" "$base/.install-action/init" 2>/dev/null || true
          done
          exit 0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Pre-build binaries that tests shell out to. Two tests do this:
      #
      # - `scripted_run_writes_expected_markdown` runs
      #   `cargo run --bin tool_token_bench` (CI runs 25950354044 /
      #   25951422906 / 25952102095 — Ubuntu timeouts).
      #
      # - `release_binary_ready_event_advertises_plugin_capabilities`
      #   runs `cargo build --release -p wcore-cli` (CI run 25953795604
      #   — Windows file-lock contention against parallel tests on the
      #   target/ directory; mandatory file locks on NTFS made this
      #   fatal where Linux/macOS just queued).
      #
      # Pre-building both here means the tests find existing binaries
      # and skip the in-test cargo invocation entirely.
      - name: Pre-build tool_token_bench
        run: vx cargo build -p wcore-agent --bin tool_token_bench --features test-utils

      - name: Pre-build wcore-cli release binary (smoked by release_binary_smoke tests)
        run: vx cargo build --release -p wcore-cli

      - name: Check formatting
        run: vx just fmt-check

      - name: Clippy (warnings = errors)
        run: vx just lint

      - name: Run tests (nextest CI profile)
        run: vx just test-ci

      # 2026-07-27: MOVED to after the test step. It used to run before it, so a
      # contract digest drift failed the job at that step and macOS and
      # self-hosted Windows never reached the tests at all — three separate
      # lanes reported "CI is red on two of three platforms" when what was
      # actually lost was test VISIBILITY on those platforms.
      #
      # Deliberately still a hard failure, and deliberately NOT fixed by
      # regenerating: a 4-way cross-audit went 3-0 against re-stamping the
      # digests on a working branch, on the grounds that an agent who
      # regenerates whenever CI goes red destroys the only guard that would
      # catch a genuine wire change. The drift here is bookkeeping only —
      # measured field-by-field, exactly `fixture_digest` and
      # `source_inputs_digest` moved while `schema_digest` did NOT, so the wire
      # shape is unchanged — but the coordinated Core+Desktop re-pin is still
      # owed and the red is the honest signal that it is owed. See
      # .planning/SEAM-REQUESTS/CONTRACT-DIGEST-RESTAMP.md.
      #
      # Ordering only. The command, its strictness and its exit status are
      # untouched: the job still fails on drift, it just reports the tests first.
      - name: Check Desktop protocol contract corpus drift
        run: vx cargo run -p wcore-protocol --bin wcore-contract -- check

      # V1 C2 — release-binary smoke. Catches the v0.2.0 BLOCKER #1 class
      # of regression where `inventory::submit!` items get dead-code-stripped
      # under `profile.release` (lto="thin" + codegen-units=1) but survive
      # in the debug binary that test-ci exercises. Gating, no continue-on-error.
      # WCORE_SMOKE_REQUIRE_PREBUILT=1 makes a missing artifact a hard failure
      # here (dev checkouts without the env var skip instead — #190), so a
      # dropped/broken "Pre-build wcore-cli release binary" step cannot
      # silently degrade this gate into a skip.
      - name: Release binary smoke (catches plugin dead-code-strip)
        run: vx cargo nextest run -p wcore-cli --test release_binary_smoke
        env:
          WCORE_SMOKE_REQUIRE_PREBUILT: "1"

      # F01 E3 runs on every supported native OS. Bind discovery to the exact
      # pre-built release artifact so a stale debug binary cannot satisfy it.
      - name: F01 packaged wayland-eval driver gate
        run: vx cargo test --locked -p wcore-eval-scenarios --features packaged-driver-gate --test packaged_driver_gate
        env:
          WAYLAND_BUILD_SOURCE_SHA: ${{ github.sha }}
          WCORE_EVAL_BIN: ${{ github.workspace }}/target/release/wayland-core${{ runner.os == 'Windows' && '.exe' || '' }}

      # Z0 STABILITY MAJOR #4 — eval-gate runs on every PR/main commit so
      # the W10A LOCKED acceptance gate (precision/recall >= 0.80) is enforced
      # by automation, not by convention. Required to pass before merge.
      #
      # Linux coverage runs as the dedicated `eval-gate-linux` job below
      # (containerized rust:1.95-slim-bookworm), bypassing a GHA
      # ubuntu-latest runner-agent crash that kills the direct invocation
      # at ~56s reproducibly (logs: BlobNotFound 404; step stuck
      # `in_progress` forever — see CI runs 25985666496 + 25990242660 +
      # 25992583857 + 25993984142 + 25995409932). The exact same nextest
      # command runs cleanly in a 7GB-constrained x86_64 container
      # locally (624 MB peak RSS, 0 cgroup oom_kills, passes in ~80s
      # compile + 0.118s run). The crash is environmental to GHA's
      # direct shell execution, not the gate code.
      - name: Eval acceptance gate (W10A precision/recall >= 0.80)
        if: runner.os != 'Linux'
        timeout-minutes: 7
        run: vx cargo nextest run -p wcore-eval --features acceptance-gate acceptance_gate_meets_precision_recall_threshold --no-fail-fast --run-ignored only

      # Z0 STABILITY BLOCKER #2 — cargo audit failures NOW block the build.
      # The previous continue-on-error let RUSTSEC advisories slip through
      # to release tags. If a specific advisory needs documented triage,
      # add it to an explicit ignore list — never bypass globally.
      - name: Security audit
        run: vx cargo audit

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # ── Full CI on Linux (host runner + per-step docker exec) ─────────────
  # Mirrors the macOS/Windows matrix steps (fmt + lint + tests + release
  # smoke + audit) on Linux x86_64, executing each command inside
  # rust:1.95-slim-bookworm to bypass the GHA ubuntu-latest direct-shell
  # runner-agent crash that killed the in-matrix ubuntu cell on v0.6.1
  # hardening runs 26079949448 + 26081606679 (same crash pattern as the
  # eval-gate; see comment on the ci: matrix above for the run-id list).
  #
  # Why not a job-level `container:`? The matrix's "Free disk space"
  # step (drops ~50GB of preinstalled dotnet/android/ghc/etc.) only
  # frees disk on the HOST runner filesystem, not inside a container.
  # Job-level container mode runs every step inside the container, so
  # the cleanup can't see the host's preinstalled bloat — and the
  # workspace's debug-target dir (~40GB+ of build artifacts) lives on
  # host disk via the volume mount. v0.6.1-hardening CI run 26089764166
  # reproduced this exactly: nextest's link step ENOSPC'd at
  # engine_test.
  #
  # The fix: regular ubuntu-latest job for the disk-cleanup step, then
  # per-step `docker run` invocations that share the host workspace
  # mount. This combines the matrix's host-side cleanup with the
  # eval-gate's containerized isolation. cargo + system deps are baked
  # into a one-shot image build so subsequent steps reuse them via
  # docker's layer cache; cargo's target/ accumulates in the workspace
  # mount across steps so each step's compile is incremental.
  ci-linux:
    name: CI (linux-containerized)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI_IMAGE: wayland-core-ci:rust-1.95-slim-bookworm
      # Linux runners ship with ~14GB free; the host cleanup step
      # below frees ~50GB more. The workspace's debug test binaries
      # still nearly fill that on link (200+ binaries × ~100MB each).
      # Drop debug-info to line-tables-only (still gives panic
      # backtraces with line numbers; just no DWARF for gdb) and
      # disable incremental compile to cut target/ by ~30-40%.
      # Per-run cleanup of the cargo registry cache happens between
      # docker runs because CARGO_HOME stays in the image; only the
      # workspace target/ persists across steps via the mount.
      # `--init` (2026-07-29) is load-bearing, not hygiene. Without it PID 1 in
      # this container is the test command itself. Nothing in crates/ sets
      # PR_SET_CHILD_SUBREAPER, so an orphaned descendant reparents to PID 1, and
      # Rust's Child::wait() issues waitpid(<specific pid>) -- never wait(-1) --
      # so PID 1 can never incidentally reap an adopted orphan. The corpse stays
      # a zombie forever, and all 13 descendant-reaping tests probe liveness with
      # a shape a zombie satisfies: kill(pid,0) returns 0 for state Z
      # (runner_contracts.rs:125, pty_capture.rs:783) and /proc/<pid> still
      # exists for it (wcore-sandbox/tests/process_capture.rs:12,
      # wcore-swarm/src/worktree_tests/linux.rs:629). 7+2+2+2 = 13, exactly the
      # cluster. Containment genuinely SUCCEEDS -- the listener is dead and the
      # process holds nothing -- but every probe reports it as surviving.
      # Measured 4 ways on a near-exact runner match (Ubuntu 24.04 / Docker
      # 29.2.1); raw transcript .planning/evidence/ci-image/c4-probe-RESULT.txt:
      #   native (PID 1 = systemd)          -> GONE,  /proc state '-'  PASS
      #   container, these flags, no --init -> ALIVE, /proc state 'Z'  FAIL
      #   container + --init (docker-init)  -> GONE,  /proc state '-'  PASS
      #   container + --init, LIVE child    -> ALIVE, /proc state 'S'  FAIL  <- control
      # That last arm is the one that matters: --init does NOT make these tests
      # unfailable. A genuinely surviving descendant still reds them.
      DOCKER_RUN: docker run --rm --init --network=host -e CARGO_PROFILE_DEV_DEBUG=line-tables-only -e CARGO_INCREMENTAL=0 -v ${{ github.workspace }}:/work -w /work

      # Same as DOCKER_RUN plus the four grants bubblewrap needs. Applied ONLY to
      # the test step -- fmt, clippy, build and audit keep the default posture,
      # because grant scope should track need scope.
      #
      # Installing the bubblewrap PACKAGE is necessary and NOT sufficient. All
      # four flags were measured individually; each closes a distinct refusal,
      # and removing any one puts the failure back:
      #   apparmor=unconfined     Ubuntu 24.04 sets
      #                           kernel.apparmor_restrict_unprivileged_userns=1
      #                           (confirmed on the build host). Without this:
      #                           "bwrap: No permissions to create new namespace".
      #   seccomp=unconfined      without it, after the userns is created:
      #                           "bwrap: loopback: Failed RTM_NEWADDR: Operation
      #                           not permitted" (--unshare-all brings up lo).
      #   cap-add SYS_ADMIN       without it: "bwrap: Failed to make / slave:
      #                           Permission denied".
      #   systempaths=unconfined  Docker masks paths under /proc; those masks are
      #                           locked mounts, so bwrap's `--proc /proc` is
      #                           refused with "bwrap: Can't mount proc on
      #                           /newroot/proc: Operation not permitted".
      #                           THIS is the flag the earlier attempt was missing:
      #                           it diagnosed a bind-mount/propagation problem and
      #                           removed its job. That diagnosis is REFUTED --
      #                           running the identical bwrap argv against a
      #                           container-internal directory instead of the
      #                           bind-mounted /work fails identically, so the bind
      #                           mount was never the variable. Its namespace probe
      #                           passed only because it omitted --proc, i.e. it
      #                           answered an easier question than the engine asks.
      #
      # Proof this is the right trade, measured on the build host with this exact
      # image at this exact commit (.planning/CI-IMAGE.md):
      #   bwrap installed, NO grant  -> 100 tests run: 86 passed, 14 failed
      #   bwrap installed, grant     -> 100 tests run: 100 passed,  0 failed
      # Zero regressions: nothing that passed without the grant fails with it,
      # including the fail-closed and hard-containment cases that are the ones
      # most sensitive to sandbox posture.
      #
      # On the security question: this container is a workaround for a GHA
      # runner-agent crash (see the block above), NOT a boundary against the code
      # under test -- the workflow already executes arbitrary repo code directly
      # on the ephemeral runner in the macOS and Windows legs. The grant moves the
      # Linux container TOWARD a normal Linux host, which is the environment these
      # tests are written for; the container's extra restrictions are the anomaly.
      # Cross-audit was 2-of-3 for granting the whole test leg, 1-of-3 (kimi) for a
      # separate privileged job on scope-discipline grounds. That dissent is the
      # reason this is a second variable used by one step rather than folded into
      # DOCKER_RUN, and the reason every flag above carries its measured refusal.
      # Do NOT copy these flags to another step without re-measuring.
      # WCORE_REQUIRE_ENFORCING_SANDBOX=1 (anvil_forge_transaction.rs:780) is armed
      # deliberately. Before this commit the hard-containment test qualified-and-
      # skipped here and the leg stayed green, so a sandbox that quietly stopped
      # enforcing was indistinguishable from one that never could. Now that the
      # grant above makes an enforcing sandbox genuinely available, there is no
      # remaining reason to tolerate a skip: if bwrap ever stops working in this
      # container -- GitHub tightening userns, a base-image change, a dropped flag
      # -- this step goes RED instead of silently skipping. Mirrors the
      # WCORE_SMOKE_REQUIRE_PREBUILT idiom (#190).
      DOCKER_RUN_SANDBOX: docker run --rm --init --network=host --cap-add SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined -e WCORE_REQUIRE_ENFORCING_SANDBOX=1 -e CARGO_PROFILE_DEV_DEBUG=line-tables-only -e CARGO_INCREMENTAL=0 -v ${{ github.workspace }}:/work -w /work
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (drop unused preinstalled toolchains)
        run: |
          set -e
          echo "=== BEFORE ==="; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /home/linuxbrew
          sudo rm -rf /usr/local/share/chromium
          echo "=== AFTER ==="; df -h /

      - name: Build CI image (deps + cargo tools baked in)
        run: |
          docker build -t "$CI_IMAGE" -f - . <<'EOF'
          FROM rust:1.95-slim-bookworm
          # python3 / procps / bubblewrap (2026-07-29): 49 of the 68 failures the
          # restored --no-fail-fast signal revealed were this image missing three
          # binaries, not the product being broken. Every one of the 68 was
          # re-measured by name on a host that HAS them: 67 passed.
          #   python3     23 failures. crates/wcore-cli/tests/portability_hostile_corpus.rs:119
          #               shells out to it and `.expect()`s, so its absence is fatal, not skipped:
          #               "python3 must be available to materialise a hostile corpus:
          #                Os { code: 2, NotFound }"
          #   procps (ps)  6 failures. crates/wcore-exec-backend/src/orphan.rs:321 is the ONLY
          #               call site that shells out; everything else reads /proc:
          #               "could not run 'ps' to enumerate processes: No such file or directory"
          #   bubblewrap  20 failures. NOTE: the package alone does NOT fix these -- measured,
          #               see the security-opt block on the test step below. It is necessary
          #               and not sufficient.
          RUN apt-get update -qq \
            && apt-get install -y -qq --no-install-recommends \
                 libdbus-1-dev libseccomp-dev libssl-dev libasound2-dev pkg-config mold ca-certificates git \
                 python3 procps bubblewrap \
            && rm -rf /var/lib/apt/lists/*
          RUN cargo install --locked cargo-nextest --version "^0.9"
          RUN cargo install --locked cargo-audit
          EOF

      - name: Pre-build tool_token_bench
        run: $DOCKER_RUN "$CI_IMAGE" cargo build -p wcore-agent --bin tool_token_bench --features test-utils

      - name: Pre-build wcore-cli release binary
        run: $DOCKER_RUN "$CI_IMAGE" cargo build --release -p wcore-cli

      - name: Check formatting
        run: $DOCKER_RUN "$CI_IMAGE" cargo fmt --all -- --check

      - name: Clippy (warnings = errors)
        run: $DOCKER_RUN "$CI_IMAGE" cargo clippy --workspace --all-targets -- -D warnings

      # Wrapped in a retry: the GHA runner-agent crash documented at the
      # top of this file (line 28: "reproducibly crashes the runner agent
      # ~56s into the nextest step") still hits this containerized job
      # occasionally — nextest reports "Cancelling due to signal: N tests
      # still running" with 0 actual test failures (1301 passed, 17
      # skipped, 0 failed) right before SIGTERM. The container workaround
      # eliminates the LOGS-NEVER-FLUSH variant but not the SIGTERM one.
      # Two attempts so a transient signal is absorbed without hiding a
      # genuine code-level test failure (which would fail both attempts).
      #
      # `--no-fail-fast` (2026-07-29): this command had drifted from
      # `just test-ci`, which has always carried the flag, and from the native
      # matrix leg above (line 164) which invokes `just test-ci` directly. Only
      # this containerized leg fail-fasted, and Linux is the ONLY platform that
      # runs here — so on the 2026-07-29 run nextest stopped at test 2,348 of
      # 12,775 and reported ONE failure where there were THREE. The consequence
      # is not limited to that run: every historical CI failure count on this
      # repository is a LOWER BOUND, not a total, and any triage that treated a
      # count as complete was reading a truncated suite.
      - name: Run tests (nextest CI profile)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 45
          max_attempts: 2
          command: $DOCKER_RUN_SANDBOX "$CI_IMAGE" cargo nextest run --workspace --profile ci --no-fail-fast

      # WCORE_SMOKE_REQUIRE_PREBUILT=1 (passed into the container): a missing
      # release artifact is a hard failure here, never a silent skip (#190).
      - name: Release binary smoke (catches plugin dead-code-strip)
        run: $DOCKER_RUN -e WCORE_SMOKE_REQUIRE_PREBUILT=1 "$CI_IMAGE" cargo nextest run -p wcore-cli --test release_binary_smoke

      # F01 E3 — non-optional packaged boundary proof. The release Core binary
      # built above reports this checkout's exact source SHA; wayland-eval then
      # verifies its digest and drives both PASS and hard-gate failure locally.
      - name: F01 packaged wayland-eval driver gate
        run: $DOCKER_RUN -e WAYLAND_BUILD_SOURCE_SHA=${{ github.sha }} "$CI_IMAGE" cargo test --locked -p wcore-eval-scenarios --features packaged-driver-gate --test packaged_driver_gate

      - name: Security audit
        run: $DOCKER_RUN "$CI_IMAGE" cargo audit

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-linux-containerized
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

      # 2026-07-29: this leg now runs WITH bubblewrap and WITH the namespace
      # grants (see DOCKER_RUN_SANDBOX above), so the expected count here is ZERO
      # and WCORE_REQUIRE_ENFORCING_SANDBOX=1 turns a skip into a test failure
      # rather than a warning. The step is kept because the count is still the
      # only channel that distinguishes "ran and enforced" from "qualified out":
      # nextest captures a PASSING test's output, so a skip that merely prints is
      # invisible in the run that matters — the file is the load-bearing channel.
      - name: Report sandbox skips (none expected now that the grant is in place)
        if: always()
        run: |
          if [ -f target/sandbox-skips.txt ]; then
            echo "::warning::sandbox-qualified skips recorded even though this leg carries the bwrap grant — the grant has regressed; see .planning/CI-IMAGE.md:"
            cat target/sandbox-skips.txt
            echo "count=$(wc -l < target/sandbox-skips.txt)"
          else
            echo "no sandbox-qualified skips recorded — the enforcing sandbox was live for this leg"
          fi

  # ── W10A eval-gate (Linux, containerized) ─────────────────────────────
  # The matrix ci: job above skips eval-gate on Linux because GHA's
  # ubuntu-latest direct shell execution crashes the runner agent at
  # ~56s reproducibly during this specific nextest invocation (logs
  # never flush — BlobNotFound 404; step stuck `in_progress` forever).
  # The crash is environmental, not a memory or code issue: the same
  # command runs cleanly in a 7GB-constrained x86_64 Linux container
  # (verified locally — 624 MB peak RSS, 0 cgroup oom_kills, passes in
  # ~80s compile + 0.118s run).
  #
  # This job runs the gate inside a controlled Docker container on the
  # ubuntu-latest runner, bypassing GHA's direct shell execution path.
  # Result: real Linux x86_64 coverage of the W10A acceptance gate,
  # reproducible by any contributor or customer who pulls the same
  # rust:1.95-slim-bookworm image.
  eval-gate-linux:
    name: Eval acceptance gate (Linux, containerized)
    runs-on: ubuntu-latest
    container:
      image: rust:1.95-slim-bookworm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq libdbus-1-dev libseccomp-dev libasound2-dev pkg-config mold ca-certificates

      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest --version "^0.9"

      - name: Eval acceptance gate (W10A precision/recall >= 0.80)
        run: cargo nextest run -p wcore-eval --features acceptance-gate acceptance_gate_meets_precision_recall_threshold --no-fail-fast --run-ignored only

  # ── Cross-platform build check (compile only, no run) ─────────────────
  # Verifies that the workspace compiles for every release target.
  # Mirrors the matrix in release.yml so CI catches compile regressions
  # before they reach the release workflow.
  build:
    name: Build (${{ matrix.target }})
    needs: budget
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Emitted by the `budget` job above. The full value reproduces the
      # six-entry `include:` list this replaced exactly — same `os`/`target`
      # keys, same `use_cross: true` on aarch64-linux — so every job name
      # (`Build (x86_64-apple-darwin)` …) and both artifact names are unchanged:
      #   {"include":[
      #     {"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
      #     {"os":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","use_cross":true},
      #     {"os":"windows-latest","target":"x86_64-pc-windows-msvc"},
      #     {"os":"windows-latest","target":"aarch64-pc-windows-msvc"},
      #     {"os":"macos-latest","target":"x86_64-apple-darwin"},        <- opt-in on lane/**
      #     {"os":"macos-latest","target":"aarch64-apple-darwin"}]}      <- opt-in on lane/**
      # The four non-Darwin targets are ALWAYS present, so this can never be
      # empty. Both Darwin entries are RETAINED unconditionally on `main`, on
      # the integration branch and on every PR — a 4-way cross-audit went 2-1
      # AGAINST dropping the redundant-looking aarch64 leg, because it is the
      # only job that UPLOADS the arm64 binary (ci.yml:600 below) and it does so
      # independently of whether the test suite passed, which is exactly when a
      # lane needs a binary most. The saving would have been ~1.2% of pool load.
      matrix: ${{ fromJSON(needs.budget.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v6

      # Linux: same disk + linker setup as the ci: job.
      # Native x86_64-unknown-linux-gnu needs libdbus-1-dev for the keyring
      # crate's transitive dep; cross-compile aarch64 is handled by the
      # cross docker image so doesn't need host libs.
      - name: Free disk space (drop unused preinstalled toolchains)
        if: runner.os == 'Linux' && matrix.use_cross != true
        run: |
          set -e
          echo "=== BEFORE ==="; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /home/linuxbrew
          echo "=== AFTER ==="; df -h /

      - name: Install Linux system deps (libdbus + libseccomp + mold linker)
        if: runner.os == 'Linux' && matrix.use_cross != true
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libseccomp-dev libasound2-dev pkg-config mold

      - name: Setup vx (installs Rust from vx.toml)
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (for cross-compiled targets)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [[ "${{ matrix.use_cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }} -p wcore-cli
          else
            vx cargo build --release --target ${{ matrix.target }} -p wcore-cli
          fi

      # The binary was already being built and then discarded. Keeping it makes
      # cross-platform live testing possible from a host that cannot compile for
      # the target — notably the arm64 macOS leg, where the planning Mac is
      # forbidden from running Cargo and the only other certified producer was an
      # ephemeral runner on that same machine. Without this the leg is
      # structurally unreachable and the only alternative is to record it unproven.
      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: wayland-core-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/wayland-core
            target/${{ matrix.target }}/release/wayland-core.exe
          if-no-files-found: error
          retention-days: 14

  # ── W10: Chromium live e2e (debt-register A.1) ───────────────────────
  # Closes A.1 — chromiumoxide live tests don't run in CI because runners
  # don't ship Chromium pre-installed. This job installs `chromium-browser`
  # via apt and runs the feature-gated `browser-live-tests` suite under
  # `wcore-browser`.
  #
  # SEPARATE from `ci:` on purpose: a Chromium install hiccup or a flaky
  # live spawn MUST NOT break the main lane. `continue-on-error: true`
  # is intentional for the first ship (matches the Z0 pattern Sean OK'd
  # for genuinely flaky live-network steps). Once we see >N consecutive
  # green runs we can flip it to gating.
  #
  # ubuntu-latest only — the apt path is well-defined; macOS/Windows
  # Chromium installs are slower + flakier and deferred to a future wave.
  browser-live:
    name: Browser live e2e (chromium)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Free disk space (drop unused preinstalled toolchains)
        run: |
          set -e
          echo "=== BEFORE ==="; df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /home/linuxbrew
          echo "=== AFTER ==="; df -h /

      - name: Install Chromium + mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser mold libdbus-1-dev libseccomp-dev libasound2-dev pkg-config

      - name: Setup vx (installs Rust + just from vx.toml)
        uses: loonghao/vx@v0.9.17
        with:
          setup: 'true'
          cache: 'true'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run live browser e2e
        env:
          # Tell the test where chromium lives — apt drops it at this path.
          # The fallback discovery in the test also checks /usr/bin/chromium-browser
          # but being explicit makes CI failures easier to triage.
          WCORE_CHROMIUM_PATH: /usr/bin/chromium-browser
        run: vx cargo nextest run -p wcore-browser --features browser-live-tests --test chromium_live_test

  # ── Annotate PR / commit with test results ────────────────────────────
  report:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    permissions:
      # NOTE: a job-level `permissions:` block REPLACES the workflow-level
      # one entirely (GHA semantics), so `contents: read` from the
      # workflow-level top of this file is dropped here unless re-listed.
      # Without it, GITHUB_TOKEN has no read access and actions/checkout
      # fails with "repository not found" (misleading — the repo exists,
      # the token just can't see it). Cost us multiple weeks of red
      # `report` jobs before getting tracked down.
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Download nextest JUnit artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nextest-junit-*
          merge-multiple: true
          path: junit-reports
        continue-on-error: true

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: hashFiles('junit-reports/**/*.xml') != ''
        with:
          name: Unit & Integration Tests
          path: junit-reports/**/*.xml
          reporter: java-junit
          fail-on-error: false
