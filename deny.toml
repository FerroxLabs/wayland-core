# cargo-deny configuration for wayland-core
# T3-9 (v0.6.2): final dependency-set audit gate.
#
# Policy:
#   - Permissive OSS licenses only. AGPL is implicitly denied by absence
#     (per BATTLE-PLAN: no AGPL in-process; AGPL is only acceptable via
#     subprocess MCP, which is out-of-process and not represented here).
#   - Yanked crates are denied.
#   - All deps must come from crates.io; unknown registries / git sources
#     require an explicit allow-list entry.
#   - Multiple-version drift is `warn` (transitive ecosystem reality, e.g.
#     windows-sys, hashbrown), not `deny`.

[graph]
# 2026-07-29 (lane 29-deny): flipped false -> true, DELIBERATELY, after measuring
# both settings. With `all-features = false` this gate evaluated only the
# DEFAULT-feature graph, which meant `paste`, `number_prefix` and
# `rustls-pemfile` — reachable only through optional, default-OFF features
# (`wcore-memory/bge-local`, `wcore-sandbox/live-docker`) — were not evaluated
# at all. `cargo tree -i paste@1.0.15` etc. WITHOUT `--all-features` reports
# "did not match any packages"; WITH it, all three appear.
#
# Why that mattered, and it is NOT the advisories: `cargo audit` and
# `.github/osv-scanner.toml` already read the whole `Cargo.lock`, so advisory
# coverage was duplicated. **Licenses and sources were not.** Nothing else in
# this repository checks the LICENSE of a dependency, so under the old setting a
# GPL/AGPL crate arriving through the `hf-hub` or `bollard` path would have
# passed every gate the repo has. That was an uncovered hole, not defence in
# depth.
#
# Measured cost of closing it, before committing to it:
#   cargo deny --all-features check licenses bans sources  -> exit 0, 0 errors
#   cargo deny --all-features check advisories             -> exit 1, exactly 3
#     additional error[unmaintained] (paste / number_prefix / rustls-pemfile)
# i.e. the price is exactly three more traced advisory exceptions and nothing
# else. All three are dispositioned below.
#
# Cross-audit was 2-1 in favour (gemini + kimi YES, codex NO). codex's dissent —
# that growing the exception list from 2 to 5 is the wrong trade in a repo whose
# documented failure mode is a bad exception — is recorded rather than dismissed,
# and is the reason every entry below carries a trace DERIVED here rather than a
# cross-reference to an existing one. (Deriving them is what caught two errors in
# the pre-existing dispositions; see `.github/osv-scanner.toml`.)
#
# One objection was raised and DISPROVED rather than argued: that
# `--all-features` would make the gate flaky on a workspace this size by
# enabling combinations that do not build. cargo-deny builds a *metadata* graph
# and never compiles anything, so non-building feature combinations cannot
# perturb it; the run completed and returned a verdict for all four sections.
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# Permissive license allowlist. Anything not on this list fails the gate.
# AGPL-*, GPL-*, LGPL-*, SSPL-*, Commons-Clause are intentionally absent.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
]
confidence-threshold = 0.93
exceptions = []

# `workspace-hack` is an internal `cargo hakari` feature-unification crate;
# it never publishes and has no license. Treat it as a first-party private
# crate so cargo-deny ignores its missing license field.
private = { ignore = true }

# ---------------------------------------------------------------------------
# Advisories (RUSTSEC)
# ---------------------------------------------------------------------------
[advisories]
# version = 2 schema (cargo-deny >= 0.14)
yanked = "deny"

# Populate ONLY with documented workarounds. Every entry must carry, at
# minimum: the advisory id, the DATE it was accepted, EVERY parent path with
# the path count stated explicitly, a reachability/threat note per path, the
# advisory's own `patched` / `unaffected` ranges READ OUT OF the RustSec source
# (not from memory), what would remove it, and a tracking item. Never a bare id.
#
# This list was EMPTY before 2026-07-29 and stayed empty on purpose while the
# gate was red — see `.cargo/audit.toml`, whose predecessor entry was found
# wrong in three ways at once (it named one parent path of three, its threat
# model covered only the path it named, and it claimed no upstream fix existed
# when three were published). That is the failure mode these rules exist to
# prevent.
#
# ── What was NOT done, and why it matters ──────────────────────────────────
# cargo-deny 0.18+ exposes `[advisories] unmaintained = "workspace"`, which
# would silence every TRANSITIVE unmaintained advisory in one line and turn
# this whole section green instantly. That is a policy weakening dressed as a
# config knob, and it is not taken. `unmaintained` is left at its default so a
# newly-unmaintained transitive still fails the gate loudly.
#
# ── Parent traces: methodology ─────────────────────────────────────────────
# Every trace below was READ OUT OF the tool, per the recipe in
# `.github/osv-scanner.toml`. `Cargo.lock` was first checked for MULTIPLE
# resolved versions of each crate (a crate can sit in the tree at several
# semver-incompatible versions at once, and a trace covering one of them is a
# blind spot). Each resolves to exactly ONE version, so one invocation each:
#
#   cargo tree -i bincode@1.3.3      --all-features --target all --edges normal,build,dev
#   cargo tree -i ttf-parser@0.25.1  --all-features --target all --edges normal,build,dev
#
# `--all-features --target all --edges normal,build,dev` is deliberately WIDER
# than the graph cargo-deny itself evaluates (deny.toml sets
# `all-features = false`), so the traces cover feature- and platform-gated
# paths the gate does not even look at. Each printed ONE path root.
#
# ── RUSTSEC-2025-0141 — bincode 1.3.3, "unmaintained" ──────────────────────
# Accepted 2026-07-29. Advisory source read from
# rustsec/advisory-db/crates/bincode/RUSTSEC-2025-0141.md:
#   informational = "unmaintained"; [versions] patched = []; NO `unaffected`.
# That is decisive and it kills the obvious-looking fix. bincode 2.0.1 and
# 3.0.0 ARE published — but with `patched = []` and no `unaffected` range,
# EVERY published version of the package is in scope, and the advisory's own
# url points at the v3.0 README announcing that development has permanently
# ceased. Bumping bincode does not clear this; only removing it does.
#
# PARENT PATHS: 1 (one, counted off the tree output, not asserted).
#
#   bincode v1.3.3
#   └── syntect v5.3.0
#       └── wcore-cli v0.12.25
#
# Reachability for that one path: bincode is syntect's serialization format for
# its BUNDLED, COMPILE-TIME-EMBEDDED syntax and theme dumps. wcore-cli reaches
# it from `crates/wcore-cli/src/tui/widgets/diff.rs`, which calls
# `SyntaxSet::load_defaults_newlines()` and `ThemeSet::load_defaults()` to
# highlight the TUI diff view. The deserialized bytes are the ones compiled
# into the syntect rlib; NO user-supplied or network-supplied data is fed to
# bincode on this path — syntect's `yaml-load` feature (the runtime
# `.sublime-syntax` loader) is already OFF at `Cargo.toml`, dropped by an
# earlier lane to eliminate `yaml-rust`/RUSTSEC-2024-0320. This is materially
# unlike the quick-xml case that predecessor entry got wrong: there the omitted
# paths parsed USER-SUPPLIED documents; here there is no second path to omit
# and no untrusted input on the only one.
#
# What would remove it: a syntect release that moves off bincode 1.x. syntect
# 5.3.0 is the LATEST published version (crates.io), so there is nothing to
# bump to. Dropping syntect's `dump-load` feature would remove bincode but also
# delete `default-syntaxes`/`default-themes`, i.e. TUI syntax highlighting —
# a functional regression traded for an informational advisory. Not taken.
#
# Tracking: `.planning/BACKLOG.md` -> `BL-F29-DENY-UNMAINTAINED`, and
# `.github/osv-scanner.toml` (RUSTSEC-2025-0141, ignoreUntil 2026-10-07).
#
# ── RUSTSEC-2026-0192 — ttf-parser 0.25.1, "unmaintained" ──────────────────
# Accepted 2026-07-29. Advisory source read from
# rustsec/advisory-db/crates/ttf-parser/RUSTSEC-2026-0192.md:
#   informational = "unmaintained"; [versions] patched = []; NO `unaffected`.
# The author has declared the crate unmaintained outright; no version clears it.
#
# PARENT PATHS: 1 (one root; it fans out across five first-party crates BELOW
# `wcore-tools`, which is fan-out of a single third-party chain, not a second
# supply-chain path):
#
#   ttf-parser v0.25.1
#   └── lopdf v0.42.0
#       └── pdf-extract v0.12.0
#           └── wcore-tools v0.12.25
#               ├── wcore-agent  (-> wcore-cli)
#               ├── wcore-browser (-> wcore-agent)
#               ├── wcore-cli
#               ├── wcore-cua    (-> wcore-agent)
#               └── wcore-mcp    (-> wcore-agent / wcore-cli / wcore-skills /
#                                    wcore-plugin-subprocess / wcore-eval /
#                                    wcore-evolve / wcore-eval-scenarios[dev])
#
# Reachability, stated honestly and NOT minimised: this path DOES touch
# untrusted input. `wcore-tools` extracts text from PDFs supplied by the user
# via the Read tool; ttf-parser parses embedded font tables from those files.
# That is a real parsing surface on attacker-influenced bytes. It is accepted
# ONLY because the advisory is `informational = "unmaintained"` with NO known
# vulnerability and NO patch in existence — there is nothing to apply. If a
# CONCRETE ttf-parser vulnerability is ever published, this entry must be
# deleted and the PDF path re-examined, not re-justified.
#
# What would remove it, and why it is out of reach here: `lopdf` made
# `ttf-parser` OPTIONAL in 0.44.0 (it is REQUIRED in 0.42.0), so a lopdf bump
# would drop it. But `pdf-extract 0.12.0` declares `lopdf = "^0.42"`, which for
# a 0.x crate resolves to `>=0.42.0, <0.43.0` — lopdf 0.44 is out of range —
# and pdf-extract 0.12.0 is the LATEST published pdf-extract. Reaching lopdf
# 0.44 therefore requires a `[patch]` override carrying a forked third-party
# crate, which makes the supply chain worse, not better. The upstream fix is
# pdf-extract/lopdf moving to `skrifa`; that is their decision, not ours.
#
# Tracking: `.planning/BACKLOG.md` -> `BL-F29-DENY-UNMAINTAINED`, and
# `.github/osv-scanner.toml` (RUSTSEC-2026-0192, ignoreUntil 2026-10-07).
#
# ── The three admitted by `all-features = true` ────────────────────────────
# These do NOT exist in the default-feature graph at all (`cargo tree -i
# <crate>@<ver>` without `--all-features` -> "did not match any packages" for
# each). They are evaluated only because this gate now covers optional features
# — which is the point: their LICENSES are now checked, and that check has no
# other home in this repo.
#
# All three are `informational = "unmaintained"`. Their traces below were
# re-derived from `cargo tree -i ... --all-features --target all --edges
# normal,build,dev --depth 1` (direct parents) and `--depth 2/3` (roots), NOT
# copied from `.github/osv-scanner.toml`. That re-derivation is what caught two
# errors in the pre-existing dispositions there, both now corrected in that file.
#
# ── RUSTSEC-2024-0436 — paste 1.0.15, "unmaintained" ───────────────────────
# Accepted 2026-07-29. Build-time proc-macro: it expands during compilation and
# has NO runtime surface and no runtime input.
#
# DIRECT PARENTS: 10 (counted off `--depth 1`) — gemm, gemm-c32, gemm-c64,
# gemm-common, gemm-f16, gemm-f32, gemm-f64, pulp, macro_rules_attribute,
# tokenizers. They collapse to TWO third-party roots, and BOTH terminate at the
# same first-party crate:
#
#   (a) paste <- {gemm*, pulp, gemm-common} <- candle-core 0.9.2
#                <- candle-nn / candle-transformers <- wcore-memory
#   (b) paste <- macro_rules_attribute 0.2.2 <- tokenizers 0.21.4 <- wcore-memory
#       (and paste <- tokenizers directly)
#
# Both roots are behind `wcore-memory`'s OPTIONAL, default-OFF `bge-local`
# feature (`dep:candle-core`, `dep:candle-nn`, `dep:candle-transformers`,
# `dep:tokenizers`, `dep:hf-hub`, `dep:safetensors`). Not in the shipped binary.
#
# CORRECTION TO THE PRIOR DISPOSITION: `.github/osv-scanner.toml` said paste was
# pulled by "the candle ML SIMD stack ... AND by ratatui". Measured here,
# **ratatui does not pull paste at all** (`cargo tree -p ratatui --all-features
# -e normal | grep -c paste` -> 0), and root (b), tokenizers, was omitted. That
# file is corrected in the same commit as this one.
#
# What would remove it: candle and tokenizers dropping paste upstream. No
# maintained drop-in replacement for the macro exists.
# Tracking: `.planning/BACKLOG.md` -> `BL-F29-DENY-UNMAINTAINED`.
#
# ── RUSTSEC-2025-0119 — number_prefix 0.4.0, "unmaintained" ────────────────
# Accepted 2026-07-29.
# DIRECT PARENTS: 1. Root chain:
#
#   number_prefix v0.4.0 <- indicatif 0.17.11 <- hf-hub 0.4.3 <- wcore-memory
#
# indicatif depends on number_prefix at every published version, so this is not
# reconfigurable from here; it would require hf-hub dropping indicatif upstream.
# hf-hub is behind the same OPTIONAL, default-OFF `bge-local` feature, so this
# is a progress-bar helper in a code path that is not in the shipped binary.
# Tracking: `.planning/BACKLOG.md` -> `BL-F29-DENY-UNMAINTAINED`.
#
# ── RUSTSEC-2025-0134 — rustls-pemfile 2.2.0, "unmaintained" ───────────────
# Accepted 2026-07-29. Deprecated because it was folded into rustls itself.
#
# DIRECT PARENTS: **2** — `bollard 0.17.1` AND `rustls-native-certs 0.7.3`.
# Both terminate at the same root, because rustls-native-certs 0.7.3 itself has
# exactly one parent, which is bollard:
#
#   rustls-pemfile v2.2.0
#   ├── bollard v0.17.1              <- wcore-sandbox
#   └── rustls-native-certs v0.7.3
#       └── bollard v0.17.1          <- wcore-sandbox
#
# bollard is OPTIONAL and default-OFF behind `wcore-sandbox`'s `live-docker`
# feature (`live-docker = ["dep:bollard", "dep:futures"]`), so it does not
# compile into the shipped binary.
#
# CORRECTION TO THE PRIOR DISPOSITION: `.github/osv-scanner.toml` said
# "Transitive ONLY via bollard". The *conclusion* survives — both edges converge
# on bollard — but the trace named one of two direct edges, and "only via X" was
# asserted where "two edges, one root" is the fact. Stated correctly here and
# corrected there.
#
# What would remove it: a bollard 0.17 -> 0.21 bump (four breaking majors) to
# clear a warning on a non-shipping optional backend. Not taken.
# Tracking: `.planning/BACKLOG.md` -> `BL-F29-DENY-UNMAINTAINED`.
#
# ── Eliminated at source rather than ignored (do NOT add these back) ───────
# RUSTSEC-2024-0370 (proc-macro-error 1.0.4) was the third unmaintained
# finding at this gate's baseline. It is GONE from `Cargo.lock`, not muted:
# its sole path was `proc-macro-error <- utoipa-gen 4.3.1 <- utoipa 4.2.3 <-
# wcore-acp <- wcore-cli`, and `utoipa-gen` 5.x dropped the dependency. The
# workspace pin moved `utoipa = "4.2"` -> `"5"`. Do NOT float utoipa back below
# 5 — it reintroduces this advisory.
#
# ROTATION POLICY: on every dependency bump, re-run
# `cargo deny --manifest-path Cargo.toml check` and DELETE any entry whose
# advisory has cleared. Re-derive the trace from `cargo tree -i` on every
# review; never carry a trace forward on trust. An empty list is the goal.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained (patched=[], no version clears it). ONE parent path, read from `cargo tree -i bincode@1.3.3 --all-features --target all`: bincode <- syntect 5.3.0 <- wcore-cli. Reachability: syntect's compile-time-embedded syntax/theme dumps only (SyntaxSet::load_defaults_newlines in tui/widgets/diff.rs); no user- or network-supplied bytes reach bincode on this path (syntect `yaml-load` already off). syntect 5.3.0 is the latest published release, so there is nothing to bump to; dropping `dump-load` would delete TUI syntax highlighting. Accepted 2026-07-29. Tracked: .planning/BACKLOG.md BL-F29-DENY-UNMAINTAINED + .github/osv-scanner.toml (ignoreUntil 2026-10-07). [trace crate=bincode@1.3.3 parents=syntect expires=2026-10-07]" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained. Build-time proc-macro, expands at compile time, NO runtime surface and no runtime input. TEN direct parents (`cargo tree -i paste@1.0.15 --all-features --target all --depth 1`: gemm, gemm-c32, gemm-c64, gemm-common, gemm-f16, gemm-f32, gemm-f64, pulp, macro_rules_attribute, tokenizers) collapsing to TWO roots, both terminating at wcore-memory: (a) candle SIMD stack <- candle-core <- candle-nn/candle-transformers <- wcore-memory; (b) macro_rules_attribute <- tokenizers <- wcore-memory. Both sit behind wcore-memory's OPTIONAL default-OFF `bge-local` feature and are absent from the default-feature graph entirely. NOTE: the prior disposition in .github/osv-scanner.toml named ratatui as a second puller — measured FALSE (ratatui pulls no paste) — and omitted the tokenizers root; corrected there in the same commit. Accepted 2026-07-29. Tracked: .planning/BACKLOG.md BL-F29-DENY-UNMAINTAINED. [trace crate=paste@1.0.15 parents=gemm,gemm-c32,gemm-c64,gemm-common,gemm-f16,gemm-f32,gemm-f64,macro_rules_attribute,pulp,tokenizers expires=2026-10-07]" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix 0.4.0 unmaintained. ONE direct parent. Root chain: number_prefix <- indicatif 0.17.11 <- hf-hub 0.4.3 <- wcore-memory, behind the OPTIONAL default-OFF `bge-local` feature; absent from the default-feature graph. indicatif depends on number_prefix at every published version, so it is not reconfigurable from here — removal requires hf-hub dropping indicatif upstream. Progress-bar helper on a path that is not in the shipped binary. Accepted 2026-07-29. Tracked: .planning/BACKLOG.md BL-F29-DENY-UNMAINTAINED. [trace crate=number_prefix@0.4.0 parents=indicatif expires=2026-10-07]" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 unmaintained (deprecated, folded into rustls). TWO direct parents, not one: bollard 0.17.1 AND rustls-native-certs 0.7.3 — and rustls-native-certs 0.7.3's own sole parent is bollard, so both edges converge on ONE root: bollard <- wcore-sandbox, behind the OPTIONAL default-OFF `live-docker` feature; absent from the default-feature graph. NOTE: the prior disposition in .github/osv-scanner.toml asserted `transitive ONLY via bollard` — the conclusion holds but the trace named one of two direct edges; corrected there in the same commit. Removal would need bollard 0.17 -> 0.21 (four breaking majors) to clear a warning on a non-shipping optional backend. Accepted 2026-07-29. Tracked: .planning/BACKLOG.md BL-F29-DENY-UNMAINTAINED. [trace crate=rustls-pemfile@2.2.0 parents=bollard,rustls-native-certs expires=2026-10-07]" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 unmaintained (patched=[], author declared EOL, no version clears it). ONE parent path, read from `cargo tree -i ttf-parser@0.25.1 --all-features --target all`: ttf-parser <- lopdf 0.42.0 <- pdf-extract 0.12.0 <- wcore-tools <- {wcore-agent, wcore-browser, wcore-cli, wcore-cua, wcore-mcp}. Reachability NOT minimised: this path DOES parse untrusted input (embedded font tables in user-supplied PDFs via the Read tool). Accepted only because the advisory is informational-unmaintained with no known vulnerability and NO patch in existence. lopdf made ttf-parser optional in 0.44.0, but pdf-extract 0.12.0 (latest) pins lopdf ^0.42 = >=0.42.0,<0.43.0, so reaching it needs a forked [patch] override — worse supply chain, not better. If a concrete ttf-parser CVE is ever published, DELETE this entry and re-examine the PDF path. Accepted 2026-07-29. Tracked: .planning/BACKLOG.md BL-F29-DENY-UNMAINTAINED + .github/osv-scanner.toml (ignoreUntil 2026-10-07). [trace crate=ttf-parser@0.25.1 parents=lopdf expires=2026-09-16]" },
]

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
