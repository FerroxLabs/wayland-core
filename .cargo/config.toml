# Test-thread stack size for the Windows swarm suite.
#
# WHY: five wcore-swarm tests aborted on Windows with 0xC00000FD
# (STATUS_STACK_OVERFLOW). This is NOT unbounded recursion — a stack-size sweep
# over the full suite measured: unset (2 MiB) -> aborts; 2359296 (2.25 MiB) -> 0;
# 4194304 -> 0; 33554432 -> 0. An unbounded recursion would overflow at EVERY
# size, so the requirement is BOUNDED at roughly 256 KiB above the 2 MiB default.
# The overflowing thread is the libtest-spawned TEST thread (its name is the test
# name); the tests are current-thread `#[tokio::test]`s driven by `block_on` on
# that same thread, so RUST_MIN_STACK governs it.
#
# VALUE RATIONALE: 8 MiB matches the unix main-thread default (which is why this
# class only bites on Windows) and is ~4x the 2.25 MiB that measurably sufficed,
# while staying small enough that the guard keeps meaning — a genuinely unbounded
# recursion still overflows at 8 MiB, so raising this cannot mask a runaway.
# Raising it to 32 MiB or beyond WOULD begin masking runaways and is refused.
#
# WHY HERE AND NOT IN `.config/nextest.toml`: nextest has no top-level `[env]`
# key. 0.9.138 warns `ignoring unknown configuration key: env` and the value
# never reaches the test process (measured: a 3 MiB probe thread still
# overflowed). nextest sources test environment from CARGO's configuration, so
# this file is the only config-file mechanism that works. The wider blast radius
# — every cargo-driven process, including build scripts and `cargo run` — is
# accepted because the alternative is no coverage at all. The value is a thread
# stack RESERVE, not committed memory, so the cost is negligible on 64-bit.
#
# `force = true` so the gate value is deterministic regardless of any ambient
# RUST_MIN_STACK in a developer or CI shell.
#
# MEASUREMENT TRAP — never verify this with a shell assignment: in `cmd`,
# `set VAR=value && cmd2` assigns "value " WITH A TRAILING SPACE, and
# `std::thread::min_stack()` parses with `.parse().ok()`, which fails on trailing
# whitespace and SILENTLY falls back to 2 MiB. Measured on SEANDESKTOP: with the
# unquoted `set` form a 3 MiB probe thread overflowed exactly as with no variable
# set at all, while `$env:RUST_MIN_STACK='8388608'` survived. Never take a
# successful assignment as proof the value applied — observe what the program
# parsed.
[env]
RUST_MIN_STACK = { value = "8388608", force = true }
