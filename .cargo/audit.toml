# cargo-audit configuration.
#
# Posture (re-measured 2026-07-29, lane 29-deny): `cargo audit` reports
# 0 vulnerabilities and **6** warning-class advisories (5 "unmaintained", 1
# "unsound"), exit 0, `warning: 6 allowed warnings found`. CI runs plain
# `cargo audit`, which does NOT fail on warning-class advisories — so the gate
# is green WITHOUT ignoring anything.
#
# (It was 7 earlier the same day. RUSTSEC-2024-0370 / proc-macro-error left the
# tree when the workspace moved utoipa 4.2 -> 5 — see the history list below.)
#
# The ignore list is EMPTY, and that is load-bearing rather than decorative:
# every advisory this repo has faced has been closed AT SOURCE, never muted.
# The 6 remaining warning-class advisories are left VISIBLE (not silenced) and
# are dispositioned — publicly, dated, with parent traces — in
# `.github/osv-scanner.toml`, which is the gating scanner, and (for the two
# that also fail `cargo deny`) in `deny.toml`. Duplicating those mutes here
# would only hide warnings we want to keep seeing on every run.
#
# NOTE on the division of labour, because the three files are NOT
# interchangeable: `cargo audit` does not fail on warning-class advisories, but
# **`cargo deny` DOES** — an "unmaintained" advisory is an `error[unmaintained]`
# there. So the empty list here costs nothing, while `deny.toml` genuinely must
# carry an exception for anything unmaintained that cannot be removed. As of
# 2026-07-29 that is exactly two of these six: bincode (RUSTSEC-2025-0141) and
# ttf-parser (RUSTSEC-2026-0192).
#
# The other four do NOT reach `cargo deny` — and the reason is a real scope
# difference that was MEASURED, not assumed. `cargo audit` reads `Cargo.lock`,
# i.e. every crate any feature can pull. `deny.toml` sets `[graph]
# all-features = false`, so `cargo deny` evaluates only the DEFAULT-feature
# graph, and `paste`, `number_prefix` and `rustls-pemfile` arrive through
# optional / default-OFF features (candle SIMD stack, hf-hub, bollard). Proof:
# `cargo deny --all-features check advisories` -> exit 1, three additional
# `error[unmaintained]` for exactly those three crates; the default-graph run
# -> exit 0. (`lexical-core`'s "unsound" advisory does not surface in cargo-deny
# at either setting.)
#
# So: a green `cargo deny` certifies the DEFAULT-feature graph, not the whole
# lockfile. That gap is covered by this file's scanner and by
# `.github/osv-scanner.toml`, both of which read the full lockfile — it is
# defence in depth, not an unwatched hole — but do not read a green `cargo
# deny` as broader than it is. See `deny.toml` for the standing decision on
# whether to widen it.
#
# History of source-level eliminations (each one previously an ignore entry):
#
#   * wasmtime / wasmtime-wasi (18 entries, masking CVSS 9.2 / 9.0) — fixed by
#     upgrading 30.x -> 36.0.10 once the bindgen async-syntax migration landed.
#   * RUSTSEC-2023-0071 (rsa, Marvin Attack) — jsonwebtoken migrated
#     `rust_crypto` -> `aws_lc_rs` in wcore-channel-msteams + wcore-providers,
#     dropping the pure-Rust `rsa` crate from the tree entirely
#     (`cargo tree -i rsa` -> not found). aws-lc-rs was already present via
#     rustls, so this added no build surface.
#   * lru "unsound" — eliminated by the ratatui 0.29 -> 0.30 upgrade.
#   * RUSTSEC-2026-0194 + RUSTSEC-2026-0195 (quick-xml DoS pair) — see below.
#   * RUSTSEC-2024-0370 (proc-macro-error, unmaintained) — eliminated
#     2026-07-29 by moving the workspace `utoipa` pin from "4.2" to "5".
#     `utoipa-gen` 4.x declares `proc-macro-error ^1.0` as a REQUIRED
#     dependency; `utoipa-gen` 5.x dropped it. `cargo tree -i
#     proc-macro-error@1.0.4` showed exactly one path (via utoipa <- wcore-acp)
#     and now reports "did not match any packages". Note this one could NOT
#     have been fixed by bumping the flagged crate: the advisory is
#     `patched = []`, so only removal works. Side effect: the `syn` 1.x/2.x
#     duplicate went away too (cargo-deny duplicate warnings 60 -> 59).
#     Do NOT float `utoipa` back below 5 — it reintroduces this advisory.
#
# ── quick-xml DoS pair: RUSTSEC-2026-0194 / RUSTSEC-2026-0195 ─────────────
# CLOSED AT SOURCE 2026-07-29 (F29-02-H1). Both were previously ignored here
# with a justification that was FACTUALLY WRONG in three ways, all corrected:
#
#   1. It claimed a "sole path" of quick-xml <- plist <- syntect <- wcore-cli.
#      There were in fact THREE paths. `cargo tree -i` at the base commit
#      showed, in addition to that one:
#        - quick-xml 0.39.4 <- wcore-tools  (a DIRECT dependency, declared in
#          crates/wcore-tools/Cargo.toml under the default-on `doc-extract`
#          feature), and
#        - quick-xml 0.31.0 <- calamine 0.26.1 <- wcore-tools.
#   2. Its UNREACHABLE threat model covered only the path it named. The two
#      omitted paths are `DocExtractTool`, which parses docx/pptx (quick-xml
#      directly) and xlsx/ods (through calamine) from USER-SUPPLIED FILES —
#      precisely the untrusted-input condition both advisories describe.
#   3. It asserted "no fix to take at source". Both advisories carry
#      `patched = [">= 0.41.0"]` with NO `unaffected` range, so 0.31.0 was in
#      scope too, and `cargo audit` reported FOUR findings (two advisories x
#      two versions), not two. quick-xml 0.41.0, plist 1.10.0 (requires
#      quick-xml ^0.41.0) and calamine 0.36.1 (requires quick-xml ^0.41) were
#      all published and un-yanked at the time the entry claimed otherwise.
#
# Fix applied: the workspace pins moved to `quick-xml = "0.41"` and
# `calamine = "0.36"`, and plist resolved 1.9.0 -> 1.10.0. quick-xml 0.31.0
# and 0.39.4 are now ABSENT from Cargo.lock — `cargo tree -i quick-xml@0.39.4`
# and `@0.31.0` both report "did not match any packages". Only 0.41.0 remains.
# No source changes were required in `crates/wcore-tools/src/doc_tool.rs`; the
# `Reader` / `Event` / `BytesText::decode` / calamine streaming-cell-reader
# surface it uses is unchanged across both upgrades, and extraction output is
# byte-identical before and after (proof:
# crates/wcore-tools/tests/doc_extract_quickxml_migration.rs).
#
# Rotation policy: on every dependency bump, re-run `cargo audit`. Do NOT float
# `quick-xml` below 0.41 or `calamine` below 0.36 — either would reintroduce
# this pair. If a real vulnerability ever needs a temporary documented
# exception, add it to `ignore` below WITH a parent trace covering EVERY path
# (verify with `cargo tree -i <crate>@<ver>` and count them — this entry's
# predecessor named one path of three), a threat-model note for each path, and
# a tracking item — never as a bare id, and never a trace asserted from memory
# rather than read out of the tool's output.
#
# THAT POLICY IS NOW ENFORCED, not merely stated (added 2026-07-30, lane
# f29-h1-advisories). Everything above this line was already true on 2026-07-29
# and it is prose: a comment cannot fail, so nothing stopped the next trace from
# drifting — and two others (`paste`, `rustls-pemfile` in `deny.toml`) had
# already drifted in exactly this way before anyone noticed by hand.
#
# `scripts/verify-suppression-traces.py` re-derives the parent set for every
# suppression in this file, `deny.toml` and `.github/osv-scanner.toml` straight
# out of `Cargo.lock` on every run, and FAILS on a mismatch in either direction —
# an omitted parent (the F29-02-H1 defect) or a parent that is not really there
# (the `paste`/ratatui defect). It also fails a mute whose crate has left the
# lockfile, and one past its expiry.
#
# So any entry added here must carry a machine-checkable trace tag:
#
#     [trace crate=<name>@<version> parents=<a,b,...|NONE> expires=<YYYY-MM-DD>]
#
# An entry without one FAILS the gate — prose is not a bypass. Wired into
# `just check-all` and into `.github/workflows/supply-chain.yml` with no `if:`
# guard, because a skipped gate reports the same green as a passing one.
# Derive the tag, do not type it: the parents come out of the lockfile.
#
# Format reference: https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]
ignore = []
