[template]
cargo_generate_version = ">=0.18.0"
# Files matched here are NOT copied into the generated user plugin —
# the smoke test belongs to the template author, not to plugins built
# from it. Without this exclusion, `cargo generate` would scaffold a
# `tests/template_smoke.rs` into every plugin, which is wrong.
ignore = ["tests/template_smoke.rs"]

[placeholders]
description = { type = "string", prompt = "Short description of the plugin", default = "A Wayland WASM tool plugin" }
# NOTE (F25-04): `authors` is NOT declared here. cargo-generate reserves
# `project-name`, `crate_name`, `crate_type`, `authors` and `os-arch` as
# built-ins and REFUSES the whole run when a template declares or overrides
# one of them:
#   Error: placeholder `authors` is not valid as you can't override ...
# `{{authors}}` still renders in the .liquid files -- cargo-generate supplies
# it as a built-in, derived from the user's git config.
