# TEST-THREAD STACK SIZE lives in `.cargo/config.toml`, NOT here.
#
# Do not re-add an `[env]` table to this file. cargo-nextest has NO top-level
# `[env]` key: 0.9.138 responds with
#   `warning: in config file .config/nextest.toml, ignoring unknown
#    configuration key: env`
# and the variable never reaches the test process — measured on SEANDESKTOP, a
# 3 MiB probe thread still overflowed with the table present. nextest sources
# test environment from CARGO's configuration (see nextest_runner::cargo_config::
# env), so `.cargo/config.toml` is the only config-file mechanism that works.
# The full stack-size rationale is recorded there.

# ── Anti-vacuity: an invocation that matches ZERO tests must FAIL ──────────
#
# THIS FILE USED TO CARRY `no-tests = "fail"` UNDER `[profile.default]`.
# IT NEVER WORKED. Measured 2026-07-29 on hetzner-dsm with cargo-nextest
# 0.9.137, printed on EVERY `nextest run` and `nextest list` this repo has ever
# executed:
#
#   warning: in config file .config/nextest.toml, ignoring unknown
#            configuration key: profile.default.no-tests
#
# There is no such profile key (it is absent from nexte.st/schemas/repo-config.json).
# `no-tests` is a CLI option only: `--no-tests=fail|pass|warn`. Verified both
# directions on the SAME empty binary, so this is measured, not inferred:
#   `nextest run --no-tests=fail --test packaged_driver_gate` -> rc=4, "no tests to run"
#   `nextest run --no-tests=pass --test packaged_driver_gate` -> rc=0
#
# The fail-closed behaviour the repo has been getting is therefore the CLI
# DEFAULT of whatever nextest is installed — which is exactly the dependency
# the deleted key's own comment said it existed to remove. The intent was
# right; the mechanism was a no-op reporting reassurance.
#
# THE REPLACEMENT, which IS honoured (measured: `required = "0.9.200"` against
# an installed 0.9.137 aborts with `error: this repository requires nextest
# version 0.9.200, but the current version is 0.9.137`):
#
# The floor is set to the oldest version whose zero-test behaviour has actually
# been MEASURED on this repo — 0.9.137 — not to the oldest version that might
# happen to work. `vx.toml` declares nextest as `nextest = "cargo nextest"`
# with no version, and CI installs are unpinned (`tool: nextest`) or `^0.9`,
# so without this floor any 0.9.x could supply a permissive default.
nextest-version = { required = "0.9.137" }

[profile.default]
# Belt and braces for the gates that must never be vacuous: the
# release-integrity invocations additionally pass `--no-tests=fail` explicitly
# at the call site, so they do not depend on any default at all. See
# .github/workflows/{ci,supply-chain}.yml and the justfile
# `f01-packaged-driver-gate` / `harness` recipes.
#
# The population this protects, re-measured 2026-07-29 (the previous comment
# here claimed 22; a full-file scan — the old count used a truncated
# head-of-file window and missed gates below it — gives 44):
#   44 test binaries carry a file-level `#![cfg(...)]`
#      17 feature-gated, 27 platform-gated,
#   23 more have every case `#[ignore]`d,
#   out of ~488 integration-test binaries reachable by a bare `cargo test`.
# Each compiles or collects to EMPTY under the wrong feature/platform/filter
# and prints `test result: ok`. `cargo test` has no fail-closed option at all,
# which is why `scripts/check-no-vacuous-cargo-test.py` forbids bare
# `cargo test` in the justfile, workflows and scripts.

# Local dev: friendly output, show failures immediately
failure-output = "immediate"
success-output = "never"
status-level = "pass"
final-status-level = "flaky"
# Retry flaky tests once locally
retries = 1
# Per-test timeout (seconds)
slow-timeout = { period = "30s", terminate-after = 2 }
test-threads = "num-cpus"

# ── junit.path is relative to the PROFILE STORE DIR, not the workspace root ──
#
# All four `junit.path` keys in this file used to read
# `path = "target/nextest/<profile>/junit.xml"`. That is the doubled form.
# nextest resolves `junit.path` against the profile's store directory, which is
# ALREADY `target/nextest/<profile>/`, so those values produced
#   target/nextest/ci/target/nextest/ci/junit.xml
# and the path every consumer looks at, `target/nextest/ci/junit.xml`, has never
# existed on any platform in this repository's history.
#
# Measured on hetzner-dsm 2026-08-01, both directions on the same tree:
#   before: find target/nextest -name junit.xml
#             -> target/nextest/ci/target/nextest/ci/junit.xml        (2.7 MB)
#             -> target/nextest/default/target/nextest/default/junit.xml
#           ls target/nextest/ci/junit.xml -> No such file or directory
#   after (path = "junit.xml"), one real `--profile ci` run:
#             -> target/nextest/ci/junit.xml                          (21 KB)
#
# What this silently broke, everywhere, for as long as it has been wrong:
#   * `Upload nextest JUnit report` uploaded NOTHING on every leg. It carries
#     `if-no-files-found: ignore`, so it reported success while producing no
#     artifact.
#   * The per-leg `Assert this leg produced test signal` gate could never pass.
#     Worse, it fails with the text "cargo-nextest never ran on this leg ...
#     a shell/interpreter mismatch on Windows does exactly this" — on the very
#     run where Windows executed 13,352 tests. A gate that cannot pass, whose
#     failure text names the wrong cause, is worse than no gate.
#   * The aggregate `Assert test evidence exists` gate in the `report` job
#     counts downloaded *.xml and fails closed at zero — so it too could never
#     pass, and `Publish test report` had nothing to publish.
#
# If you ever change these, verify by RUNNING nextest and looking at where the
# file lands. Do not reason about it from the key name.
[profile.default.junit]
# Generate JUnit XML for local tooling if wanted
path = "junit.xml"

# Per-test overrides (same philosophy as the CI profile): the genuinely-heavy
# tests get an explicit, documented exception instead of loosening everyone's
# 30s budget.
#
# The full-engine-build cohort — every test that constructs a real
# `AgentBootstrap` (the `bootstrap_*` binaries in wcore-agent, the
# `bootstrap_with_ollama_*` / `*_is_registered_in_bootstrap` cases) or the full
# tool registry (`registry_inventory_snapshot` in wcore-cli) — runs ~38s in
# isolation and 40-55s under full-parallel load on a contended dev machine.
# That crosses the 30s slow line, and kill-after-2x terminates them at 60s
# mid-run even though they pass on CI (90s budget) and in isolation. Give this
# cohort the same headroom CI already has so a busy laptop doesn't false-fail
# the workspace suite. (Found 2026-06-01: a stray busy-loop stealing a core
# pushed 10 of these past 60s and fail-fast aborted the whole run; the tests
# themselves were never hung — just slow under load.)
[[profile.default.overrides]]
filter = 'binary(/bootstrap/) or binary(/registry_inventory_snapshot/) or test(/bootstrap/)'
slow-timeout = { period = "90s", terminate-after = 2 }

# `fix1_dispatch_budget_aborts_with_partial_result` is slow INHERENTLY, not
# merely under load, which is why it gets its own entry rather than joining the
# cohort above. Measured 2026-07-27: it completes in 65.97s under `cargo test`
# and the abort it asserts on works correctly — the 60s death under this profile
# (30s x kill-after-2) was a harness kill, never a hang, and the "it hangs"
# reading was investigated and DISPROVED rather than assumed. The cost is real
# and is recorded so it stays visible: ~47ms of inline CPU per dispatch in a
# debug build, 44.8ms of it inside `engine.run()`, against 6.9ms in release.
# Note this test already PASSES in CI, whose 90s x 2 = 180s budget covers it;
# only the stricter local default profile killed it, so this aligns the two
# rather than loosening either.
#
# A HIGH concurrency defect was suspected here (`buffer_unordered` measuring
# 0.96x across widths 1/4/20) and then RETRACTED: varying only provider latency
# gives 0.96x / 2.0x / 8.0x at 0 / 50 / 500ms, so the 1x was an artifact of a
# zero-latency fixture and the pipeline does stream in production. Filed LOW as
# `pipeline-cpu-floor`. If that LOW is ever fixed this override should shrink,
# so it is deliberately scoped to the one test.
#
# `retries` is left at the profile default: this test shells out to no build, so
# a retry costs only its own runtime (same reasoning as the packaged_f04 entry).
[[profile.default.overrides]]
filter = 'test(=fix1_dispatch_budget_aborts_with_partial_result)'
slow-timeout = { period = "120s", terminate-after = 2 }

# The F01 packaged-driver gate drives the REAL packaged `wayland-core` binary
# through complete scenario runs — three of them in the identity test alone,
# plus a live MCP fixture, a live egress fixture, a materialized repository and
# two `wayland-receipt` invocations. It is long because it is end-to-end, not
# because anything in it hangs.
#
# MEASURED, hetzner-dsm (96 cores), warm cache, `--profile eval` (test-threads
# = 1, so these are isolated single-test costs, not contended ones):
#   packaged_candidate_cannot_replace_authenticated_egress_evidence   36.99s
#   packaged_core_proves_capability_unavailability_and_outcome        54.68s
#   packaged_lifecycle_memory_matrix_has_real_effects_and_quarantine  80.94s
#   packaged_core_identity_and_driver_gates_are_enforced             100.07s
#
# Against the global default budget (30s x kill-after-2 = 60s) TWO of those
# four are terminated mid-run and a third sits 5s under the line. Both the CI
# job (.github/workflows/ci.yml) and the `f01-packaged-driver-gate` justfile
# recipe invoke this binary with NO `--profile`, so the default profile is what
# governs the gate in practice — that is, the gate could not pass on time even
# when every assertion in it holds. A gate that cannot reach a pass state
# proves as little as one that cannot fail.
#
# `period` is deliberately set BELOW the slowest measured run (60s < 100s), so
# nextest still prints the "running for over 60 seconds" notice on every run
# and the cost stays visible in the log instead of being silently absorbed.
# terminate-after = 5 gives a 300s hard kill, 3x the slowest measured test —
# headroom for a contended scheduler slot, and still a real ceiling.
#
# Scoped to the binary, not the workspace: nothing else's budget moves.
[[profile.default.overrides]]
filter = 'binary(packaged_driver_gate)'
slow-timeout = { period = "60s", terminate-after = 5 }

# `bash_unsaved_guard_bound_live` — the SAME shape as the override above, found
# the same way, and recorded here rather than left to be rediscovered.
#
# Its three bounded-guard cases each grow a real workspace fixture on disk and
# then measure the guard against a caller budget. On NTFS that CONSTRUCTION is
# the whole cost, and it lands within a few seconds of the default profile's
# 60s hard kill.
#
# MEASURED on SEANDESKTOP (Windows 11 build 10.0.26200.9168, real msvc), the
# binary alone with nothing else scheduled, the two profiles back to back on
# one tree (b52fb934) with the interpreter and the binaries identical:
#     default profile  Summary [  60.026s] 4 tests run: 1 passed, 3 timed out
#                      each killed at exactly 60.024-60.025s
#     --profile ci     Summary [  52.485s] 4 tests run: 4 passed
#                      the three finish at 52.482-52.484s
# So the work takes ~52s and the default budget is 60s. Nothing is wrong with
# the tests; the budget is inside the noise.
#
# Why this matters beyond one binary: `just test-ci` and the ci.yml legs pass
# `--profile ci` (90s x 2 = 180s) and these pass there, but
# `scripts/wayland-e2e-windows-soak.ps1` PHASE G invokes nextest with NO
# `--profile`, so the soak — the one job whose green is #350's close condition —
# graded them at 60s. That is a gate that cannot reach a pass state, which is
# the failure this file's `packaged_driver_gate` note already names.
#
# `terminate-after = 3` gives a 180s hard kill, matching the ci profile's own
# ceiling so the two agree, and `period` stays at 60s so nextest keeps printing
# the "running for over 60 seconds" notice and the cost stays visible.
[[profile.default.overrides]]
filter = 'binary(bash_unsaved_guard_bound_live)'
slow-timeout = { period = "60s", terminate-after = 3 }

# THE DATA-LOSS ARMS MUST NOT BE RETRYABLE IN THE SOAK EITHER (FerroxLabs/wayland-core#350).
#
# The block at the bottom of this file pins `inv2_round5_adversarial_test` to
# `retries = 0`, and explains at length why: every assertion in that binary is a
# data-loss assertion, so a race that loses a save on one attempt and wins on the
# next must NOT report the run as SUCCESS. That reasoning is not repeated here.
#
# What was missed is that the pin is `[[profile.ci.overrides]]` ONLY.
# `scripts/wayland-e2e-windows-soak.ps1` PHASE G invokes nextest with NO
# `--profile`, so it runs under `[profile.default]`, where `retries = 1` (line 70)
# applies. MEASURED, not argued: soak run 33266413002 PHASE G shows
# `TRY 1 TMT [  60.010s]` then `TRY 2 TMT [  60.019s]` for each of three timeouts,
# so the default profile really is spending a retry on that job. The soak is the
# one job whose green is #350's close condition, and it could have retried a lost
# save into a pass.
#
# KNOWN RESIDUAL, stated rather than left to be found: the other four `retries = 0`
# overrides in this file (`pipeline_test`, the two deny-walk timing tests, and the
# three harness-ownership binaries) are still ci-only, so the soak can still retry
# THOSE. Only the data-loss binary is mirrored here, because only it went red on a
# Windows leg this cycle (core#387 c3).
[[profile.default.overrides]]
filter = 'binary(=inv2_round5_adversarial_test)'
retries = 0

# `walk_parallel_identity_test`'s two TIMING cases build a 15,000-file fixture
# before they measure anything (`a_disjoint_grant_really_does_cost_a_second_walk`
# builds two), and on NTFS that CONSTRUCTION, not the measurement, is the whole
# cost.
#
# MEASURED on SEANDESKTOP (Windows 11 26200, real msvc), the binary alone with
# nothing else scheduled, arms INTERLEAVED across v0.13.5 (addb4f48) and this
# branch so a load ramp lands on both:
#     redundant_walk_root_is_not_walked_twice      base 17.04s, 17.14s   i136 19.43s
#     a_disjoint_grant_really_does_cost_a_second_walk
#                                                  base 34.40s, 40.47s   i136 36.27s
# and the WALK those tests actually grade, from their own eprintln in the same
# runs:
#     redundant, baseline median   base 20.09 ms, 21.08 ms   i136 18.94 ms
#     disjoint,  baseline median   base 19.62 ms, 22.85 ms   i136 21.91 ms
#
# So ~20 ms of subject sits underneath 17-40 s of fixture; the fixture cost
# moves 6 s between consecutive runs of the SAME binary on the SAME tree; and
# the #1111 deny-set memo did NOT slow the walk -- this branch's medians land
# inside v0.13.5's own spread, and both assertions are RATIOS between two
# policies over one tree, which no constant factor can move in either direction.
#
# Under `--profile ci` (90s x 2 = 180s) both cases pass on both trees. Under
# this stricter default profile (30s x 2 = 60s) the disjoint case ALREADY died
# at v0.13.5 inside the full Windows suite, and both died on this branch -- a
# cap crossed by fixture construction under full-suite load, not by anything
# either test asserts. This aligns the local budget with the CI one for these
# two rather than loosening either: 60s x 3 = 180s is exactly the CI ceiling,
# and `period` is deliberately set BELOW the measured worst case so nextest
# still prints the "running for over 60 seconds" notice and the cost stays
# visible in the log instead of being silently absorbed.
#
# Scoped to the binary, so nothing else's budget moves and a genuinely hung
# walk still dies.
[[profile.default.overrides]]
filter = 'binary(walk_parallel_identity_test)'
slow-timeout = { period = "60s", terminate-after = 3 }

# ── CI profile ─────────────────────────────────────────────────────────────
[profile.ci]
# In CI: always show output for failed tests, machine-readable JUnit
failure-output = "immediate-final"
success-output = "never"
# `"retry"`, NOT `"fail"`. This is the profile every CI leg runs under, so it is
# the only nextest output anyone ever reads — and with `"fail"` a retried-away
# failure left NO trace of itself at all.
#
# MEASURED on Windows CI run 30699019736, job 91372229704 (the `CI (Array)`
# leg). Its log contains:
#     6  `FLAKY` lines
#    66  `TRY 3 FAIL` lines
#     0  `TRY 1` lines
#     0  `TRY 2` lines
# `FLAKY 3/3` means the test failed TWICE and passed on the third attempt, so
# those six lines account for at least eight failed attempts whose panic
# message, stdout and stderr were all discarded. One of them,
# `wcore-swarm::worker_runtime_limits
# multi_worker_output_exhaustion_fails_without_retaining_buffers`, was
# `FLAKY 3/3` in that run AND in run 30698794888 before it — four consecutive
# failed attempts, no diagnostic surviving from any of them, and the summary
# line counted it as passed both times.
#
# nextest's status levels are ordered
#   none < fail < retry < slow < leak < pass < skip < all
# so `"fail"` prints only the FINAL status. `"retry"` adds every intermediate
# attempt with its captured output. REPRODUCED BOTH DIRECTIONS on hetzner-dsm
# against a purpose-built test that fails on attempt 1 and passes on attempt 2,
# same binary, same `retries = 2`, only this key changed:
#   status-level = "fail"   -> `Summary ... 1 passed (1 flaky)` and
#                              `FLAKY 2/3`. Nothing else. No TRY line, no panic
#                              message, no stderr.
#   status-level = "retry"  -> `TRY 1 FAIL`, the captured stdout/stderr, the
#                              `deliberate failure on attempt 1` panic, then
#                              `TRY 2 PASS`.
# The other two retrying profiles were checked and are already safe: `default`
# is at `"pass"` and `eval` at `"all"`, both of which sit above `"retry"` in
# that order (verified by running the same probe under `"pass"` -- TRY 1 FAIL
# printed).
#
# This changes ONLY what is printed. No test, timeout, retry count or selector
# moves. It costs some log volume on a run with retries in it; a run with no
# retries prints exactly what it printed before.
status-level = "retry"
final-status-level = "all"
# Retry flaky tests up to 2 times in CI
retries = 2
# Bumped from 60s after CI run 25950354044 — Ubuntu CI cold caches made
# several normal tests cross the 60s slow line, and kill-after-2x meant
# they died at 120s. 90s headroom × 2 = 180s before kill is enough for
# any non-pathological test.
slow-timeout = { period = "90s", terminate-after = 2 }
test-threads = "num-cpus"

# Per-test overrides: tests that genuinely take longer than the global
# slow-timeout get explicit, documented exceptions instead of bumping
# everyone's budget.
[[profile.ci.overrides]]
# W12 tool-token bench smoke shells out to `cargo run --bin
# tool_token_bench`. The CI workflow pre-builds that binary in a
# step BEFORE `vx just test-ci`, so the test should hit warm cache
# and finish in ~30s. Retries=0 because retrying a slow-cargo-run
# just compounds (CI run 25952102095 hit kill-after-2x on 3 attempts).
filter = 'test(=scripted_run_writes_expected_markdown)'
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 0

# release_binary_smoke tests shell out to `cargo build --release` if the
# binary doesn't exist. The CI workflow pre-builds it; this override
# gives the test cohort enough headroom on Windows where mandatory
# file locks make even read-only target/ checks slower than Linux/macOS
# (CI run 25953795604 — `release_binary_ready_event_advertises_plugin_
# capabilities` hung on file lock against parallel tests).
[[profile.ci.overrides]]
filter = 'test(/release_binary_/)'
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 0

# `packaged_f04_run_is_repeatable_and_content_addressed` drives the sealed F04
# artifact through TWO complete packaged runs and then cross-checks every
# content-addressed digest between them. It is genuinely long, not hung.
#
# MEASURED, not assumed (hetzner-dsm, 96 cores, warm cache, 60565c53, the test
# alone in its process with nothing else scheduled):
#     run 1: `test result: ok. 1 passed ... finished in 188.43s`
#     run 2: `test result: ok. 1 passed ... finished in 188.03s`
#     wall 3:08, user 185.02s, sys 3.34s → ~98% of ONE core for the whole run
# It PASSES in isolation. Both spawned `wayland-core` children live under two
# seconds each (2s process sampling caught each exactly once); the cost is
# in-process work in the test, not a stalled child, and every wait in the
# harness is already bounded (30s scenario guard, 5s child reap, 5s cgroup
# drain). So THIS TEST NEEDS ~188s; the global CI budget kills at
# 90s × 2 = 180s, which it crosses by ~8s even with zero contention. That is
# the entire failure: it was terminated ~4% short of finishing.
#
# Override set to 120s × 4 = 480s hard kill — 2.55× the measured 188s, enough
# headroom for a contended scheduler slot. `period` is deliberately set BELOW
# the measured runtime rather than above it, so nextest still prints the
# "running for over 120 seconds" notice on every run and the cost stays
# visible in the log instead of being silently absorbed.
#
# `retries` is deliberately NOT set to 0 here (unlike the two overrides above).
# Those two shell out to `cargo`, so a retry re-pays a build; this one does
# not, and leaving the CI default keeps it identical to every other test.
#
# The global slow-timeout is untouched.
[[profile.ci.overrides]]
filter = 'test(=packaged_f04_run_is_repeatable_and_content_addressed)'
slow-timeout = { period = "120s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# ── E2E profile ─────────────────────────────────────────────────────────────
# Run with: cargo nextest run --profile e2e --test e2e
[profile.e2e]
failure-output = "immediate"
success-output = "immediate"
status-level = "all"
final-status-level = "all"
# No retries for e2e — failures are real
retries = 0
# E2E tests can be slow (real API calls)
slow-timeout = { period = "120s", terminate-after = 2 }
# Run sequentially to avoid hammering the API
test-threads = 1

[profile.e2e.junit]
path = "junit.xml"

# ── EVAL profile ─────────────────────────────────────────────────────────────
# Per cross-audit M-6 (serialize per-provider to avoid hammering provider
# rate-limits in the matrix) + M-3 (retries=2 absorbs transient noise so
# remaining failures are real signal). Used by `wcore-eval-scenarios` —
# `just eval` invokes nextest with `--profile eval`.
[profile.eval]
failure-output = "immediate"
success-output = "immediate"
status-level = "all"
final-status-level = "all"
# M-3: retries absorb transient provider noise; remaining failures are real.
retries = 2
# Scenarios drive real LLMs over multi-step tool chains; budgets per
# scenario are tight in source but the slow-timeout is the outer guard.
slow-timeout = { period = "300s", terminate-after = 2 }
# M-6: serialize so provider rate limits don't fail-cross-contaminate.
test-threads = 1

[profile.eval.junit]
path = "junit.xml"

# ── Native Windows live-containment serialization (F20-43, belt-and-braces) ──
# The `#![cfg(windows)]` `#[ignore]`d native containment / ACL acceptance
# targets both spawn `choice.exe` idlers on the self-hosted msvc runner. The
# containment count is already scoped to each test's own tagged process tree
# (by ParentProcessId), so correctness does not depend on this group — it is a
# defense-in-depth measure that serializes the two `choice`-spawning targets so
# they never overlap on one runner. `platform = 'cfg(windows)'` restricts the
# override to Windows targets: on Linux (the Hetzner aggregate, `--profile ci`)
# these files compile to empty binaries and the override does not apply, so the
# 11509/0/48 aggregate is untouched. Concurrency only — no test or selector is
# added or removed.
[test-groups]
native-windows-live = { max-threads = 1 }

[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'binary(/hard_process_containment_windows/) or binary(/live_fs_acl/)'
test-group = 'native-windows-live'

# ---------------------------------------------------------------------------
# wcore-swarm process/timing tests: reserve capacity so they are not starved.
#
# MEASURED, 2026-07-31, hetzner-dsm (96 cores), the merge test gate:
#   * Full workspace, `--profile ci --no-fail-fast`: one wcore-swarm test failed
#     per run and it was a DIFFERENT test each time --
#       run B  wcore-swarm::heartbeat_test worker_writes_heartbeat_during_long_running_task
#       run C  wcore-swarm worktree::tests::linux::status_output_cap_kills_git_descendant
#     at the SAME commit, while run A at a neighbouring commit was clean. So 2 of
#     3 full runs reddened, on a rotating cast.
#   * wcore-swarm ALONE, `--profile ci`, 3 reps: 150 tests run, 150 passed, every
#     time, in ~2.2 s.
#   * The heartbeat test alone: 16 consecutive passes, including with eight
#     background `cargo check` jobs running.
#   * `retries = 2` is already set for this profile, so each of those failures
#     was a test failing THREE times inside the suite and passing 16/16 outside it.
#
# THE TWO FAILURES HAD DIFFERENT CAUSES, and only one of them belongs here.
# Recorded separately because "they were both flaky under load" is the kind of
# summary that hides a real bug inside a scheduling excuse:
#
#   * status_output_cap_kills_git_descendant was NOT a scheduling problem. It
#     failed in 0.057s with `ParseIntError { kind: Empty }`: the fixture script
#     writes its child PID with `printf ... > $FILE`, and `>` creates the file
#     EMPTY before printf writes, so the test read zero bytes and unwrapped the
#     parse. Load only widened a window that was always open. FIXED AT SOURCE in
#     crates/wcore-swarm/src/worktree_tests/linux.rs -- it now polls for a
#     parseable PID. That fix, not this override, is what closed it.
#
#   * worker_writes_heartbeat_during_long_running_task was read as genuine
#     starvation, and that reading is what this override was written for. It
#     was described as: polls every 40ms, must observe >=3 DISTINCT heartbeats
#     from a worker emitting them 150ms apart over a ~450ms life, so missing
#     enough 40ms ticks makes the count come up short even though the worker
#     behaved perfectly.
#
# CORRECTION, 2026-08-23 (wayland#1114). That mechanism is no longer real, and
# a comment describing a mechanism that is not real is worse than no comment.
# `695ce601` -- test(swarm): rendezvous the heartbeat e2e instead of sampling it
# (#286), an ancestor of the current main -- rewrote the test. The worker now
# BLOCKS on an ack file the observer writes after reading each heartbeat, and
# the observer polls at 10ms, not 40ms. No heartbeat can be emitted inside a
# poll gap any more, however badly either side is scheduled, so the sample-and-
# hope window the paragraph above describes cannot open. The test file says so
# itself, in the comment beside the ack loop.
#
# So BOTH failures recorded above are now fixed at source, and neither of them
# is evidence for this override today. Note also what was never measured: no
# scheduler delay was ever observed. "Passes alone, fails in the suite" is
# equally consistent with any load-widened window -- which is exactly what the
# sibling failure turned out to be.
#
# The override is KEPT, and this is the reason, stated as what it is rather than
# borrowed from a dead diagnosis: removing it is itself an unmeasured scheduling
# change, and it costs almost nothing. Measured on hetzner-dsm at v0.13.5:
# wcore-swarm alone is 157 tests in 4.1s, all passing. `threads-required`
# reserves slots from the global pool for the test's duration (a test-group with
# `max-threads` would not -- groups bound concurrency WITHIN the group, and the
# pressure comes from the other ~13,450 tests in the run).
#
# TRIGGER FOR REMOVAL, so this does not just decay into permanence: delete this
# override the next time anyone runs the full `--profile ci` suite three times
# with it removed and sees wcore-swarm clean in all three. That is a smaller
# experiment than the one that installed it.
#
# This is a SCHEDULING change only. No test, assertion, timeout, or selector is
# added, removed, or loosened -- a starved test still fails, it just is not
# starved by our own runner. If any of these ever fails again, that failure is
# real and must be treated as real.
[[profile.ci.overrides]]
filter = 'package(wcore-swarm)'
threads-required = 4

# ── PTY/TUI tests: no retry mask, and a starvation claim the tree refutes ────
#
# THIS BLOCK USED TO SAY the failures below were reader-thread starvation
# producing a STALE FRAME, and that `threads-required = 4` was the remedy.
# Both halves are refuted by the runs they were written from. Recorded rather
# than deleted, because "flaky under load" is exactly the place a real defect
# hides (see the wcore-swarm block above, which makes the same warning).
#
# WHAT WAS MEASURED, GitHub-hosted `macos-latest`:
#   * v0.13.4 `main`, run 32442806629 job 96656678340:
#     `wcore-cli::path_boundary_tui_pty approving_once_leaves_the_read_refused_by_the_sandbox`
#     TRY 1/2/3 FAIL at 31.096s / 30.698s / 30.915s. Run conclusion: failure.
#   * v0.13.5 `main` (addb4f48), run 32613130982 job 97129254675, WITH this
#     override already in the tree: TRY 1 FAIL 30.996s, TRY 2 FAIL 30.956s,
#     TRY 3 PASS 1.567s. Run conclusion: SUCCESS.
#   * The sibling `a_on_the_boundary_card_grants_the_folder_and_the_read_succeeds`
#     PASSED in 1.656s inside that same failing run.
#
# WHY "STALE FRAME" IS WRONG. The captured screen from that failing try renders
# the status bar as `... | $0.00 + unpriced | 29s`. That last field is
# `format_duration(app.session.turn_started_at.elapsed())`
# (crates/wcore-cli/src/tui/widgets/statusbar.rs) — a value only a LIVE repaint
# can produce, ~29s into a test that died at 30s. The same frame carries the
# IDLE keybar (`Tab next tab  ...`), which
# `crates/wcore-cli/src/tui/surfaces/workspace.rs` renders only when the run is
# no longer streaming. A vt100 parser 30s behind the child cannot show a clock
# reading 29s. The harness was watching a CURRENT frame of a session that had
# genuinely produced no answer.
#
# WHY `threads-required` IS NOT THE REMEDY. It was already in the tree for the
# v0.13.5 run above and the test still burned two full 30s deadlines there. A
# mitigation that does not move the failure rate must not be described as one.
# It is KEPT — reserving capacity for a test that drives a real binary on a pty
# is right on its own terms and costs nothing on a 96-core host — but it is no
# longer offered as an explanation.
#
# WHY `retries` IS 0 HERE, and only here. `[profile.ci] retries = 2` is why this
# survived into a shipped release: nextest reports a run as SUCCESS when a
# retry passes, so run 32613130982 read green while this test failed twice at
# ~31s inside it. `status-level = "retry"` keeps the `TRY n FAIL` lines in the
# log, but the run CONCLUSION is what release gates, dashboards and humans
# read, and that conclusion was wrong. Retries are the right default for a
# 15,000-test suite; they are the wrong default for a small, named set of
# end-to-end binaries whose flake IS the bug under investigation. Scoped to
# exactly the binaries in the filter — every other test keeps `retries = 2`.
#
# Consequence, stated plainly: this makes the macOS leg go RED while
# FerroxLabs/wayland#1109 is open, instead of green-with-a-buried-TRY-line.
# That is the intent. Do not raise it back to hide the failure.
[[profile.ci.overrides]]
filter = 'binary(path_boundary_tui_pty) + binary(goal_control_tui_pty) + binary(smoke_p0) + binary(config_unknown_keys_visible) + binary(p2_open_admission_entry_points) + binary(f21_02_01_child_tool_authority) + binary(f21_02_child_budget_live)'
threads-required = 4
retries = 0

# ── pipeline_test: deterministic now, so do not let a retry hide a relapse ───
#
# `[profile.ci] retries = 2` is why FerroxLabs/wayland#1101 survived: a flaky
# test that passes on a retry reports the RUN as SUCCESS, so CI could not tell
# the flake from a real barrier regression in `pipeline(over, stages)` — the one
# thing this binary exists to catch.
#
# MEASURED on hetzner-dsm (96 cores), same test binary within each arm:
#   * origin/main, `no_barrier_fast_item_finishes_all_stages_before_slow_
#     finishes_stage_one` alone, sequential, n=60: 0 failures.
#   * origin/main, full binary, 64 concurrent processes, n=256: 156 failures
#     (60.9 %) — the flake is competing tokio runtimes ACROSS processes, which
#     is exactly what nextest's process-per-test model produces.
#   * After the causal StageGate fix, the SAME arm: 0 of 256 at 64 concurrent
#     and 0 of 512 at 128 concurrent, and no OTHER test in this binary failed
#     across all 768 of those runs. That is what licenses scoping this to the
#     binary rather than to the one test.
#
# So the ordering these tests assert is now enforced by construction, not by
# racing a sleep, and a failure here is signal. `retries = 0` makes that signal
# reach the run conclusion instead of a buried `TRY n FAIL` line. Same reasoning
# and same scope discipline as the PTY block above: every other test keeps
# `retries = 2`.
#
# Note the fixed test detects a reintroduced barrier by a 30s gate expiry, well
# inside this profile's 90s slow-timeout, so a regression reports as an ordinary
# assertion failure rather than a harness kill.
[[profile.ci.overrides]]
filter = 'binary(=pipeline_test)'
retries = 0

# ── #1146: the three tests whose Windows verdict churns ─────────────────────
#
# MEASURED (FerroxLabs/wayland#1146): on a commit whose TREE OBJECT is
# byte-identical to `main`, `CI (windows-latest, hosted)` failed exactly these
# three on ALL THREE tries, while the same tree passed on both self-hosted
# Windows services. main's own recorded green had that leg SKIPPED, so the
# green was never earned and the red could not be attributed to a tree.
#
# WHY `retries` IS 0 HERE. `[profile.ci] retries = 2` reports a test that
# failed twice and passed once as PASSED in the run CONCLUSION — the thing
# release gates, dashboards and humans read. For a test whose flake IS the
# thing under investigation, that is the one number that must not be laundered.
# Same reasoning and same scope discipline as the two blocks above: this names
# three tests, and every other test in the suite keeps `retries = 2`.
#
# There is a second, compounding reason specific to the two bash ones. They
# carry their own in-test re-attempt loop (`RACE_ATTEMPTS = 3`,
# crates/wcore-tools/src/bash/tests.rs), so nextest retries were stacking on
# top of an internal retry: three attempts times three, with only the last
# failure ever printed. Retries here bought nine tries and one line of
# evidence.
#
# Consequence, stated plainly: while #1146 is open this makes a Windows leg go
# RED where it used to read green-with-a-buried-TRY-line. That is the intent —
# an unattributable green is what the issue was filed about. Do not raise it
# back to hide the failure.
#
# The exact-match spellings differ because the binary does: the two bash tests
# are unit tests inside the `wcore-tools` lib binary, so their nextest test
# name carries the module path; the third is a top-level fn in an integration
# binary. THE MODULE PATH IS LOAD-BEARING —
# `test(=the_bash_timeout_bounds_the_secret_deny_walk)` is a valid filterset
# that selects zero tests, so dropping it would leave this block here and the
# two tests back at `retries = 2` with nothing to show for it.
#
# `scripts/check-windows-attribution.py` fails if any of the three stops being
# a literal operand of a `test(...)` predicate in a `retries = 0` override —
# spelling included, comments not counted. It cannot resolve a filterset, so it
# cannot see a rename: `just check-windows-attribution-live` runs the same
# check with `cargo nextest list` as the oracle, and also proves no override
# ABOVE this one sets `retries` for these tests first. Run it if you rename or
# move any of the three.
[[profile.ci.overrides]]
filter = 'test(=bash::tests::the_bash_timeout_bounds_the_secret_deny_walk) + test(=bash::tests::the_streaming_bash_timeout_bounds_the_secret_deny_walk) + test(=matching_assistant_dials_scoped_deferred_server)'
retries = 0

# ── #1155: the TOCTOU race whose regression must not be retryable ───────────
#
# FerroxLabs/wayland#1155 is "an Edit can overwrite a save that arrives while
# the guard is checking it (TOCTOU), AND retries=2 hides it". The first half is
# fixed (`atomic_write_checked` publishes through `RENAME_EXCHANGE`); this block
# is the second half. Without it `inv2_round5_adversarial_test` sat under
# `[profile.ci] retries = 2` with no override at all, so a reintroduced race
# that lost a save on one attempt and won on the next would report the RUN as
# SUCCESS — the number release gates, dashboards and humans read — with the
# evidence buried in a `TRY 1 FAIL` line.
#
# MEASURED on hetzner-dsm, `--profile ci`, a probe in THIS binary that fails on
# its first attempt and passes on any retry (the exact shape a race takes):
#   * without this block: `TRY 1 FAIL`, `TRY 2 PASS`,
#     `Summary 1 test run: 1 passed (1 flaky)`, cargo exit 0 — laundered green.
#   * with this block:    `FAIL`, `Summary 1 test run: 0 passed, 1 failed`,
#     cargo exit 100 — the failure reaches the run conclusion.
#
# The same tree also reddens the real thing: with the exchange withdrawn and the
# check window held open, `an_in_place_save_is_not_lost_to_the_final_rename`
# fails with "4 of 12 interleavings lost". A regression here is signal.
#
# Scoped to the binary, same discipline as the three blocks above: every other
# test in the suite keeps `retries = 2`. Every assertion in this file is a
# data-loss assertion, so none of them may be retried into a pass.
[[profile.ci.overrides]]
filter = 'binary(=inv2_round5_adversarial_test)'
retries = 0

# ── #358 c4: a containment verdict must not be retried into a pass ──────────
#
# MECHANISM, not instance. These three binaries are the whole of this crate's
# RUNTIME process-containment grading: they each end in "this pid is / is not a
# process any more" after a guard was dropped. Both directions of that verdict
# are races against the scheduler, and both are laundered by a retry:
#
#   * OVER-kill (harness_guard_kills_only_its_own_tree) — the guard reaps a
#     sibling tree. `kill(pid, SIGKILL)` returns while the signal is merely
#     pending, so the victim still looks live for a scheduling quantum.
#   * UNDER-kill (harness_owns_spawned_trees, ..._windows) — the guard leaks a
#     descendant. Detected by a process still being there after a 10s budget,
#     which a loaded box can turn into a slow pass.
#
# MEASURED on hetzner-dsm (96 cores), `--retries 0`, guard mutated to walk from
# the child's PPid so it reaps its sibling — an over-broad kill the control is
# supposed to catch every time:
#   * sampled liveness, sequential:     n=20, 19 detected, 1 missed (5.0 %)
#   * sampled liveness, 8 concurrent:   n=80, 71 detected, 9 missed (11.3 %)
# At `[profile.ci] retries = 2` an 11.3 % per-attempt miss is a 30 % chance the
# run CONCLUSION — the number release gates, dashboards and humans read —
# reports a guard that reaped the build agent's siblings as PASSED, with the
# evidence buried in a `TRY 1 FAIL` line. That is the same laundering
# FerroxLabs/wayland#1101 and #1155 were filed about.
#
# The per-attempt miss is now 0 (the control probes the bystander with a round
# trip instead of sampling its liveness — see the module docs), so this block is
# not compensating for a flake: it is what keeps a REINTRODUCED one visible
# instead of retried away. `every_spawn_site_owns_its_tree` is deliberately NOT
# here — it is a static source ratchet with no process in it and nothing for a
# retry to hide.
#
# Scoped to three binaries, same discipline as the four blocks above: every
# other test in the suite keeps `retries = 2`.
[[profile.ci.overrides]]
filter = 'binary(=harness_guard_kills_only_its_own_tree) + binary(=harness_owns_spawned_trees) + binary(=harness_owns_spawned_trees_windows)'
retries = 0

# ── core#362 c4: a containment probe that never ran must not be retried ─────
#
# MEASURED, CI run 33240249894. Both bwrap tests failed with
# ExecFailed("sandbox process-tree ownership: No such file or directory (os
# error 2)") and were RETRIED INTO A PASS. The second one's own panic says what
# that costs:
#
#   the sandbox backend refused to run the containment probe, so no containment
#   property was tested
#
# The run conclusion then said SUCCESS. A containment test that proved nothing
# reported green, which is strictly worse than having no test: it is a green
# that a human reads as "the sandbox confines writes".
#
# WHY `retries = 0` AND NOT AN ALLOWLIST ENTRY. The retry-flake gate would
# catch this only while nobody writes the entry, and an entry is exactly what
# was written for these two tests to unblock the 0.13.11 cut. Retrying is the
# mechanism that erases the evidence, so the fix has to be that the retry does
# not happen — not that a second gate notices it afterwards.
#
# SCOPE, and why it is these two binaries and no others. The vacuous outcome is
# produced in exactly one place, `run_contained_probe`
# (crates/wcore-sandbox/src/test_support.rs), which panics rather than
# returning a degraded result when the backend refuses to spawn or the child
# leaves no liveness markers. Its callers are `backend_integration` and
# `secret_read_deny`, and only those. Every other test in the suite keeps its
# retries.
#
# BOTH PROFILES, deliberately. `[profile.default] retries = 1` (line 70) is
# what a bare `cargo nextest run` uses, and a `[[profile.ci.overrides]]`-only
# pin has already been shipped once in this file and silently missed local and
# self-hosted runs. See the #1101 block above for that lesson.
#
# ANTI-ROT: `containment_probe_retries.rs` in this crate FAILS if a third
# caller of `run_contained_probe` appears without its binary being named here,
# and fails if either name stops being a literal `binary(=...)` operand of a
# `retries = 0` override. An enumeration nothing checks is an enumeration that
# rots on the next test somebody writes.
[[profile.default.overrides]]
filter = 'binary(=backend_integration) + binary(=secret_read_deny)'
retries = 0

[[profile.ci.overrides]]
filter = 'binary(=backend_integration) + binary(=secret_read_deny)'
retries = 0
