# TEST-THREAD STACK SIZE lives in `.cargo/config.toml`, NOT here.
#
# Do not re-add an `[env]` table to this file. cargo-nextest has NO top-level
# `[env]` key: 0.9.138 responds with
#   `warning: in config file .config/nextest.toml, ignoring unknown
#    configuration key: env`
# and the variable never reaches the test process — measured on SEANDESKTOP, a
# 3 MiB probe thread still overflowed with the table present. nextest sources
# test environment from CARGO's configuration (see nextest_runner::cargo_config::
# env), so `.cargo/config.toml` is the only config-file mechanism that works.
# The full stack-size rationale is recorded there.

# ── Anti-vacuity: an invocation that matches ZERO tests must FAIL ──────────
#
# THIS FILE USED TO CARRY `no-tests = "fail"` UNDER `[profile.default]`.
# IT NEVER WORKED. Measured 2026-07-29 on hetzner-dsm with cargo-nextest
# 0.9.137, printed on EVERY `nextest run` and `nextest list` this repo has ever
# executed:
#
#   warning: in config file .config/nextest.toml, ignoring unknown
#            configuration key: profile.default.no-tests
#
# There is no such profile key (it is absent from nexte.st/schemas/repo-config.json).
# `no-tests` is a CLI option only: `--no-tests=fail|pass|warn`. Verified both
# directions on the SAME empty binary, so this is measured, not inferred:
#   `nextest run --no-tests=fail --test packaged_driver_gate` -> rc=4, "no tests to run"
#   `nextest run --no-tests=pass --test packaged_driver_gate` -> rc=0
#
# The fail-closed behaviour the repo has been getting is therefore the CLI
# DEFAULT of whatever nextest is installed — which is exactly the dependency
# the deleted key's own comment said it existed to remove. The intent was
# right; the mechanism was a no-op reporting reassurance.
#
# THE REPLACEMENT, which IS honoured (measured: `required = "0.9.200"` against
# an installed 0.9.137 aborts with `error: this repository requires nextest
# version 0.9.200, but the current version is 0.9.137`):
#
# The floor is set to the oldest version whose zero-test behaviour has actually
# been MEASURED on this repo — 0.9.137 — not to the oldest version that might
# happen to work. `vx.toml` declares nextest as `nextest = "cargo nextest"`
# with no version, and CI installs are unpinned (`tool: nextest`) or `^0.9`,
# so without this floor any 0.9.x could supply a permissive default.
nextest-version = { required = "0.9.137" }

[profile.default]
# Belt and braces for the gates that must never be vacuous: the
# release-integrity invocations additionally pass `--no-tests=fail` explicitly
# at the call site, so they do not depend on any default at all. See
# .github/workflows/{ci,supply-chain}.yml and the justfile
# `f01-packaged-driver-gate` / `harness` recipes.
#
# The population this protects, re-measured 2026-07-29 (the previous comment
# here claimed 22; a full-file scan — the old count used a truncated
# head-of-file window and missed gates below it — gives 44):
#   44 test binaries carry a file-level `#![cfg(...)]`
#      17 feature-gated, 27 platform-gated,
#   23 more have every case `#[ignore]`d,
#   out of ~488 integration-test binaries reachable by a bare `cargo test`.
# Each compiles or collects to EMPTY under the wrong feature/platform/filter
# and prints `test result: ok`. `cargo test` has no fail-closed option at all,
# which is why `scripts/check-no-vacuous-cargo-test.py` forbids bare
# `cargo test` in the justfile, workflows and scripts.

# Local dev: friendly output, show failures immediately
failure-output = "immediate"
success-output = "never"
status-level = "pass"
final-status-level = "flaky"
# Retry flaky tests once locally
retries = 1
# Per-test timeout (seconds)
slow-timeout = { period = "30s", terminate-after = 2 }
test-threads = "num-cpus"

[profile.default.junit]
# Generate JUnit XML for local tooling if wanted
path = "target/nextest/default/junit.xml"

# Per-test overrides (same philosophy as the CI profile): the genuinely-heavy
# tests get an explicit, documented exception instead of loosening everyone's
# 30s budget.
#
# The full-engine-build cohort — every test that constructs a real
# `AgentBootstrap` (the `bootstrap_*` binaries in wcore-agent, the
# `bootstrap_with_ollama_*` / `*_is_registered_in_bootstrap` cases) or the full
# tool registry (`registry_inventory_snapshot` in wcore-cli) — runs ~38s in
# isolation and 40-55s under full-parallel load on a contended dev machine.
# That crosses the 30s slow line, and kill-after-2x terminates them at 60s
# mid-run even though they pass on CI (90s budget) and in isolation. Give this
# cohort the same headroom CI already has so a busy laptop doesn't false-fail
# the workspace suite. (Found 2026-06-01: a stray busy-loop stealing a core
# pushed 10 of these past 60s and fail-fast aborted the whole run; the tests
# themselves were never hung — just slow under load.)
[[profile.default.overrides]]
filter = 'binary(/bootstrap/) or binary(/registry_inventory_snapshot/) or test(/bootstrap/)'
slow-timeout = { period = "90s", terminate-after = 2 }

# `fix1_dispatch_budget_aborts_with_partial_result` is slow INHERENTLY, not
# merely under load, which is why it gets its own entry rather than joining the
# cohort above. Measured 2026-07-27: it completes in 65.97s under `cargo test`
# and the abort it asserts on works correctly — the 60s death under this profile
# (30s x kill-after-2) was a harness kill, never a hang, and the "it hangs"
# reading was investigated and DISPROVED rather than assumed. The cost is real
# and is recorded so it stays visible: ~47ms of inline CPU per dispatch in a
# debug build, 44.8ms of it inside `engine.run()`, against 6.9ms in release.
# Note this test already PASSES in CI, whose 90s x 2 = 180s budget covers it;
# only the stricter local default profile killed it, so this aligns the two
# rather than loosening either.
#
# A HIGH concurrency defect was suspected here (`buffer_unordered` measuring
# 0.96x across widths 1/4/20) and then RETRACTED: varying only provider latency
# gives 0.96x / 2.0x / 8.0x at 0 / 50 / 500ms, so the 1x was an artifact of a
# zero-latency fixture and the pipeline does stream in production. Filed LOW as
# `pipeline-cpu-floor`. If that LOW is ever fixed this override should shrink,
# so it is deliberately scoped to the one test.
#
# `retries` is left at the profile default: this test shells out to no build, so
# a retry costs only its own runtime (same reasoning as the packaged_f04 entry).
[[profile.default.overrides]]
filter = 'test(=fix1_dispatch_budget_aborts_with_partial_result)'
slow-timeout = { period = "120s", terminate-after = 2 }

# ── CI profile ─────────────────────────────────────────────────────────────
[profile.ci]
# In CI: always show output for failed tests, machine-readable JUnit
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "all"
# Retry flaky tests up to 2 times in CI
retries = 2
# Bumped from 60s after CI run 25950354044 — Ubuntu CI cold caches made
# several normal tests cross the 60s slow line, and kill-after-2x meant
# they died at 120s. 90s headroom × 2 = 180s before kill is enough for
# any non-pathological test.
slow-timeout = { period = "90s", terminate-after = 2 }
test-threads = "num-cpus"

# Per-test overrides: tests that genuinely take longer than the global
# slow-timeout get explicit, documented exceptions instead of bumping
# everyone's budget.
[[profile.ci.overrides]]
# W12 tool-token bench smoke shells out to `cargo run --bin
# tool_token_bench`. The CI workflow pre-builds that binary in a
# step BEFORE `vx just test-ci`, so the test should hit warm cache
# and finish in ~30s. Retries=0 because retrying a slow-cargo-run
# just compounds (CI run 25952102095 hit kill-after-2x on 3 attempts).
filter = 'test(=scripted_run_writes_expected_markdown)'
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 0

# release_binary_smoke tests shell out to `cargo build --release` if the
# binary doesn't exist. The CI workflow pre-builds it; this override
# gives the test cohort enough headroom on Windows where mandatory
# file locks make even read-only target/ checks slower than Linux/macOS
# (CI run 25953795604 — `release_binary_ready_event_advertises_plugin_
# capabilities` hung on file lock against parallel tests).
[[profile.ci.overrides]]
filter = 'test(/release_binary_/)'
slow-timeout = { period = "180s", terminate-after = 2 }
retries = 0

# `packaged_f04_run_is_repeatable_and_content_addressed` drives the sealed F04
# artifact through TWO complete packaged runs and then cross-checks every
# content-addressed digest between them. It is genuinely long, not hung.
#
# MEASURED, not assumed (hetzner-dsm, 96 cores, warm cache, 60565c53, the test
# alone in its process with nothing else scheduled):
#     run 1: `test result: ok. 1 passed ... finished in 188.43s`
#     run 2: `test result: ok. 1 passed ... finished in 188.03s`
#     wall 3:08, user 185.02s, sys 3.34s → ~98% of ONE core for the whole run
# It PASSES in isolation. Both spawned `wayland-core` children live under two
# seconds each (2s process sampling caught each exactly once); the cost is
# in-process work in the test, not a stalled child, and every wait in the
# harness is already bounded (30s scenario guard, 5s child reap, 5s cgroup
# drain). So THIS TEST NEEDS ~188s; the global CI budget kills at
# 90s × 2 = 180s, which it crosses by ~8s even with zero contention. That is
# the entire failure: it was terminated ~4% short of finishing.
#
# Override set to 120s × 4 = 480s hard kill — 2.55× the measured 188s, enough
# headroom for a contended scheduler slot. `period` is deliberately set BELOW
# the measured runtime rather than above it, so nextest still prints the
# "running for over 120 seconds" notice on every run and the cost stays
# visible in the log instead of being silently absorbed.
#
# `retries` is deliberately NOT set to 0 here (unlike the two overrides above).
# Those two shell out to `cargo`, so a retry re-pays a build; this one does
# not, and leaving the CI default keeps it identical to every other test.
#
# The global slow-timeout is untouched.
[[profile.ci.overrides]]
filter = 'test(=packaged_f04_run_is_repeatable_and_content_addressed)'
slow-timeout = { period = "120s", terminate-after = 4 }

[profile.ci.junit]
path = "target/nextest/ci/junit.xml"

# ── E2E profile ─────────────────────────────────────────────────────────────
# Run with: cargo nextest run --profile e2e --test e2e
[profile.e2e]
failure-output = "immediate"
success-output = "immediate"
status-level = "all"
final-status-level = "all"
# No retries for e2e — failures are real
retries = 0
# E2E tests can be slow (real API calls)
slow-timeout = { period = "120s", terminate-after = 2 }
# Run sequentially to avoid hammering the API
test-threads = 1

[profile.e2e.junit]
path = "target/nextest/e2e/junit.xml"

# ── EVAL profile ─────────────────────────────────────────────────────────────
# Per cross-audit M-6 (serialize per-provider to avoid hammering provider
# rate-limits in the matrix) + M-3 (retries=2 absorbs transient noise so
# remaining failures are real signal). Used by `wcore-eval-scenarios` —
# `just eval` invokes nextest with `--profile eval`.
[profile.eval]
failure-output = "immediate"
success-output = "immediate"
status-level = "all"
final-status-level = "all"
# M-3: retries absorb transient provider noise; remaining failures are real.
retries = 2
# Scenarios drive real LLMs over multi-step tool chains; budgets per
# scenario are tight in source but the slow-timeout is the outer guard.
slow-timeout = { period = "300s", terminate-after = 2 }
# M-6: serialize so provider rate limits don't fail-cross-contaminate.
test-threads = 1

[profile.eval.junit]
path = "target/nextest/eval/junit.xml"

# ── Native Windows live-containment serialization (F20-43, belt-and-braces) ──
# The `#![cfg(windows)]` `#[ignore]`d native containment / ACL acceptance
# targets both spawn `choice.exe` idlers on the self-hosted msvc runner. The
# containment count is already scoped to each test's own tagged process tree
# (by ParentProcessId), so correctness does not depend on this group — it is a
# defense-in-depth measure that serializes the two `choice`-spawning targets so
# they never overlap on one runner. `platform = 'cfg(windows)'` restricts the
# override to Windows targets: on Linux (the Hetzner aggregate, `--profile ci`)
# these files compile to empty binaries and the override does not apply, so the
# 11509/0/48 aggregate is untouched. Concurrency only — no test or selector is
# added or removed.
[test-groups]
native-windows-live = { max-threads = 1 }

[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'binary(/hard_process_containment_windows/) or binary(/live_fs_acl/)'
test-group = 'native-windows-live'

# ---------------------------------------------------------------------------
# wcore-swarm process/timing tests: reserve capacity so they are not starved.
#
# MEASURED, 2026-07-31, hetzner-dsm (96 cores), the merge test gate:
#   * Full workspace, `--profile ci --no-fail-fast`: one wcore-swarm test failed
#     per run and it was a DIFFERENT test each time --
#       run B  wcore-swarm::heartbeat_test worker_writes_heartbeat_during_long_running_task
#       run C  wcore-swarm worktree::tests::linux::status_output_cap_kills_git_descendant
#     at the SAME commit, while run A at a neighbouring commit was clean. So 2 of
#     3 full runs reddened, on a rotating cast.
#   * wcore-swarm ALONE, `--profile ci`, 3 reps: 150 tests run, 150 passed, every
#     time, in ~2.2 s.
#   * The heartbeat test alone: 16 consecutive passes, including with eight
#     background `cargo check` jobs running.
#   * `retries = 2` is already set for this profile, so each of those failures
#     was a test failing THREE times inside the suite and passing 16/16 outside it.
#
# THE TWO FAILURES HAD DIFFERENT CAUSES, and only one of them belongs here.
# Recorded separately because "they were both flaky under load" is the kind of
# summary that hides a real bug inside a scheduling excuse:
#
#   * status_output_cap_kills_git_descendant was NOT a scheduling problem. It
#     failed in 0.057s with `ParseIntError { kind: Empty }`: the fixture script
#     writes its child PID with `printf ... > $FILE`, and `>` creates the file
#     EMPTY before printf writes, so the test read zero bytes and unwrapped the
#     parse. Load only widened a window that was always open. FIXED AT SOURCE in
#     crates/wcore-swarm/src/worktree_tests/linux.rs -- it now polls for a
#     parseable PID. That fix, not this override, is what closed it.
#
#   * worker_writes_heartbeat_during_long_running_task IS genuine starvation, and
#     is why this override exists. It polls every 40ms and must observe >=3
#     DISTINCT heartbeats from a worker emitting them 150ms apart over a ~450ms
#     life. Miss enough 40ms ticks and the observation count comes up short even
#     though the worker behaved perfectly. Nothing in the test's logic is wrong;
#     it just has to be scheduled to see what it is watching.
#
# `threads-required` is the lever that matches THAT cause. A test-group with
# `max-threads` would not: groups bound concurrency WITHIN the group, and the
# pressure comes from the other ~13,450 tests in the run. `threads-required`
# reserves slots from the global pool for the test's duration, which is exactly
# the contended resource.
#
# Scoped to the whole package deliberately. wcore-swarm is 150 tests that finish
# in 2.2s, so reserving capacity across all of them is close to free, and this
# crate is where the observe-a-live-process tests live. Cheaper than a gate people
# learn to re-run until it is green.
#
# This is a SCHEDULING change only. No test, assertion, timeout, or selector is
# added, removed, or loosened -- a starved test still fails, it just is not
# starved by our own runner. If any of these ever fails again, that failure is
# real and must be treated as real.
[[profile.ci.overrides]]
filter = 'package(wcore-swarm)'
threads-required = 4
